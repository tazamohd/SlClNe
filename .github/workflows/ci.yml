# SALIS AUTO — continuous integration.
#
# The pipeline only runs checks that exist. Suites still being built (unit,
# component, API, mobile, RTL, a11y, visual, golden paths) are absent rather
# than stubbed green — a job that reports success without running anything is
# the CI equivalent of a screen that renders a total it did not compute. They
# are added as each wave lands them; docs/MASTER_TEST_STRATEGY.md tracks who
# owns which.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Typecheck, build and gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit, component and integration tests
        run: npm run test --if-present

      - name: Build
        run: npm run build

      - name: Registry is current
        run: |
          npm run registry
          cd ..
          git diff --exit-code -- project-control/ docs/ app/src/data/generated/master-registry.ts \
            || { echo "::error::The committed registry is stale. Run 'npm run registry' in app/ and commit the result."; exit 1; }

      - name: No placeholders or fake completion
        run: npm run check-no-fake

      - name: Design tokens and brand palette
        run: npm run check-tokens

      - name: Upload the gap report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gap-report
          path: |
            project-control/MASTER_REGISTRY.json
            project-control/BLOCKERS.json
            docs/MASTER_GAP_REPORT.md
          retention-days: 14

  e2e:
    name: Route, behaviour and brand checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start preview
        run: |
          npx vite preview --port 4173 &
          npx wait-on http://localhost:4173 --timeout 60000

      - name: Smoke — routes, behaviour, mobile, brand guard
        run: npm run smoke

  golden:
    name: Golden paths
    runs-on: ubuntu-latest
    # The suite is 702 tests over two viewports. It takes about six minutes
    # locally at four workers; CI runs two and retries once, so the ceiling is
    # generous rather than tight — a timeout here would read as a red gate
    # rather than as a slow one.
    timeout-minutes: 30
    needs: build
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Ratcheted, not green. Sixteen of twenty-three paths fail today, so a
      # gate demanding green would be switched off within a day; the counts in
      # project-control/BASELINE.json may fall and never rise, which is the
      # convention check-no-fake and check-tokens already use here.
      #
      # No separate build or preview step: playwright.config.ts owns its own
      # webServer and starts one on 4173. Starting a second here is how a run
      # ends up testing the previous build.
      - name: Golden paths — ratcheted against the baseline
        run: npm run golden -- --ratchet

      - name: Upload the golden-path record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-paths
          path: project-control/GOLDEN_PATHS.json
          retention-days: 14

  server-typecheck:
    name: Server / Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
        working-directory: packages/contract

      - run: npm ci
        working-directory: server

      - run: npm run typecheck
        working-directory: server

  server-test:
    name: Server / Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: salis
          POSTGRES_PASSWORD: salis
          POSTGRES_DB: salis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Two roles, which is the arrangement `.env.example` and `scripts/migrate.ts`
      # already describe: migrations run as the owner, the API runs as a role that
      # row-level security applies to.
      #
      # The image's POSTGRES_USER is the bootstrap superuser, and a superuser
      # bypasses RLS even where the migrations set FORCE ROW LEVEL SECURITY — so
      # connecting the API as it silently disabled every tenant boundary, which is
      # what the ~48 failing isolation assertions were reporting. It cannot simply
      # be demoted either: PostgreSQL refuses to remove SUPERUSER from the
      # bootstrap user ("The bootstrap user must have the SUPERUSER attribute").
      # So it stays the admin, and the API gets its own role.
      #
      # `scripts/migrate.ts` creates salis_app on first run from this URL's
      # credentials, grants it, and revokes update/delete on audit_log — that
      # revoke only happens when the two roles differ, so it was dead until now.
      DATABASE_ADMIN_URL: postgresql://salis:salis@localhost:5432/salis_test
      DATABASE_URL: postgresql://salis_app:salis_app@localhost:5432/salis_test
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
        working-directory: packages/contract

      - run: npm ci
        working-directory: server

      # The postgres image makes POSTGRES_USER a superuser, and a superuser
      # bypasses row-level security even where the migrations set FORCE ROW
      # LEVEL SECURITY. Connecting the app as one silently disabled every
      # tenant boundary, so the ~48 isolation assertions failed on every run.
      # Demote it: still the database owner (so migrations and the per-run test
      # database it creates keep working), no longer exempt from RLS.

      - run: npx vitest run --reporter=verbose
        working-directory: server

  security:
    name: Secrets and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            server/package-lock.json
            packages/contract/package-lock.json

      # Every lockfile in the repository, not just the client's.
      #
      # This step audited `app` alone, so `server`'s tree — the one that holds
      # the production dependencies, the database driver and the ORM — was
      # never looked at. It had been carrying a high-severity SQL-injection
      # advisory against drizzle-orm and a critical one against vitest, and the
      # pipeline was green throughout: not because the advisories were judged
      # acceptable, but because nothing ran the check. A gate that covers one
      # of three lockfiles reports the same colour as one that covers all
      # three, which is the failure mode worth designing against.
      #
      # `--audit-level=high` is the threshold `app` already used, kept so the
      # three are judged alike. Moderate findings are still printed by every
      # run — the audit is not filtered, only the exit code is thresholded —
      # so they stay visible in the log rather than being silenced.
      #
      # Each workspace is its own step so a failure names which lockfile it
      # came from, and `npm audit` reads the lockfile directly, so no install
      # is needed here.
      - name: Audit dependencies (app)
        working-directory: app
        run: npm audit --audit-level=high

      - name: Audit dependencies (server)
        if: always()
        working-directory: server
        run: npm audit --audit-level=high

      - name: Audit dependencies (packages/contract)
        if: always()
        working-directory: packages/contract
        run: npm audit --audit-level=high
