name: PR Test Report

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-report-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  report:
    name: Collect & Post Results
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            server/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: App typecheck
        id: app_typecheck
        working-directory: app
        run: npm run typecheck 2>&1 | tee /tmp/app-typecheck.txt
        continue-on-error: true

      - name: App unit tests
        id: app_test
        working-directory: app
        run: npx vitest run --reporter=verbose 2>&1 | tee /tmp/app-test.txt
        continue-on-error: true

      - name: App build
        id: app_build
        working-directory: app
        run: npm run build 2>&1 | tee /tmp/app-build.txt
        continue-on-error: true

      - name: Server typecheck
        id: server_typecheck
        working-directory: server
        run: npm run typecheck 2>&1 | tee /tmp/server-typecheck.txt
        continue-on-error: true

      - name: Server unit tests
        id: server_test
        working-directory: server
        run: npx vitest run --reporter=verbose 2>&1 | tee /tmp/server-test.txt
        continue-on-error: true

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            function icon(outcome) {
              return outcome === 'success' ? '✅' : '❌';
            }

            function readLog(path, maxLines = 30) {
              try {
                const lines = fs.readFileSync(path, 'utf8').split('\n');
                const tail = lines.slice(-maxLines).join('\n');
                return tail.length > 3000 ? tail.slice(-3000) : tail;
              } catch { return 'No output captured'; }
            }

            const steps = {
              'App Typecheck':    { outcome: '${{ steps.app_typecheck.outcome }}',    log: '/tmp/app-typecheck.txt' },
              'App Unit Tests':   { outcome: '${{ steps.app_test.outcome }}',         log: '/tmp/app-test.txt' },
              'App Build':        { outcome: '${{ steps.app_build.outcome }}',        log: '/tmp/app-build.txt' },
              'Server Typecheck': { outcome: '${{ steps.server_typecheck.outcome }}', log: '/tmp/server-typecheck.txt' },
              'Server Unit Tests':{ outcome: '${{ steps.server_test.outcome }}',      log: '/tmp/server-test.txt' },
            };

            const allPassed = Object.values(steps).every(s => s.outcome === 'success');

            let body = `## ${allPassed ? '✅ All checks passed' : '❌ Some checks failed'}\n\n`;
            body += `| Check | Status |\n|-------|--------|\n`;

            for (const [name, s] of Object.entries(steps)) {
              body += `| ${name} | ${icon(s.outcome)} ${s.outcome} |\n`;
            }

            const failed = Object.entries(steps).filter(([, s]) => s.outcome !== 'success');
            if (failed.length > 0) {
              body += `\n### Failure Details\n\n`;
              for (const [name, s] of failed) {
                body += `<details><summary>${name}</summary>\n\n\`\`\`\n${readLog(s.log)}\n\`\`\`\n\n</details>\n\n`;
              }
            }

            body += `\n<sub>Posted by CI · ${new Date().toISOString()}</sub>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('All checks passed') || c.body.includes('Some checks failed')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

            if (!allPassed) {
              core.setFailed('One or more checks failed');
            }
