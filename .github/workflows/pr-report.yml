# The PR status comment.
#
# This job *observes* the checks on the pull request's head commit. It used to
# re-run five things itself — app typecheck, app tests, app build, server
# typecheck, server tests — and report on those five alone. That had two costs:
#
#   1. **It was wrong.** Its table was not a summary of CI; it was a summary of
#      its own duplicated work. `ci.yml` runs eight jobs, and the comment could
#      only ever describe the five this file re-ran. So it would post
#      "✅ All checks passed" while `Typecheck, build and gates` was still
#      running, and stay saying it after that job went red — the other seven
#      were invisible to it. A status comment that can be green while the PR is
#      red is worse than no status comment, because people stop reading the
#      check list.
#   2. **It was paid for twice.** Every PR ran the app test suite, the app
#      build and the server suite once in `ci.yml` and again here.
#
# Now it waits for every check run on the head commit and reports all of them.
# Nothing is re-run, so the table cannot disagree with the check list: it is
# the check list.
#
# ## What gates, and what only gets reported
#
# The job's own pass/fail is decided by **GitHub Actions checks from this
# repository** — the jobs in `ci.yml`, the ones a change here can actually fix.
# External providers (Cloudflare Pages, Netlify, Vercel) are reported in full,
# with their real state, but do not decide it.
#
# That is deliberate and it is not a loosening: those checks never gated this
# job, because it could not see them. Making them gate now would paint every
# PR red on a deploy configured outside the repository, which nobody can fix
# from a branch — and a check that is red the day it lands is a check everyone
# learns to override. Their status is in the table either way, so a reviewer
# sees it; it just is not this job's verdict to give.
name: PR Test Report

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: read
  pull-requests: write

concurrency:
  group: pr-report-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  report:
    name: Collect & Post Results
    runs-on: ubuntu-latest
    # Longer than the longest job it waits for (`Golden paths`, 30m) plus the
    # queue time ahead of it. The script's own deadline is shorter, so a
    # stalled check produces a report that names it rather than a job the
    # runner kills with nothing posted.
    timeout-minutes: 45

    steps:
      # No checkout and no install: this job runs nothing from the repository.
      - name: Wait for the other checks, then post the result
        uses: actions/github-script@v7
        with:
          script: |
            const HEAD_SHA = context.payload.pull_request.head.sha
            /* Stop waiting after this long and report what was still running,
             * rather than implying it passed. */
            const DEADLINE_MS = 40 * 60 * 1000
            const POLL_MS = 20 * 1000
            /* Checks do not all appear at once — a job gated on `needs:` is
             * created only when its dependency finishes, and external
             * providers post whenever they get round to it. So "everything is
             * complete" is confirmed twice, this far apart, before it is
             * believed. Without it the report can conclude at the one moment
             * the first wave has finished and the second has not been created,
             * which is exactly the hole the old version fell through. */
            const SETTLE_MS = 30 * 1000

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))

            /* This job is itself a check run on this commit, and it is not
             * complete while it is doing the waiting. Excluding it by name
             * would break the moment the job is renamed, so exclude every
             * check belonging to this workflow run. */
            const SELF = `/actions/runs/${context.runId}/`
            const isSelf = (run) =>
              (run.html_url ?? '').includes(SELF) || (run.details_url ?? '').includes(SELF)

            /* A check run posted by the Actions app is one of ours — a job in
             * this repository, fixable from this branch. Anything else is an
             * external service. */
            const isActions = (run) => run.app?.slug === 'github-actions'

            /* `neutral` and `skipped` are not failures: Netlify reports
             * "Pages changed" as neutral, and a conditional job reports
             * skipped. Treating either as red would make the report cry wolf. */
            const PASSING = new Set(['success', 'neutral', 'skipped'])

            async function listChecks(filter) {
              return github.paginate(github.rest.checks.listForRef, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: HEAD_SHA,
                per_page: 100,
                ...(filter ? { filter } : {}),
              })
            }

            /* Poll until nothing on the commit is queued or running — counting
             * every check run, not just the latest per name, so a re-run in
             * flight still holds the report open. */
            const started = Date.now()
            let settledAt = null
            let pending = []
            for (;;) {
              let all
              try {
                all = (await listChecks()).filter((run) => !isSelf(run))
              } catch (error) {
                /* A transient API failure is not a verdict. Retry until the
                 * deadline; only then report what is unknown. */
                core.warning(`Could not list check runs: ${error.message}`)
                await sleep(POLL_MS)
                if (Date.now() - started > DEADLINE_MS) break
                continue
              }

              pending = all.filter((run) => run.status !== 'completed')
              if (pending.length === 0) {
                if (settledAt === null) settledAt = Date.now()
                else if (Date.now() - settledAt >= SETTLE_MS) break
              } else {
                settledAt = null
                core.info(`Waiting on ${pending.length}: ${pending.map((r) => r.name).join(', ')}`)
              }

              if (Date.now() - started > DEADLINE_MS) break
              await sleep(POLL_MS)
            }

            /* `filter: 'latest'` is what the PR's own check list shows: one row
             * per check name, the most recent. `ci.yml` triggers on both push
             * and pull_request, so every job exists twice on this commit and an
             * unfiltered table would print each one twice. */
            const latest = (await listChecks('latest'))
              .filter((run) => !isSelf(run))
              .sort((a, b) => a.name.localeCompare(b.name))

            const icon = (run) => {
              if (run.status !== 'completed') return '⏳'
              return PASSING.has(run.conclusion) ? '✅' : '❌'
            }
            const state = (run) =>
              run.status === 'completed' ? run.conclusion : run.status.replace('_', ' ')

            const ours = latest.filter(isActions)
            const external = latest.filter((run) => !isActions(run))

            const failedOurs = ours.filter(
              (run) => run.status === 'completed' && !PASSING.has(run.conclusion),
            )
            const runningOurs = ours.filter((run) => run.status !== 'completed')
            const failedExternal = external.filter(
              (run) => run.status === 'completed' && !PASSING.has(run.conclusion),
            )

            /* The headline states what this job is prepared to vouch for, and
             * nothing more. "All checks passed" while something is still
             * running is the claim that made the old comment untrustworthy. */
            let headline
            if (runningOurs.length > 0) {
              headline = `⏳ ${runningOurs.length} check${runningOurs.length === 1 ? '' : 's'} did not finish in time`
            } else if (failedOurs.length > 0) {
              headline = `❌ ${failedOurs.length} of ${ours.length} checks failed`
            } else if (ours.length === 0) {
              headline = '⚠️ No repository checks reported on this commit'
            } else {
              headline = `✅ All ${ours.length} repository checks passed`
            }

            const table = (runs) => {
              let out = '| Check | Status |\n|-------|--------|\n'
              for (const run of runs) {
                const name = run.html_url ? `[${run.name}](${run.html_url})` : run.name
                out += `| ${name} | ${icon(run)} ${state(run)} |\n`
              }
              return out
            }

            let body = `## ${headline}\n\n`
            body += `Commit \`${HEAD_SHA.slice(0, 7)}\`\n\n`

            if (ours.length > 0) {
              body += `### Repository checks\n\n${table(ours)}\n`
            }

            if (external.length > 0) {
              body += `### External services\n\n`
              /* Said plainly, every time, so nobody reads a red row here as a
               * gate this PR failed — or as one it may ignore. */
              body += `Reported, not gated: these deploy from configuration held outside this repository, so a branch cannot fix them.\n\n`
              body += table(external)
              if (failedExternal.length > 0) {
                body += `\n${failedExternal.length} failing: ${failedExternal.map((r) => r.name).join(', ')}.\n`
              }
              body += '\n'
            }

            if (runningOurs.length > 0) {
              body += `### Still running when this report was written\n\n`
              body += `The wait ended after ${Math.round(DEADLINE_MS / 60000)} minutes. `
              body += `These had not reported, so this comment says nothing about whether they pass:\n\n`
              for (const run of runningOurs) body += `- ${run.name}\n`
              body += '\n'
            }

            if (failedOurs.length > 0) {
              body += `### Failures\n\n`
              /* A link to the job, not thirty tail lines of its log: the log is
               * one click away and complete, and the tail of a test run is
               * usually the summary rather than the failure. */
              for (const run of failedOurs) {
                body += `- **${run.name}** — ${run.output?.title ?? run.conclusion}`
                body += run.html_url ? ` · [logs](${run.html_url})\n` : '\n'
              }
              body += '\n'
            }

            body += `<sub>Posted by CI · ${new Date().toISOString()}</sub>`

            /* A hidden marker identifies this comment. Matching on its prose
             * was a bug: `c.user.type === 'Bot' && c.body.includes(a) ||
             * c.body.includes(b)` binds as `(A && B) || C`, so any comment by
             * anyone containing "Some checks failed" — a human quoting the
             * bot, for instance — was overwritten by the next run. */
            const MARKER = '<!-- salis-ci-pr-report -->'
            body = `${MARKER}\n${body}`

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(MARKER),
            )

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }

            /* The job's verdict matches the headline: red when one of ours
             * failed, red when one never reported (silence is not a pass), and
             * green only when every repository check is green. */
            if (failedOurs.length > 0) {
              core.setFailed(`${failedOurs.length} repository check(s) failed: ${failedOurs.map((r) => r.name).join(', ')}`)
            } else if (runningOurs.length > 0) {
              core.setFailed(`Gave up waiting on: ${runningOurs.map((r) => r.name).join(', ')}`)
            } else if (ours.length === 0) {
              core.setFailed('No repository checks reported on this commit')
            }
