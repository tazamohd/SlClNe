<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/salis-auto-design-system-f22df384-eb3b-4838-99e5-e987504e70f0/styles.css">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="salis-icon.js"></script>
<style>body{margin:0;background:#F8FAFC}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}</style>
</helmet>
<div class="{{ rootClass }}" dir="{{ dir }}" data-screen-label="Logout-Confirmation" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:rgba(11,31,59,.5);font-family:var(--font-ui,'Inter',sans-serif)">
  <div style="width:100%;max-width:360px;padding:16px;animation:fadeUp .2s ease">
    <div style="background:var(--surface-card);border:1px solid var(--border-default);border-radius:12px;box-shadow:var(--shadow-lg);padding:24px;text-align:center">
      <span style="display:inline-flex;padding:14px;border-radius:50%;background:rgba(249,115,22,.1);color:#F97316;margin-bottom:14px"><salis-icon name="LogOut" size="24"></salis-icon></span>
      <h2 style="margin:0;font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--text-heading)">{{ t.title }}</h2>
      <p style="margin:8px 0 20px;font-family:var(--font-action);font-size:14px;color:var(--text-muted)">{{ t.desc }}</p>
      <div style="display:flex;gap:10px">
        <a href="Dashboard.dc.html" style="flex:1;display:inline-flex;align-items:center;justify-content:center;height:44px;border-radius:8px;border:1px solid var(--border-default);background:none;color:var(--text-body);font-family:var(--font-action);font-weight:500;font-size:14px;text-decoration:none;white-space:nowrap">{{ t.cancel }}</a>
        <a href="Login.dc.html" style="flex:1;display:inline-flex;align-items:center;justify-content:center;height:44px;border-radius:8px;border:none;background:var(--salis-orange);color:#fff;font-family:var(--font-action);font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap">{{ t.logout }}</a>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;ar&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;}}">
class Component extends DCLogic {
  state={dark:null,lang:null,AR:{}};
  componentDidMount(){import("./gms-data.js").then(m=>this.setState({AR:m.AR}));}
  renderVals(){
    const dark=this.state.dark??((localStorage.getItem("salis-theme")??this.props.theme)==="dark");
    const lang=this.state.lang??(localStorage.getItem("salis-lang")??this.props.lang??"en");
    const AR=this.state.AR,t=s=>lang==="ar"?(AR[s]||s):s;
    return {rootClass:dark?"dark":"",dir:lang==="ar"?"rtl":"ltr",t:{title:t("Confirm Logout"),desc:t("Are you sure you want to log out?"),cancel:t("Cancel"),logout:t("Logout")}};
  }
}

</script>
</body>
</html>
