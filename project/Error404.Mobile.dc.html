<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/salis-auto-design-system-f22df384-eb3b-4838-99e5-e987504e70f0/styles.css">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="salis-icon.js"></script>
<style>body{margin:0;background:#F8FAFC}a{color:#0A5ED7;text-decoration:none}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}</style>
</helmet>
<div class="{{ rootClass }}" dir="{{ dir }}" data-screen-label="404-Mobile" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg-page);font-family:var(--font-ui,'Inter',sans-serif);padding:24px">
  <div style="display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;animation:fadeUp .3s ease">
    <div style="animation:float 4s ease-in-out infinite"><span style="font-size:90px;font-family:var(--font-display);font-weight:900;line-height:1;background:var(--salis-gradient-r);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent">404</span></div>
    <div><h1 style="margin:0;font-size:20px;font-family:var(--font-display);font-weight:800;color:var(--text-heading)">{{ t.title }}</h1><p style="margin:8px 0 0;font-size:13px;color:var(--text-muted)">{{ t.desc }}</p></div>
    <div style="display:flex;gap:10px;width:100%">
      <a href="Dashboard.Mobile.dc.html" style="flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:50px;border-radius:8px;background:var(--salis-gradient);color:#fff;font-family:var(--font-action);font-weight:600;font-size:14px;text-decoration:none;box-shadow:0 4px 12px rgba(10,94,215,.25)"><salis-icon name="Home" size="16"></salis-icon>{{ t.home }}</a>
      <button onClick="{{ goBack }}" style="flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:50px;border-radius:8px;border:1.5px solid var(--border-strong);background:none;color:var(--text-body);font-family:var(--font-action);font-weight:500;font-size:14px;cursor:pointer"><salis-icon name="ArrowLeft" size="16"></salis-icon>{{ t.back }}</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;ar&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;}}">
class Component extends DCLogic {
  state={dark:null,lang:null};
  renderVals(){
    const dark=this.state.dark??((localStorage.getItem("salis-theme")??this.props.theme)==="dark");
    const lang=this.state.lang??(localStorage.getItem("salis-lang")??"en");const rtl=lang==="ar";
    return{rootClass:dark?"dark":"",dir:rtl?"rtl":"ltr",goBack:()=>history.back(),
      t:{title:rtl?"الصفحة غير موجودة":"Page Not Found",desc:rtl?"الصفحة التي تبحث عنها غير موجودة":"The page you're looking for doesn't exist.",home:rtl?"الرئيسية":"Home",back:rtl?"رجوع":"Back"}};
  }
}
</script>
</body>
</html>
