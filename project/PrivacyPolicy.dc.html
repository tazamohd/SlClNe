<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/salis-auto-design-system-f22df384-eb3b-4838-99e5-e987504e70f0/styles.css">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="salis-icon.js"></script>
<style>body{margin:0;background:#F8FAFC}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}</style>
</helmet>
<div class="{{ rootClass }}" dir="{{ dir }}" data-screen-label="Privacy-Policy" style="min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:var(--bg-page);font-family:var(--font-ui,'Inter',sans-serif);padding:24px;box-sizing:border-box">
  <div style="width:100%;max-width:640px;position:relative;z-index:1;animation:fadeUp .3s ease">
    <div style="background:var(--surface-card);border:1px solid var(--border-default);border-radius:12px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;max-height:80vh">
      <div style="padding:20px 24px;border-bottom:1px solid var(--border-default);display:flex;align-items:center;gap:10px">
        <span style="padding:8px;border-radius:10px;background:rgba(11,179,255,.12);color:#0BB3FF;display:flex"><salis-icon name="Shield" size="18"></salis-icon></span>
        <h2 style="margin:0;font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--text-heading)">{{ t.title }}</h2>
      </div>
      <div style="padding:20px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;color:var(--text-body);font-size:14px;line-height:1.7">
        <sc-for list="{{ paragraphs }}" as="p" hint-placeholder-count="6"><p style="margin:0">{{ p }}</p></sc-for>
      </div>
      <div style="padding:16px 24px;border-top:1px solid var(--border-default);display:flex;justify-content:flex-end">
        <a href="Login.dc.html" style="display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 20px;border-radius:8px;background:var(--salis-gradient);color:#fff;font-family:var(--font-action);font-weight:600;font-size:13px;text-decoration:none;box-shadow:0 4px 12px rgba(10,94,215,.25);white-space:nowrap;flex-shrink:0">{{ t.close }}</a>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;ar&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;}}">
class Component extends DCLogic {
  state={dark:null,lang:null,AR:{}};
  componentDidMount(){import("./gms-data.js").then(m=>this.setState({AR:m.AR}));}
  renderVals(){
    const dark=this.state.dark??((localStorage.getItem("salis-theme")??this.props.theme)==="dark");
    const lang=this.state.lang??(localStorage.getItem("salis-lang")??this.props.lang??"en");
    const AR=this.state.AR,t=s=>lang==="ar"?(AR[s]||s):s;
    const paragraphs=Array.from({length:6},(_,i)=>t("Privacy Policy")+" — section "+(i+1)+". "+t("Integrated automotive workshop management system")+".");
    return {rootClass:dark?"dark":"",dir:lang==="ar"?"rtl":"ltr",paragraphs,t:{title:t("Privacy Policy"),close:t("Continue")}};
  }
}

</script>
</body>
</html>
