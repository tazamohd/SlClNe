<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<link rel="stylesheet" href="_ds/salis-auto-design-system-f22df384-eb3b-4838-99e5-e987504e70f0/styles.css">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="salis-icon.js"></script>
<style>body{margin:0;background:#F8FAFC}a{color:#0A5ED7;text-decoration:none}a:hover{color:#0952C0}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.hscroll::-webkit-scrollbar{display:none}</style>
</helmet>
<div class="{{ rootClass }}" dir="{{ dir }}" data-screen-label="LeadPipeline-Mobile" style="position:relative;height:100vh;overflow:hidden;background:var(--bg-page);font-family:var(--font-ui,'Inter',sans-serif)">
  <header style="height:56px;background:var(--surface-sidebar);border-bottom:1px solid var(--border-default);padding:0 12px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-sm);position:relative;z-index:5">
    <button onClick="{{ openDrawer }}" style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;border:none;background:none;cursor:pointer;color:var(--text-primary);flex-shrink:0"><salis-icon name="Menu" size="20"></salis-icon></button>
    <p style="margin:0;flex:1;font-size:16px;font-weight:700;color:var(--text-heading)">{{ t.title }}</p>
    <button onClick="{{ toggleTheme }}" style="display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:none;background:none;cursor:pointer;color:var(--text-muted);flex-shrink:0"><salis-icon name="{{ themeIcon }}" size="16"></salis-icon></button>
  </header>
  <main style="height:calc(100vh - 56px);overflow-y:auto">
    <div style="padding:16px;display:flex;flex-direction:column;gap:14px;animation:fadeUp .3s ease">
      <div class="hscroll" style="display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px">
        <sc-for list="{{ stats }}" as="s" hint-placeholder-count="4">
          <div style="flex:0 0 140px;background:var(--surface-card);border-radius:12px;padding:12px;border:1px solid var(--border-default)">
            <span style="font-size:11px;color:var(--text-muted)">{{ s.label }}</span>
            <h4 style="margin:4px 0 0;font-size:20px;font-family:var(--font-display);font-weight:900;color:var(--text-heading)">{{ s.value }}</h4>
          </div>
        </sc-for>
      </div>
      <button style="display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border:none;border-radius:8px;background:var(--salis-gradient);color:#fff;cursor:pointer;font-family:var(--font-action);font-weight:600;font-size:13px;box-shadow:0 4px 12px rgba(10,94,215,.25)"><salis-icon name="Plus" size="16"></salis-icon>{{ t.addLead }}</button>
      <div class="hscroll" style="display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:0 16px 8px;scroll-snap-type:x mandatory;min-height:400px;align-items:flex-start">
        <sc-for list="{{ columns }}" as="col" hint-placeholder-count="4">
          <div style="scroll-snap-align:start;flex:0 0 85%;display:flex;flex-direction:column;gap:10px">
            <div style="display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface-card);border-radius:12px;border:1px solid var(--border-default)">
              <span style="{{ col.dotStyle }}"></span>
              <span style="font-size:13px;font-weight:600;color:var(--text-heading)">{{ col.label }}</span>
              <span style="margin-inline-start:auto;font-size:11px;font-weight:600;padding:2px 8px;border-radius:9999px;background:rgba(10,94,215,.08);color:var(--salis-blue)">{{ col.count }}</span>
            </div>
            <sc-for list="{{ col.leads }}" as="lead" hint-placeholder-count="2">
              <div style="background:var(--surface-card);border-radius:12px;padding:14px;border:1px solid var(--border-default);cursor:pointer" onClick="{{ lead.open }}">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
                  <span style="width:28px;height:28px;border-radius:50%;background:var(--salis-gradient);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0">{{ lead.initial }}</span>
                  <div style="flex:1;min-width:0"><p style="margin:0;font-size:13px;font-weight:600;color:var(--text-heading)">{{ lead.name }}</p><p style="margin:0;font-size:11px;color:var(--text-muted)">{{ lead.company }}</p></div>
                </div>
                <div style="display:flex;align-items:center;justify-content:space-between"><span style="font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--salis-blue)">{{ lead.value }}</span><span style="font-size:11px;color:var(--text-muted)">{{ lead.date }}</span></div>
              </div>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </div>
  </main>
  <sc-if value="{{ drawerOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeDrawer }}" style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20"></div>
    <aside style="position:fixed;top:0;bottom:0;inset-inline-start:0;width:78%;max-width:300px;background:var(--surface-sidebar);border-inline-end:1px solid var(--border-default);display:flex;flex-direction:column;z-index:21;box-shadow:var(--shadow-lg)">
      <div style="padding:14px 12px;display:flex;align-items:center;gap:8px">
        <div style="display:flex;align-items:center;gap:8px;flex:1;padding:8px;border-radius:8px;background:var(--surface-inset);border:1px solid var(--border-default)">
          <span style="width:28px;height:28px;border-radius:50%;background:var(--salis-gradient);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0">{{ userInitial }}</span>
          <div style="flex:1;min-width:0"><p style="margin:0;font-size:12px;font-weight:600;color:var(--text-primary)">{{ userName }}</p><span style="font-size:10px;font-weight:600;padding:1px 6px;border-radius:9999px;background:var(--salis-gradient);color:#fff">PRO</span></div>
        </div>
        <button onClick="{{ closeDrawer }}" style="display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:none;background:none;cursor:pointer;color:var(--text-primary);flex-shrink:0"><salis-icon name="X" size="18"></salis-icon></button>
      </div>
      <nav style="flex:1;padding:8px 12px;overflow-y:auto"><div style="display:flex;flex-direction:column;gap:2px">
        <sc-for list="{{ navGroups }}" as="g" hint-placeholder-count="7"><div>
          <button onClick="{{ g.toggle }}" style="width:100%;display:flex;align-items:center;gap:8px;padding:8px;border:none;background:none;border-radius:6px;cursor:pointer;font-family:var(--font-action);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-primary)"><span>{{ g.label }}</span><span style="flex:1"></span><salis-icon name="{{ g.chev }}" size="12" style="color:var(--text-muted)"></salis-icon></button>
          <sc-if value="{{ g.open }}" hint-placeholder-val="{{ true }}"><div style="display:flex;flex-direction:column;gap:2px;margin-top:2px">
            <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="2"><a href="{{ it.href }}" style="{{ it.style }}"><salis-icon name="{{ it.icon }}" size="14"></salis-icon><span>{{ it.label }}</span></a></sc-for>
          </div></sc-if>
        </div></sc-for>
      </div></nav>
      <div style="padding:12px;border-top:1px solid var(--border-default);display:flex;flex-direction:column;gap:8px">
        <button onClick="{{ toggleLang }}" style="display:flex;align-items:center;gap:8px;padding:6px 8px;border:none;background:none;border-radius:6px;cursor:pointer;font-family:var(--font-action);font-size:12px;font-weight:500;color:var(--text-muted)"><salis-icon name="Globe" size="14"></salis-icon><span>{{ langLabel }}</span></button>
        <a href="Login.Mobile.dc.html" style="display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-family:var(--font-action);font-size:12px;font-weight:500;color:var(--salis-orange)"><salis-icon name="LogOut" size="16"></salis-icon><span>{{ t.logout }}</span></a>
      </div>
    </aside>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;ar&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;},&quot;userName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Khalid Al-Amri&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;}}">

class Component extends DCLogic {
  state={dark:null,lang:null,open:null,data:null,drawer:false};
  componentDidMount(){import("./gms-data.js").then(m=>this.setState({data:m}));}
  renderVals(){
    const dark=this.state.dark??((localStorage.getItem("salis-theme")??this.props.theme)==="dark");
    const lang=this.state.lang??(localStorage.getItem("salis-lang")??this.props.lang??"en");
    const rtl=lang==="ar",D=this.state.data;const t=s=>rtl&&D?(D.AR[s]||s):s;
    const NAV=D?(D.navFor?D.navFor(D.NAV):D.NAV):[];const MH=D?D.MOBILE_HREF:{};const open=this.state.open??NAV.map(g=>g.label);
    const navGroups=NAV.map(g=>{const isOpen=open.includes(g.label);return{label:t(g.label),open:isOpen,chev:isOpen?"ChevronDown":(rtl?"ChevronLeft":"ChevronRight"),toggle:()=>this.setState({open:isOpen?open.filter(x=>x!==g.label):[...open,g.label]}),items:g.items.map(it=>{const on=it.r==="lead-pipeline";return{label:t(it.l),icon:g.icon,href:MH[it.r]||it.href||"#",style:"display:flex;align-items:center;gap:8px;padding:6px 12px;padding-inline-start:24px;border-radius:6px;cursor:pointer;font-family:var(--font-action);font-weight:500;font-size:12px;white-space:nowrap;overflow:hidden;text-decoration:none;"+(on?"background:var(--salis-gradient-r);color:#fff;box-shadow:var(--shadow)":"color:var(--text-primary)")}})};});
    const _rid=(D&&D.currentRole)?D.currentRole():null;const _rl=((D&&D.ROLES)||[]).find(x=>x.id===_rid);const userName=_rl?(rtl?_rl.demo.ar:_rl.demo.name):(this.props.userName??"Khalid Al-Amri");const roleLabel=_rl?(rtl?_rl.ar:_rl.label):null;
    const leads=D?D.LEADS:[];
    const stages=[{key:"new",label:t("New Leads"),color:"#F97316"},{key:"qualified",label:t("Qualified"),color:"#0BB3FF"},{key:"proposal",label:t("Proposal"),color:"#0A5ED7"},{key:"negotiation",label:t("Negotiation"),color:"#0B1F3B"},{key:"won",label:t("Won"),color:"#0A5ED7"},{key:"lost",label:t("Lost"),color:"#64748B"}];
    const columns=stages.map(s=>{const items=leads.filter(l=>l.stage===s.key);return{label:s.label,count:String(items.length),dotStyle:"width:8px;height:8px;border-radius:50%;background:"+s.color+";flex-shrink:0",leads:items.map(l=>({open:()=>location.href="LeadDetail.Mobile.dc.html",name:l.name,company:l.company,value:l.value,date:l.date,initial:l.name[0]}))};}).filter(c=>c.leads.length>0);
    const totalValue=leads.reduce((s,l)=>s+parseInt(l.value.replace(/[^0-9]/g,"")),0);
    const stats=[{label:t("Leads"),value:String(leads.length)},{label:t("Pipeline Value"),value:"SAR "+Math.round(totalValue/1000)+"K"},{label:t("Active Deals"),value:String(leads.filter(l=>!["won","lost"].includes(l.stage)).length)},{label:t("Won"),value:String(leads.filter(l=>l.stage==="won").length)}];
    return{rootClass:dark?"dark":"",dir:rtl?"rtl":"ltr",themeIcon:dark?"Sun":"Moon",langLabel:rtl?"English":"عربي",drawerOpen:this.state.drawer,
      openDrawer:()=>this.setState({drawer:true}),closeDrawer:()=>this.setState({drawer:false}),
      toggleTheme:()=>{localStorage.setItem("salis-theme",dark?"light":"dark");this.setState({dark:!dark});},
      toggleLang:()=>{const l=rtl?"en":"ar";localStorage.setItem("salis-lang",l);this.setState({lang:l});},
      userName,userInitial:userName.trim()[0]||"K",navGroups,columns,stats,
      t:{title:t("Lead Pipeline"),logout:t("Logout"),addLead:t("Add Lead")}};
  }
}

</script>
</body>
</html>
