<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script src="./support.js"></script></head><body><x-dc>
<helmet><link rel="stylesheet" href="_ds/salis-auto-design-system-f22df384-eb3b-4838-99e5-e987504e70f0/styles.css"><script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script><script src="salis-icon.js"></script><style>body{margin:0;background:#F8FAFC}a{color:#0A5ED7;text-decoration:none}a:hover{color:#0952C0}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}</style></helmet>
<div class="{{ rootClass }}" dir="{{ dir }}" data-screen-label="Activity Feed" style="min-height:100vh;background:var(--bg-page);font-family:var(--font-ui,'Inter',sans-serif)">
  <div style="height:56px;background:var(--surface-sidebar);border-bottom:1px solid var(--border-default);padding:0 24px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm)">
    <div style="display:flex;align-items:center;gap:8px"><div style="width:28px;height:28px;border-radius:8px;background:var(--salis-gradient);display:flex;align-items:center;justify-content:center"><salis-icon name="Car" size="14" style="color:#fff"></salis-icon></div><span style="font-size:14px;font-weight:700;color:var(--text-heading)">SALIS AUTO</span></div>
    <span style="font-size:13px;color:var(--text-muted)">·</span>
    <span style="font-size:13px;font-weight:600;color:var(--text-body)">{{ t.title }}</span>
    <div style="flex:1"></div>
    <button onClick="{{ toggleTheme }}" style="width:32px;height:32px;border-radius:8px;border:none;background:none;cursor:pointer;color:var(--text-muted);display:flex;align-items:center;justify-content:center"><salis-icon name="{{ themeIcon }}" size="16"></salis-icon></button>
  </div>
  <div style="padding:24px;animation:fadeUp .3s ease">
<div style="max-width:640px;display:flex;flex-direction:column;gap:16px">
  <h2 style="margin:0;font-size:24px;font-family:var(--font-display);font-weight:900;color:var(--text-heading)">{{ t.title }}</h2>
  <div style="display:flex;flex-direction:column;gap:0;padding-inline-start:20px;border-inline-start:2px solid var(--border-default)">
    <sc-for list="{{ activities }}" as="a" hint-placeholder-count="8">
      <div style="position:relative;padding:0 0 20px 20px">
        <span style="position:absolute;inset-inline-start:-9px;top:2px;width:16px;height:16px;border-radius:50%;background:{{ a.dotBg }};border:2px solid var(--surface-card,var(--bg-page));display:flex;align-items:center;justify-content:center"><salis-icon name="{{ a.icon }}" size="8" style="color:{{ a.dotFg }}"></salis-icon></span>
        <div style="background:var(--surface-card);border-radius:12px;padding:12px 14px;border:1px solid var(--border-default)">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><span style="font-size:13px;font-weight:600;color:var(--text-heading)">{{ a.user }}</span><span style="font-size:12px;color:var(--text-muted)">{{ a.action }}</span></div>
          <p style="margin:0;font-size:12px;color:var(--text-body)">{{ a.detail }}</p>
          <span style="display:block;margin-top:4px;font-size:10px;color:var(--text-faint)">{{ a.time }}</span>
        </div>
      </div>
    </sc-for>
  </div>
</div>
  </div>
</div></x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"dark","tsType":"string","section":"Variant"}}'>
class Component extends DCLogic{state={dark:null};renderVals(){const dark=this.state.dark??((localStorage.getItem("salis-theme")??this.props.theme)==="dark");
const activities=[
  {user:"Khalid Al-Amri",action:"created job card",detail:"JC-A3F8B2C1 for Toyota Camry 2022",time:"2 min ago",icon:"Plus",dotBg:"#0A5ED7",dotFg:"#fff"},
  {user:"Yousef Al-Otaibi",action:"updated status to",detail:"In Progress — Engine diagnostics started",time:"15 min ago",icon:"Wrench",dotBg:"#0BB3FF",dotFg:"#fff"},
  {user:"System",action:"sent notification",detail:"Low stock alert: Brake Pads (18 remaining)",time:"1 hour ago",icon:"AlertTriangle",dotBg:"#F97316",dotFg:"#fff"},
  {user:"Ahmed Al-Rashid",action:"approved estimate",detail:"EST-0231 — SAR 1,250 for maintenance",time:"2 hours ago",icon:"Check",dotBg:"#0A5ED7",dotFg:"#fff"},
  {user:"Fatima Al-Zahrani",action:"scheduled appointment",detail:"Layla Al-Sulaiman — Jul 25, 10:00 AM",time:"3 hours ago",icon:"Calendar",dotBg:"#0BB3FF",dotFg:"#fff"},
  {user:"System",action:"generated invoice",detail:"INV-2026-0142 — SAR 1,840",time:"4 hours ago",icon:"FileText",dotBg:"#64748B",dotFg:"#fff"},
  {user:"Omar Al-Ghamdi",action:"added vehicle",detail:"Hyundai Sonata 2023 — RUH 3357",time:"Yesterday",icon:"Car",dotBg:"#0B1F3B",dotFg:"#fff"}
];const extra={activities,t:{title:"Activity Feed"}};
return{rootClass:dark?"dark":"",dir:"ltr",themeIcon:dark?"Sun":"Moon",toggleTheme:()=>{localStorage.setItem("salis-theme",dark?"light":"dark");this.setState({dark:!dark})},...extra};}}</script></body></html>
