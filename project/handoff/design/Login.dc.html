<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/salis-auto-design-system-f22df384-eb3b-4838-99e5-e987504e70f0/styles.css">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="salis-icon.js"></script>
<style>
body{margin:0;background:#F8FAFC}
a{color:#0A5ED7;text-decoration:none}a:hover{color:#0952C0;text-decoration:underline}
input::placeholder{color:#9BA4B0}
@keyframes fadeUp{from{transform:translateY(12px)}to{transform:none}}
</style>
</helmet>
<div class="{{ rootClass }}" dir="{{ dir }}" data-screen-label="Login" style="min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:var(--bg-page);font-family:var(--font-ui,'Inter',sans-serif)">
  <div style="position:absolute;inset:0;z-index:0;pointer-events:none">
    <div style="position:absolute;top:0;right:0;width:800px;height:800px;border-radius:50%;background:radial-gradient(circle,rgba(10,94,215,.1),transparent 65%);filter:blur(64px)"></div>
    <div style="position:absolute;bottom:0;left:0;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(11,179,255,.1),transparent 65%);filter:blur(64px)"></div>
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(249,115,22,.05),transparent 65%);filter:blur(64px)"></div>
  </div>
  <div style="position:absolute;top:16px;inset-inline-end:16px;z-index:50;display:flex;gap:8px">
    <button onClick="{{ toggleLang }}" aria-label="Toggle language" style="display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--border-default);background:var(--surface-card);cursor:pointer;color:var(--text-muted);font-family:var(--font-action);font-size:12px;font-weight:500;transition:all .15s ease" style-hover="background:rgba(10,94,215,.1);color:var(--salis-blue)"><salis-icon name="Globe" size="14"></salis-icon><span>{{ langLabel }}</span></button>
    <button onClick="{{ toggleTheme }}" aria-label="Toggle theme" style="display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:1px solid var(--border-default);background:var(--surface-card);cursor:pointer;color:var(--text-muted);transition:all .15s ease" style-hover="background:rgba(10,94,215,.1);color:var(--salis-blue)"><salis-icon name="{{ themeIcon }}" size="16"></salis-icon></button>
  </div>
  <div style="width:100%;max-width:880px;padding:16px;position:relative;z-index:1;animation:fadeUp .3s ease">
    <div style="display:grid;grid-template-columns:{{ gridCols }};gap:16px;align-items:start">
    <div style="background:color-mix(in srgb,var(--surface-card) 85%,transparent);backdrop-filter:blur(24px);border:1px solid var(--border-default);border-radius:12px;box-shadow:var(--shadow-lg)">
      <div style="padding:24px 24px 0;display:flex;flex-direction:column;gap:16px">
        <div style="display:flex;justify-content:center">
          <div style="position:relative">
            <div style="position:absolute;inset:-16px;background:var(--salis-gradient);border-radius:16px;filter:blur(24px);opacity:.2"></div>
            <img src="assets/logo-blue-orange.png" alt="SALIS AUTO" style="position:relative;width:176px;height:auto;filter:drop-shadow(0 4px 8px rgba(0,0,0,.15))">
          </div>
        </div>
        <div style="text-align:center">
          <h2 style="margin:0;font-family:var(--font-display);font-weight:700;font-size:24px;color:var(--text-heading)">{{ t.signIn }}</h2>
          <p style="margin:8px 0 0;font-family:var(--font-action);font-size:14px;color:var(--text-muted)">{{ t.creds }}</p>
        </div>
      </div>
      <form onSubmit="{{ submit }}" style="padding:24px;display:flex;flex-direction:column;gap:20px">
        <div style="display:flex;flex-direction:column;gap:8px">
          <label for="email" style="font-family:var(--font-action);font-size:12px;font-weight:500;letter-spacing:.025em;color:var(--text-primary)">{{ t.email }}</label>
          <span style="position:relative;display:flex;align-items:center">
            <salis-icon name="Mail" size="20" style="position:absolute;inset-inline-start:12px;color:var(--text-muted);pointer-events:none;z-index:1"></salis-icon>
            <input id="email" type="email" placeholder="your@email.com" value="{{ email }}" onChange="{{ setEmail }}" style="width:100%;height:48px;border-radius:8px;border:1px solid var(--border-default);background:var(--surface-inset);padding:0 14px;padding-inline-start:40px;font-family:var(--font-action);font-size:14px;color:var(--text-primary);outline:none;transition:all .2s ease" style-focus="border-color:var(--ring);box-shadow:0 0 0 3px rgba(10,94,215,.15);background:var(--surface-card)">
          </span>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <label for="pw" style="font-family:var(--font-action);font-size:12px;font-weight:500;letter-spacing:.025em;color:var(--text-primary)">{{ t.password }}</label>
          <span style="position:relative;display:flex;align-items:center">
            <salis-icon name="Lock" size="20" style="position:absolute;inset-inline-start:12px;color:var(--text-muted);pointer-events:none;z-index:1"></salis-icon>
            <input id="pw" type="{{ pwType }}" placeholder="••••••••" value="{{ pw }}" onChange="{{ setPw }}" style="width:100%;height:48px;border-radius:8px;border:1px solid var(--border-default);background:var(--surface-inset);padding:0 14px;padding-inline-start:40px;padding-inline-end:44px;font-family:var(--font-action);font-size:14px;color:var(--text-primary);outline:none;transition:all .2s ease" style-focus="border-color:var(--ring);box-shadow:0 0 0 3px rgba(10,94,215,.15);background:var(--surface-card)">
            <button type="button" onClick="{{ toggleShow }}" aria-label="Toggle password visibility" style="position:absolute;inset-inline-end:12px;background:none;border:none;cursor:pointer;color:var(--text-muted);display:flex;padding:0"><salis-icon name="{{ eyeIcon }}" size="20"></salis-icon></button>
          </span>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
          <button type="button" onClick="{{ toggleRemember }}" style="display:flex;align-items:center;gap:8px;border:none;background:none;padding:0;cursor:pointer;font-family:var(--font-action);font-size:13px;color:var(--text-body)">
            <span style="{{ cbStyle }}"><sc-if value="{{ remember }}" hint-placeholder-val="{{ true }}"><salis-icon name="Check" size="12" stroke-width="3"></salis-icon></sc-if></span>
            <span>{{ t.remember }}</span>
          </button>
          <a href="ForgotPassword.dc.html" style="font-family:var(--font-action);font-size:13px;font-weight:500">{{ t.forgot }}</a>
        </div>
        <button type="submit" style="width:100%;height:48px;border:none;border-radius:8px;background:var(--salis-gradient);color:#fff;font-family:var(--font-action);font-weight:600;font-size:15px;cursor:pointer;box-shadow:0 4px 12px rgba(10,94,215,.25);transition:all .2s ease" style-hover="background:var(--salis-gradient-hover);transform:translateY(-1px);box-shadow:0 8px 20px rgba(10,94,215,.35)">{{ t.signIn }}</button>
        <p style="margin:0;text-align:center;font-size:14px;font-family:var(--font-action);color:var(--text-muted)">{{ t.noAcct }} <a href="Register.dc.html" style="font-weight:600">{{ t.register }}</a></p>
      </form>
    </div>
    <div style="background:color-mix(in srgb,var(--surface-card) 85%,transparent);backdrop-filter:blur(24px);border:1px solid var(--border-default);border-radius:12px;box-shadow:var(--shadow-lg);padding:20px;display:flex;flex-direction:column;gap:13px">
      <div>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="padding:6px;border-radius:8px;background:rgba(10,94,215,.1);color:var(--salis-blue);display:flex"><salis-icon name="Users" size="14"></salis-icon></span>
          <p style="margin:0;font-size:14px;font-weight:700;font-family:var(--font-display);color:var(--text-heading)">{{ t.demoTitle }}</p>
        </div>
        <p style="margin:7px 0 0;font-size:12px;line-height:1.55;color:var(--text-muted);text-wrap:pretty">{{ t.demoSub }}</p>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:7px;max-height:428px;overflow-y:auto;padding-inline-end:2px">
        <sc-for list="{{ demoUsers }}" as="u" hint-placeholder-count="14">
          <button type="button" onClick="{{ u.fill }}" aria-pressed="{{ u.on }}" style="{{ u.cardStyle }}" style-hover="border-color:rgba(10,94,215,.4);box-shadow:var(--shadow-lg);transform:translateY(-1px)">
            <span style="{{ u.iconStyle }}"><salis-icon name="{{ u.icon }}" size="15"></salis-icon></span>
            <span style="min-width:0;flex:1;display:flex;flex-direction:column;gap:2px;text-align:start">
              <span style="display:block;font-size:12.5px;font-weight:600;line-height:1.25;color:var(--text-heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ u.role }}</span>
              <span style="display:flex;align-items:center;gap:6px;min-width:0">
                <span style="flex:1;min-width:0;font-size:11px;line-height:1.3;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ u.name }}</span>
                <span style="{{ u.limitStyle }}">{{ u.limit }}</span>
              </span>
            </span>
            <sc-if value="{{ u.on }}" hint-placeholder-val="{{ false }}"><span style="{{ u.checkStyle }}"><salis-icon name="Check" size="11" stroke-width="3"></salis-icon></span></sc-if>
          </button>
        </sc-for>      </div>
      <p style="margin:0;padding-top:11px;border-top:1px solid var(--border-default);font-size:11.5px;line-height:1.5;color:var(--text-muted);display:flex;gap:7px">
        <salis-icon name="Info" size="13" style="color:var(--salis-blue);flex-shrink:0;margin-top:1px"></salis-icon>
        <span>{{ t.demoNote }}</span>
      </p>
    </div>
  </div>
  </div>
  <sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;bottom:24px;inset-inline-end:24px;z-index:100;display:flex;align-items:flex-start;gap:12px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow-lg);min-width:280px;animation:fadeUp .25s ease">
      <span style="{{ toastIconStyle }}"><salis-icon name="{{ toastIcon }}" size="18"></salis-icon></span>
      <div style="flex:1"><p style="margin:0;font-size:14px;font-weight:600;color:var(--text-heading)">{{ toastTitle }}</p><p style="margin:2px 0 0;font-size:13px;color:var(--text-muted)">{{ toastDesc }}</p></div>
      <button onClick="{{ closeToast }}" aria-label="Dismiss" style="border:none;background:none;cursor:pointer;color:var(--text-muted);padding:0;display:flex"><salis-icon name="X" size="14"></salis-icon></button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;ar&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;}}">
class Component extends DCLogic {
  state={dark:null,lang:null,email:"",pw:"",show:false,remember:true,toast:null,AR:{},ROLES:[],narrow:false,picked:null};
  componentDidMount(){
    import("./gms-data.js").then(m=>this.setState({AR:m.AR,ROLES:m.ROLES}));
    this._mq=window.matchMedia("(max-width:860px)");
    this._onMq=()=>this.setState({narrow:this._mq.matches});
    this._onMq(); this._mq.addEventListener("change",this._onMq);
  }
  componentWillUnmount(){ if(this._mq) this._mq.removeEventListener("change",this._onMq); }
  renderVals(){
    const dark=this.state.dark??((localStorage.getItem("salis-theme")??this.props.theme)==="dark");
    const lang=this.state.lang??(localStorage.getItem("salis-lang")??this.props.lang??"en");
    const AR=this.state.AR,t=s=>lang==="ar"?(AR[s]||s):s;
    const toast=this.state.toast;
    const picked=this.state.picked, DEMO_PW="Demo@1234";
    const DEST={supplier:"SupplierPortal.dc.html",customer:"CustomerPortal.dc.html",technician:"TechnicianPortal.dc.html",superadmin:"SuperAdmin.dc.html",agent:"CallCenter.dc.html",procurement:"ProcurementPortal.dc.html"};
    return {
      rootClass:dark?"dark":"",dir:lang==="ar"?"rtl":"ltr",
      themeIcon:dark?"Sun":"Moon",langLabel:lang==="ar"?"English":"عربي",
      toggleTheme:()=>{localStorage.setItem("salis-theme",dark?"light":"dark");this.setState({dark:!dark});},
      toggleLang:()=>{const l=lang==="ar"?"en":"ar";localStorage.setItem("salis-lang",l);this.setState({lang:l});},
      t:{signIn:t("Sign In"),creds:t("Enter your credentials to access your account"),email:t("Email"),password:t("Password"),remember:t("Remember this device"),forgot:t("Forgot password?"),noAcct:t("Don't have an account?"),register:t("Register"),demoTitle:t("Quick access — pick a role"),demoSub:t("Click any role to fill the email and password above, then press Sign In. Each role carries its own permissions, data scope and approval limit."),demoNote:t("Demo accounts only · shared password")+": "+DEMO_PW+" · "+t("approval limits in SAR"),demoLimit:t("Limit")},
      email:this.state.email,pw:this.state.pw,pwType:this.state.show?"text":"password",eyeIcon:this.state.show?"EyeOff":"Eye",
      setEmail:e=>this.setState({email:e.target.value}),setPw:e=>this.setState({pw:e.target.value}),
      toggleShow:()=>this.setState({show:!this.state.show}),
      remember:this.state.remember,toggleRemember:()=>this.setState({remember:!this.state.remember}),
      cbStyle:"width:18px;height:18px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s ease;"+(this.state.remember?"background:var(--salis-gradient);border:none;color:#fff":"background:var(--surface-inset);border:1.5px solid var(--border-strong);color:transparent"),
      submit:e=>{
        e.preventDefault();
        clearTimeout(this._tt);
        const em=this.state.email.trim().toLowerCase();
        if(!em||!this.state.pw){
          this.setState({toast:{err:true,title:t("Error"),desc:t("Please fill in all fields")}});
          this._tt=setTimeout(()=>this.setState({toast:null}),3200); return;
        }
        const r=((this.state.ROLES)||[]).find(x=>x.demo.email===em);
        if(!r||this.state.pw!==DEMO_PW){
          this.setState({toast:{err:true,title:t("Sign in failed"),desc:t("Pick a demo role to fill valid credentials.")}});
          this._tt=setTimeout(()=>this.setState({toast:null}),3200); return;
        }
        localStorage.setItem("salis-role",r.id);
        this.setState({toast:{err:false,title:t("Signed in"),desc:(lang==="ar"?r.demo.ar:r.demo.name)+" · "+(lang==="ar"?r.ar:r.label)}});
        setTimeout(()=>{location.href=DEST[r.id]||"Dashboard.dc.html";},700);
      },
      gridCols:this.state.narrow?"1fr":"minmax(340px,400px) 1fr",
      demoUsers:((this.state.ROLES)||[]).map(r=>{
        const on=picked===r.id;
        return {
        role:lang==="ar"?r.ar:r.label, name:lang==="ar"?r.demo.ar:r.demo.name, icon:r.icon, on,
        limit:r.limit===null?t("Full"):(r.limit===0?"—":(r.limit/1000)+"k"),
        limitStyle:"flex-shrink:0;font-size:10px;font-weight:700;padding:2px 6px;border-radius:9999px;white-space:nowrap;font-family:var(--font-mono,monospace);"+(r.limit===null?"background:var(--salis-gradient);color:#fff":r.limit===0?"background:var(--surface-inset);color:var(--text-muted)":"background:rgba(10,94,215,.1);color:var(--salis-blue)"),
        cardStyle:"display:flex;align-items:center;gap:9px;width:100%;min-height:52px;padding:9px 11px;border-radius:10px;cursor:pointer;text-align:start;position:relative;border-style:solid;border-width:1px;transition-property:all;transition-duration:.15s;transition-timing-function:ease;background-color:"+(on?(dark?"#10233D":"#EFF4FD"):"var(--surface-card)")+";border-color:"+(on?"var(--salis-blue)":"var(--border-default)")+";box-shadow:"+(on?"0 0 0 3px "+(dark?"#173963":"#D7E5FA"):"none"),
        iconStyle:"flex-shrink:0;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:"+(on?"var(--salis-gradient)":"rgba(10,94,215,.09)")+";color:"+(on?"#fff":r.color),
        checkStyle:"position:absolute;top:5px;inset-inline-end:5px;width:16px;height:16px;border-radius:50%;background-color:var(--salis-blue);color:#fff;display:flex;align-items:center;justify-content:center",
        fill:()=>{
          clearTimeout(this._tt);
          this.setState({email:r.demo.email,pw:DEMO_PW,picked:r.id,show:false,
            toast:{err:false,title:t("Credentials filled"),desc:r.demo.email+" · "+(lang==="ar"?r.ar:r.label)}});
          this._tt=setTimeout(()=>this.setState({toast:null}),2600);
        }
      };}),
      hasToast:!!toast,toastTitle:toast?toast.title:"",toastDesc:toast?toast.desc:"",
      toastIcon:toast&&toast.err?"AlertCircle":"CheckCircle",
      toastIconStyle:"padding:6px;border-radius:8px;display:flex;flex-shrink:0;"+(toast&&toast.err?"background:rgba(249,115,22,.12);color:#F97316":"background:rgba(10,94,215,.12);color:var(--salis-blue)"),
      closeToast:()=>this.setState({toast:null})
    };
  }
}
</script>
</body>
</html>
