<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/salis-auto-design-system-f22df384-eb3b-4838-99e5-e987504e70f0/styles.css">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="salis-icon.js"></script>
<style>body{margin:0;background:#F8FAFC}a{color:#0A5ED7;text-decoration:none}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}</style>
</helmet>
<div class="{{ rootClass }}" dir="{{ dir }}" data-screen-label="Workspace-Selection-Mobile" style="min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg-page);font-family:var(--font-ui,'Inter',sans-serif)">
  <div style="position:absolute;inset:0;z-index:0;pointer-events:none"><div style="position:absolute;top:0;left:0;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(11,179,255,.1),transparent 65%);filter:blur(48px)"></div></div>
  <div style="position:relative;z-index:2;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:14px 16px">
    <button onClick="{{ toggleLang }}" style="display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--border-default);background:var(--surface-card);cursor:pointer;color:var(--text-muted);font-family:var(--font-action);font-size:12px;font-weight:500"><salis-icon name="Globe" size="14"></salis-icon><span>{{ langLabel }}</span></button>
    <button onClick="{{ toggleTheme }}" style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;border:1px solid var(--border-default);background:var(--surface-card);cursor:pointer;color:var(--text-muted)"><salis-icon name="{{ themeIcon }}" size="16"></salis-icon></button>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:8px 16px 24px;position:relative;z-index:1;animation:fadeUp .3s ease">
    <div style="display:flex;flex-direction:column;gap:20px">
      <div style="text-align:center">
        <img src="assets/logo-blue-orange.png" alt="SALIS AUTO" style="width:80px;height:auto">
        <h1 style="margin:10px 0 0;font-size:20px;font-family:var(--font-display);font-weight:900;color:var(--text-heading)">{{ t.title }}</h1>
        <p style="margin:4px 0 0;font-size:12px;color:var(--text-muted)">{{ t.desc }}</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <sc-for list="{{ workspaces }}" as="w" hint-placeholder-count="3">
          <button onClick="{{ w.select }}" style="{{ w.style }}">
            <span style="width:38px;height:38px;border-radius:10px;background:var(--salis-gradient);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0;box-shadow:0 3px 8px rgba(10,94,215,.2)">{{ w.initial }}</span>
            <div style="flex:1;text-align:start;min-width:0">
              <span style="font-size:13px;font-weight:600">{{ w.label }}</span>
              <div style="display:flex;gap:10px;margin-top:3px">
                <span style="display:flex;align-items:center;gap:2px;font-size:10px;opacity:.7"><salis-icon name="Car" size="10"></salis-icon>{{ w.vehicles }}</span>
                <span style="display:flex;align-items:center;gap:2px;font-size:10px;opacity:.7"><salis-icon name="Wrench" size="10"></salis-icon>{{ w.jobs }}</span>
                <span style="display:flex;align-items:center;gap:2px;font-size:10px;opacity:.7"><salis-icon name="Users" size="10"></salis-icon>{{ w.team }}</span>
              </div>
            </div>
            <sc-if value="{{ w.picked }}" hint-placeholder-val="{{ false }}"><span style="width:20px;height:20px;border-radius:50%;background:var(--salis-gradient);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(10,94,215,.3)"><salis-icon name="Check" size="10" stroke-width="3"></salis-icon></span></sc-if>
            <sc-if value="{{ w.notPicked }}" hint-placeholder-val="{{ true }}"><span style="width:20px;height:20px;border-radius:50%;border:2px solid var(--border-strong);flex-shrink:0"></span></sc-if>
          </button>
        </sc-for>
      </div>
      <a href="Dashboard.Mobile.dc.html" style="width:100%;display:inline-flex;align-items:center;justify-content:center;height:50px;border-radius:8px;background:var(--salis-gradient);color:#fff;font-family:var(--font-action);font-weight:600;font-size:15px;text-decoration:none;box-shadow:0 4px 12px rgba(10,94,215,.25)">{{ t.continue }}</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;ar&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;}}">
class Component extends DCLogic {
  state={dark:null,lang:null,AR:{},picked:"Al-Amri Auto Center"};
  componentDidMount(){import("./gms-data.js").then(m=>this.setState({AR:m.AR}));}
  renderVals(){
    const dark=this.state.dark??((localStorage.getItem("salis-theme")??this.props.theme)==="dark");
    const lang=this.state.lang??(localStorage.getItem("salis-lang")??this.props.lang??"en");
    const AR=this.state.AR,t=s=>lang==="ar"?(AR[s]||s):s;const rtl=lang==="ar";
    const data=[["Al-Amri Auto Center","48","12","8"],["Riyadh North Branch","31","7","5"],["Jeddah Service Center","22","4","4"]];
    const workspaces=data.map(([n,vehicles,jobs,team])=>{const on=this.state.picked===n;
      return{label:n,initial:n[0],vehicles,jobs,team,picked:on,notPicked:!on,select:()=>this.setState({picked:n}),
        style:"width:100%;display:flex;align-items:center;gap:10px;padding:14px;border-radius:12px;cursor:pointer;font-family:var(--font-action);box-sizing:border-box;"+(on?"border:1.5px solid var(--salis-blue);background:rgba(10,94,215,.06);color:var(--salis-blue);box-shadow:0 4px 16px rgba(10,94,215,.1)":"border:1px solid var(--border-default);background:var(--surface-card);color:var(--text-body)")};
    });
    return{rootClass:dark?"dark":"",dir:rtl?"rtl":"ltr",workspaces,themeIcon:dark?"Sun":"Moon",langLabel:rtl?"English":"عربي",
      toggleTheme:()=>{localStorage.setItem("salis-theme",dark?"light":"dark");this.setState({dark:!dark});},
      toggleLang:()=>{const l=rtl?"en":"ar";localStorage.setItem("salis-lang",l);this.setState({lang:l});},
      t:{title:t("Workspace Selection"),desc:t("Select a workspace to continue"),continue:t("Continue")}};
  }
}
</script>
</body>
</html>
