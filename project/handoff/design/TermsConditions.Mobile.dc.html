<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/salis-auto-design-system-f22df384-eb3b-4838-99e5-e987504e70f0/styles.css">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="salis-icon.js"></script>
<style>body{margin:0;background:#F8FAFC}a{color:#0A5ED7;text-decoration:none}a:hover{color:#0952C0;text-decoration:underline}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}</style>
</helmet>
<div class="{{ rootClass }}" dir="{{ dir }}" data-screen-label="Terms-Mobile" style="min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg-page);font-family:var(--font-ui,'Inter',sans-serif)">
  <div style="position:relative;z-index:2;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:14px 16px">
    <button onClick="{{ toggleLang }}" aria-label="Toggle language" style="display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--border-default);background:var(--surface-card);cursor:pointer;color:var(--text-muted);font-family:var(--font-action);font-size:12px;font-weight:500"><salis-icon name="Globe" size="14"></salis-icon><span>{{ langLabel }}</span></button>
    <button onClick="{{ toggleTheme }}" aria-label="Toggle theme" style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;border:1px solid var(--border-default);background:var(--surface-card);cursor:pointer;color:var(--text-muted)"><salis-icon name="{{ themeIcon }}" size="16"></salis-icon></button>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;padding:0 16px 16px;position:relative;z-index:1;animation:fadeUp .3s ease;min-height:0">
    <div style="flex:1;display:flex;flex-direction:column;background:color-mix(in srgb,var(--surface-card) 92%,transparent);backdrop-filter:blur(24px);border:1px solid var(--border-default);border-radius:14px;box-shadow:var(--shadow-lg);min-height:0">
      <div style="padding:16px;border-bottom:1px solid var(--border-default);display:flex;align-items:center;gap:10px;flex-shrink:0">
        <span style="padding:8px;border-radius:10px;background:rgba(10,94,215,.1);color:var(--salis-blue);display:flex"><salis-icon name="FileText" size="18"></salis-icon></span>
        <h2 style="margin:0;font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--text-heading)">{{ t.title }}</h2>
      </div>
      <div style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;color:var(--text-body);font-size:14px;line-height:1.7;-webkit-overflow-scrolling:touch">
        <sc-for list="{{ paragraphs }}" as="p" hint-placeholder-count="6"><p style="margin:0">{{ p }}</p></sc-for>
      </div>
      <div style="padding:14px 16px;border-top:1px solid var(--border-default);display:flex;flex-direction:column;gap:12px;flex-shrink:0">
        <button onClick="{{ toggleAgree }}" style="display:flex;align-items:center;gap:8px;border:none;background:none;cursor:pointer;font-family:var(--font-action);font-size:13px;color:var(--text-body);padding:0">
          <span style="{{ cbStyle }}"><sc-if value="{{ agreed }}" hint-placeholder-val="{{ false }}"><salis-icon name="Check" size="12" stroke-width="3"></salis-icon></sc-if></span>
          <span>{{ t.iAgree }}</span>
        </button>
        <a href="Onboarding.Mobile.dc.html" style="{{ ctaStyle }}">{{ t.continue }}</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;ar&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;}}">
class Component extends DCLogic {
  state={dark:null,lang:null,AR:{},agreed:false};
  componentDidMount(){import("./gms-data.js").then(m=>this.setState({AR:m.AR}));}
  renderVals(){
    const dark=this.state.dark??((localStorage.getItem("salis-theme")??this.props.theme)==="dark");
    const lang=this.state.lang??(localStorage.getItem("salis-lang")??this.props.lang??"en");
    const AR=this.state.AR,t=s=>lang==="ar"?(AR[s]||s):s;
    const agreed=this.state.agreed;
    const paragraphs=Array.from({length:6},(_,i)=>t("Terms & Conditions")+" — section "+(i+1)+". "+t("Integrated automotive workshop management system")+".");
    return {rootClass:dark?"dark":"",dir:lang==="ar"?"rtl":"ltr",paragraphs,agreed,
      themeIcon:dark?"Sun":"Moon",langLabel:lang==="ar"?"English":"عربي",
      toggleTheme:()=>{localStorage.setItem("salis-theme",dark?"light":"dark");this.setState({dark:!dark});},
      toggleLang:()=>{const l=lang==="ar"?"en":"ar";localStorage.setItem("salis-lang",l);this.setState({lang:l});},
      toggleAgree:()=>this.setState({agreed:!agreed}),
      cbStyle:"width:18px;height:18px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;"+(agreed?"background:var(--salis-gradient);border:none;color:#fff":"background:var(--surface-inset);border:1.5px solid var(--border-strong);color:transparent"),
      ctaStyle:"display:flex;align-items:center;justify-content:center;height:50px;border-radius:8px;font-family:var(--font-action);font-weight:600;font-size:15px;text-decoration:none;white-space:nowrap;"+(agreed?"background:var(--salis-gradient);color:#fff;box-shadow:0 4px 12px rgba(10,94,215,.25)":"background:var(--surface-inset);color:var(--text-muted);pointer-events:none"),
      t:{title:t("Terms & Conditions"),iAgree:t("I have read and agree to the")+" "+t("Terms & Conditions"),continue:t("Continue")}};
  }
}
</script>
</body>
</html>
