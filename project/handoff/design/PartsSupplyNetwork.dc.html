        <button style="display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border:none;border-radius:10px;background:var(--salis-gradient);color:#fff;cursor:pointer;font-family:var(--font-action);font-size:13px;font-weight:600"><salis-icon name="Plus" size="16"></salis-icon>{{ pane.addLabel }}</button>
      </div>
    </sc-if>
  </div>
</div>
</div></main></div></div></x-dc>
