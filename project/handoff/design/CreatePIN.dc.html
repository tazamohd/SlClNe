<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/salis-auto-design-system-f22df384-eb3b-4838-99e5-e987504e70f0/styles.css">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="salis-icon.js"></script>
<style>body{margin:0;background:#F8FAFC}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}</style>
</helmet>
<div class="{{ rootClass }}" dir="{{ dir }}" data-screen-label="Create-PIN" style="min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:var(--bg-page);font-family:var(--font-ui,'Inter',sans-serif)">
  <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:20px;max-width:340px;padding:16px;animation:fadeUp .3s ease">
    <h2 style="margin:0;font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--text-heading)">{{ t.title }}</h2>
    <div style="display:flex;gap:12px" dir="ltr">
      <sc-for list="{{ dots }}" as="d" hint-placeholder-count="4"><span style="{{ d.style }}"></span></sc-for>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,64px);gap:12px">
      <sc-for list="{{ keys }}" as="k" hint-placeholder-count="10">
        <button onClick="{{ k.press }}" style="width:64px;height:64px;border-radius:50%;border:1px solid var(--border-default);background:var(--surface-card);cursor:pointer;font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--text-heading)">{{ k.label }}</button>
      </sc-for>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;ar&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;}}">
class Component extends DCLogic {
  state={dark:null,lang:null,AR:{},pin:""};
  componentDidMount(){import("./gms-data.js").then(m=>this.setState({AR:m.AR}));}
  renderVals(){
    const dark=this.state.dark??((localStorage.getItem("salis-theme")??this.props.theme)==="dark");
    const lang=this.state.lang??(localStorage.getItem("salis-lang")??this.props.lang??"en");
    const AR=this.state.AR,t=s=>lang==="ar"?(AR[s]||s):s;
    const pin=this.state.pin;
    const dots=Array.from({length:4},(_,i)=>({style:"width:16px;height:16px;border-radius:50%;background:"+(i<pin.length?"var(--salis-gradient)":"var(--surface-inset)")+";border:1px solid var(--border-default)"}));
    const keys=["1","2","3","4","5","6","7","8","9","","0","⌫"].map(k=>({label:k,press:()=>{
      if(k==="⌫")this.setState({pin:pin.slice(0,-1)});
      else if(k&&pin.length<4){const np=pin+k;this.setState({pin:np});if(np.length===4)setTimeout(()=>location.href="BiometricSetup.dc.html",300);}
    }}));
    return {rootClass:dark?"dark":"",dir:lang==="ar"?"rtl":"ltr",dots,keys,t:{title:t("Create PIN")||"Create PIN"}};
  }
}

</script>
</body>
</html>
