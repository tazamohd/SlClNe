<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/salis-auto-design-system-f22df384-eb3b-4838-99e5-e987504e70f0/styles.css">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="salis-icon.js"></script>
<style>body{margin:0;background:#F8FAFC}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}</style>
</helmet>
<div class="{{ rootClass }}" dir="{{ dir }}" data-screen-label="Terms-Conditions" style="min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:var(--bg-page);font-family:var(--font-ui,'Inter',sans-serif);padding:24px;box-sizing:border-box">
  <div style="width:100%;max-width:640px;position:relative;z-index:1;animation:fadeUp .3s ease">
    <div style="background:var(--surface-card);border:1px solid var(--border-default);border-radius:12px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;max-height:80vh">
      <div style="padding:20px 24px;border-bottom:1px solid var(--border-default);display:flex;align-items:center;gap:10px">
        <span style="padding:8px;border-radius:10px;background:rgba(10,94,215,.1);color:var(--salis-blue);display:flex"><salis-icon name="FileText" size="18"></salis-icon></span>
        <h2 style="margin:0;font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--text-heading)">{{ t.title }}</h2>
      </div>
      <div style="padding:20px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;color:var(--text-body);font-size:14px;line-height:1.7">
        <sc-for list="{{ paragraphs }}" as="p" hint-placeholder-count="6"><p style="margin:0">{{ p }}</p></sc-for>
      </div>
      <div style="padding:16px 24px;border-top:1px solid var(--border-default);display:flex;align-items:center;justify-content:space-between;gap:16px">
        <button onClick="{{ toggleAgree }}" style="display:flex;align-items:center;gap:8px;border:none;background:none;cursor:pointer;font-family:var(--font-action);font-size:13px;color:var(--text-body)">
          <span style="{{ cbStyle }}"><sc-if value="{{ agreed }}" hint-placeholder-val="{{ false }}"><salis-icon name="Check" size="12" stroke-width="3"></salis-icon></sc-if></span>
          <span>{{ t.iAgree }}</span>
        </button>
        <a href="Onboarding.dc.html" style="{{ ctaStyle }}">{{ t.continue }}</a>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;ar&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;}}">
class Component extends DCLogic {
  state={dark:null,lang:null,AR:{},agreed:false};
  componentDidMount(){import("./gms-data.js").then(m=>this.setState({AR:m.AR}));}
  renderVals(){
    const dark=this.state.dark??((localStorage.getItem("salis-theme")??this.props.theme)==="dark");
    const lang=this.state.lang??(localStorage.getItem("salis-lang")??this.props.lang??"en");
    const AR=this.state.AR,t=s=>lang==="ar"?(AR[s]||s):s;
    const agreed=this.state.agreed;
    const paragraphs=Array.from({length:6},(_,i)=>t("Terms & Conditions")+" — section "+(i+1)+". "+t("Integrated automotive workshop management system")+".");
    return {rootClass:dark?"dark":"",dir:lang==="ar"?"rtl":"ltr",paragraphs,agreed,
      toggleAgree:()=>this.setState({agreed:!agreed}),
      cbStyle:"width:18px;height:18px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;"+(agreed?"background:var(--salis-gradient);border:none;color:#fff":"background:var(--surface-inset);border:1.5px solid var(--border-strong);color:transparent"),
      ctaStyle:"display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 20px;border-radius:8px;font-family:var(--font-action);font-weight:600;font-size:13px;text-decoration:none;white-space:nowrap;flex-shrink:0;"+(agreed?"background:var(--salis-gradient);color:#fff;box-shadow:0 4px 12px rgba(10,94,215,.25);cursor:pointer":"background:var(--surface-inset);color:var(--text-muted);pointer-events:none"),
      t:{title:t("Terms & Conditions"),iAgree:t("I have read and agree to the")+" "+t("Terms & Conditions"),continue:t("Continue")}};
  }
}

</script>
</body>
</html>
