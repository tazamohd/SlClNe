<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/salis-auto-design-system-f22df384-eb3b-4838-99e5-e987504e70f0/styles.css">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="salis-icon.js"></script>
<style>body{margin:0;background:#F8FAFC}a{color:#0A5ED7;text-decoration:none}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}</style>
</helmet>
<div class="{{ rootClass }}" dir="{{ dir }}" data-screen-label="HR-Mobile" style="min-height:100vh;display:flex;flex-direction:column;background:var(--bg-page);font-family:var(--font-ui,'Inter',sans-serif)">
  <div style="padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border-default);background:var(--surface-sidebar)">
    <a href="Dashboard.Mobile.dc.html" style="display:flex;color:var(--text-muted)"><salis-icon name="{{ backChev }}" size="20"></salis-icon></a>
    <div style="flex:1"><h1 style="margin:0;font-size:17px;font-family:var(--font-display);font-weight:800;color:var(--text-heading)">{{ t.hrPayroll }}</h1></div>
    <button onClick="{{ toggleTheme }}" style="width:32px;height:32px;border-radius:8px;border:none;background:none;cursor:pointer;color:var(--text-muted);display:flex;align-items:center;justify-content:center"><salis-icon name="{{ themeIcon }}" size="16"></salis-icon></button>
    <button style="width:36px;height:36px;border-radius:8px;border:none;background:var(--salis-gradient);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(10,94,215,.3)"><salis-icon name="Plus" size="18"></salis-icon></button>
  </div>
  <div style="padding:10px 16px;border-bottom:1px solid var(--border-default);display:flex;gap:6px;overflow-x:auto;background:var(--surface-card)">
    <sc-for list="{{ tabs }}" as="tb" hint-placeholder-count="3"><button onClick="{{ tb.select }}" style="height:32px;padding:0 14px;border-radius:8px;border:none;cursor:pointer;font-family:var(--font-action);font-size:12px;font-weight:600;white-space:nowrap;flex-shrink:0;{{ tb.style }}">{{ tb.label }}</button></sc-for>
  </div>
  <!-- Stats -->
  <div style="padding:12px 16px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <sc-for list="{{ hrStats }}" as="s" hint-placeholder-count="4">
      <div style="background:var(--surface-card);border:1px solid var(--border-default);border-radius:10px;padding:12px;display:flex;align-items:center;gap:8px">
        <span style="{{ s.iconStyle }}"><salis-icon name="{{ s.icon }}" size="14"></salis-icon></span>
        <div><p style="margin:0;font-size:10px;color:var(--text-muted)">{{ s.label }}</p><p style="margin:1px 0 0;font-size:16px;font-family:var(--font-display);font-weight:900;color:var(--text-heading)">{{ s.value }}</p></div>
      </div>
    </sc-for>
  </div>
  <div style="flex:1;overflow-y:auto;padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;animation:fadeUp .3s ease;-webkit-overflow-scrolling:touch">
    <sc-for list="{{ employees }}" as="e" hint-placeholder-count="6">
      <div style="background:var(--surface-card);border:1px solid var(--border-default);border-radius:10px;padding:12px;display:flex;align-items:center;gap:10px">
        <span style="width:36px;height:36px;border-radius:50%;background:var(--salis-gradient);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0">{{ e.initial }}</span>
        <div style="flex:1;min-width:0"><p style="margin:0;font-size:13px;font-weight:600;color:var(--text-heading)">{{ e.name }}</p><p style="margin:1px 0 0;font-size:11px;color:var(--text-muted)">{{ e.dept }} · {{ e.position }}</p></div>
        <div style="text-align:end"><span style="{{ e.statusStyle }}">{{ e.status }}</span><p style="margin:3px 0 0;font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--text-heading)" dir="ltr">{{ e.salary }}</p></div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;ar&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;}}">
class Component extends DCLogic {
  state={dark:null,lang:null,AR:{},tab:"employees"};
  componentDidMount(){import("./gms-data.js").then(m=>this.setState({AR:m.AR}));}
  renderVals(){
    const dark=this.state.dark??((localStorage.getItem("salis-theme")??this.props.theme)==="dark");
    const lang=this.state.lang??(localStorage.getItem("salis-lang")??this.props.lang??"en");
    const rtl=lang==="ar",AR=this.state.AR,t=s=>rtl?(AR[s]||s):s;
    const tab=this.state.tab;
    const tabs=[["employees",t("Employee Directory")],["payroll",t("Payroll")],["attendance",t("Attendance")]].map(([id,label])=>({label,select:()=>this.setState({tab:id}),style:tab===id?"background:var(--salis-gradient);color:#fff":"background:var(--surface-inset);color:var(--text-body)"}));
    const pill=(bg,fg)=>"font-size:9px;font-weight:600;padding:2px 6px;border-radius:9999px;background:"+bg+";color:"+fg;
    const hrStats=[
      {icon:"Users",label:t("Total"),value:"12",iconStyle:"padding:8px;border-radius:8px;background:rgba(10,94,215,.1);color:var(--salis-blue);display:flex"},
      {icon:"UserCheck",label:t("Present"),value:"9",iconStyle:"padding:8px;border-radius:8px;background:rgba(10,94,215,.1);color:var(--salis-blue);display:flex"},
      {icon:"Clock",label:t("On Leave"),value:"2",iconStyle:"padding:8px;border-radius:8px;background:rgba(11,179,255,.1);color:#0BB3FF;display:flex"},
      {icon:"DollarSign",label:t("Payroll"),value:"38.7K",iconStyle:"padding:8px;border-radius:8px;background:rgba(10,94,215,.1);color:var(--salis-blue);display:flex"}
    ];
    const employees=[
      {name:"Yousef Al-Otaibi",initial:"Y",dept:t("Workshop"),position:t("Technician"),status:t("Present"),statusStyle:pill("rgba(10,94,215,.1)","#0A5ED7"),salary:"SAR 6,500"},
      {name:"Bandar Al-Qahtani",initial:"B",dept:t("Workshop"),position:t("Technician"),status:t("Present"),statusStyle:pill("rgba(10,94,215,.1)","#0A5ED7"),salary:"SAR 6,200"},
      {name:"Faisal Al-Harbi",initial:"F",dept:t("Workshop"),position:t("Technician"),status:t("On Leave"),statusStyle:pill("rgba(11,179,255,.1)","#0BB3FF"),salary:"SAR 5,800"},
      {name:"Nasser Al-Dosari",initial:"N",dept:t("Workshop"),position:t("Technician"),status:t("Present"),statusStyle:pill("rgba(10,94,215,.1)","#0A5ED7"),salary:"SAR 5,500"},
      {name:"Khalid Al-Amri",initial:"K",dept:t("Administration"),position:t("Manager"),status:t("Present"),statusStyle:pill("rgba(10,94,215,.1)","#0A5ED7"),salary:"SAR 12,000"},
      {name:"Layla Al-Sulaiman",initial:"L",dept:t("Accounting"),position:t("Service Advisor"),status:t("On Leave"),statusStyle:pill("rgba(11,179,255,.1)","#0BB3FF"),salary:"SAR 7,500"}
    ];
    return{rootClass:dark?"dark":"",dir:rtl?"rtl":"ltr",themeIcon:dark?"Sun":"Moon",backChev:rtl?"ChevronRight":"ChevronLeft",
      toggleTheme:()=>{localStorage.setItem("salis-theme",dark?"light":"dark");this.setState({dark:!dark});},
      tabs,hrStats,employees,t:{hrPayroll:t("HR & Payroll")}};
  }
}
</script>
</body>
</html>
