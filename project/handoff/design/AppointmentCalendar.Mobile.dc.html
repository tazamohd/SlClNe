<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/salis-auto-design-system-f22df384-eb3b-4838-99e5-e987504e70f0/styles.css">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="salis-icon.js"></script>
<style>body{margin:0;background:#F8FAFC}a{color:#0A5ED7;text-decoration:none}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}</style>
</helmet>
<div class="{{ rootClass }}" dir="{{ dir }}" data-screen-label="Calendar-Mobile" style="min-height:100vh;display:flex;flex-direction:column;background:var(--bg-page);font-family:var(--font-ui,'Inter',sans-serif)">
  <div style="padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border-default);background:var(--surface-sidebar)">
    <a href="Appointments.Mobile.dc.html" style="display:flex;color:var(--text-muted)"><salis-icon name="{{ backChev }}" size="20"></salis-icon></a>
    <div style="flex:1"><h1 style="margin:0;font-size:17px;font-family:var(--font-display);font-weight:800;color:var(--text-heading)">{{ t.calendar }}</h1></div>
    <button onClick="{{ toggleTheme }}" style="width:32px;height:32px;border-radius:8px;border:none;background:none;cursor:pointer;color:var(--text-muted);display:flex;align-items:center;justify-content:center"><salis-icon name="{{ themeIcon }}" size="16"></salis-icon></button>
    <button style="width:36px;height:36px;border-radius:8px;border:none;background:var(--salis-gradient);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(10,94,215,.3)"><salis-icon name="Plus" size="18"></salis-icon></button>
  </div>
  <!-- Date Strip -->
  <div style="padding:10px 16px;border-bottom:1px solid var(--border-default);background:var(--surface-card)">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <button onClick="{{ prevWeek }}" style="width:28px;height:28px;border-radius:6px;border:1px solid var(--border-default);background:var(--surface-card);cursor:pointer;color:var(--text-muted);display:flex;align-items:center;justify-content:center"><salis-icon name="{{ prevChev }}" size="14"></salis-icon></button>
      <span style="font-family:var(--font-display);font-size:14px;font-weight:700;color:var(--text-heading)">{{ dateLabel }}</span>
      <button onClick="{{ nextWeek }}" style="width:28px;height:28px;border-radius:6px;border:1px solid var(--border-default);background:var(--surface-card);cursor:pointer;color:var(--text-muted);display:flex;align-items:center;justify-content:center"><salis-icon name="{{ nextChev }}" size="14"></salis-icon></button>
    </div>
    <div style="display:flex;gap:4px">
      <sc-for list="{{ weekDays }}" as="wd" hint-placeholder-count="7">
        <button onClick="{{ wd.select }}" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;border:none;cursor:pointer;{{ wd.style }}">
          <span style="font-family:var(--font-action);font-size:10px;font-weight:500;{{ wd.dayColor }}">{{ wd.dayName }}</span>
          <span style="font-size:15px;font-weight:700;{{ wd.numStyle }}">{{ wd.dayNum }}</span>
          <sc-if value="{{ wd.hasDot }}" hint-placeholder-val="{{ false }}"><span style="width:4px;height:4px;border-radius:50%;background:var(--salis-blue)"></span></sc-if>
        </button>
      </sc-for>
    </div>
  </div>
  <!-- Day Appointments -->
  <div style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;animation:fadeUp .3s ease;-webkit-overflow-scrolling:touch">
    <sc-for list="{{ daySlots }}" as="slot" hint-placeholder-count="6">
      <div style="display:flex;gap:10px;align-items:flex-start">
        <span style="width:50px;flex-shrink:0;font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--text-muted);padding-top:10px" dir="ltr">{{ slot.time }}</span>
        <sc-if value="{{ slot.hasAppt }}" hint-placeholder-val="{{ false }}">
          <div style="flex:1;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px;{{ slot.apptStyle }}">
            <div style="display:flex;align-items:center;justify-content:space-between"><span style="font-size:13px;font-weight:600">{{ slot.name }}</span><span style="font-size:10px;font-weight:500;opacity:.8">{{ slot.duration }}</span></div>
            <span style="font-size:12px;opacity:.8">{{ slot.vehicle }} · {{ slot.service }}</span>
          </div>
        </sc-if>
        <sc-if value="{{ slot.empty }}" hint-placeholder-val="{{ true }}">
          <div style="flex:1;height:44px;border-radius:8px;border:1px dashed var(--border-default);display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:11px">{{ t.available }}</div>
        </sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;ar&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;}}">
class Component extends DCLogic {
  state={dark:null,lang:null,AR:{},weekOffset:0,selectedDay:2};
  componentDidMount(){import("./gms-data.js").then(m=>this.setState({AR:m.AR}));}
  renderVals(){
    const dark=this.state.dark??((localStorage.getItem("salis-theme")??this.props.theme)==="dark");
    const lang=this.state.lang??(localStorage.getItem("salis-lang")??this.props.lang??"en");
    const rtl=lang==="ar",AR=this.state.AR,t=s=>rtl?(AR[s]||s):s;
    const dayNames=rtl?["أحد","اثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"]:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    const baseDate=new Date(2026,6,20+this.state.weekOffset*7);
    const startOfWeek=new Date(baseDate);startOfWeek.setDate(baseDate.getDate()-baseDate.getDay());
    const sel=this.state.selectedDay;
    const apptDays={2:true,3:true,5:true};
    const weekDays=Array.from({length:7},(_,i)=>{const d=new Date(startOfWeek);d.setDate(startOfWeek.getDate()+i);const on=i===sel;const hasAppts=!!apptDays[i];
      return{dayName:dayNames[i],dayNum:String(d.getDate()),hasDot:hasAppts&&!on,select:()=>this.setState({selectedDay:i}),
        style:on?"background:var(--salis-gradient);box-shadow:0 2px 8px rgba(10,94,215,.3)":"background:var(--surface-inset)",
        dayColor:on?"color:#fff":"color:var(--text-muted)",numStyle:on?"color:#fff":"color:var(--text-heading)"};});
    const months=rtl?["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"]:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const selDate=new Date(startOfWeek);selDate.setDate(startOfWeek.getDate()+sel);
    const dateLabel=months[selDate.getMonth()]+" "+selDate.getDate()+", "+selDate.getFullYear();
    const dayAppts={
      2:[{time:"9:00 AM",name:"Ahmed Al-Rashid",vehicle:"Toyota Camry 2022",service:t("Maintenance"),duration:"1h",style:"background:rgba(10,94,215,.12);color:var(--salis-blue);border-inline-start:3px solid var(--salis-blue)"},
         {time:"11:00 AM",name:"Omar Al-Ghamdi",vehicle:"Hyundai Sonata 2023",service:t("Diagnostics"),duration:"30m",style:"background:rgba(11,179,255,.12);color:#0BB3FF;border-inline-start:3px solid #0BB3FF"}],
      3:[{time:"10:30 AM",name:"Fatima Al-Zahrani",vehicle:"Nissan Patrol 2021",service:t("Inspection"),duration:"1h",style:"background:rgba(11,179,255,.12);color:#0BB3FF;border-inline-start:3px solid #0BB3FF"}],
      5:[{time:"9:00 AM",name:"Mohammed Hassan",vehicle:"Lexus ES 350 2020",service:t("Oil Change"),duration:"45m",style:"background:rgba(10,94,215,.12);color:var(--salis-blue);border-inline-start:3px solid var(--salis-blue)"},
         {time:"1:00 PM",name:"Fahad Al-Qahtani",vehicle:"Kia Sportage 2021",service:t("Tire Service"),duration:"1h",style:"background:rgba(100,116,139,.1);color:#64748B;border-inline-start:3px solid #64748B"},
         {time:"3:30 PM",name:"Noura Al-Harbi",vehicle:"Honda Accord 2022",service:t("Repair"),duration:"2h",style:"background:rgba(249,115,22,.1);color:#F97316;border-inline-start:3px solid #F97316"}]
    };
    const hours=["8:00 AM","9:00 AM","10:00 AM","11:00 AM","12:00 PM","1:00 PM","2:00 PM","3:00 PM","4:00 PM","5:00 PM"];
    const selAppts=dayAppts[sel]||[];
    const apptByTime={};selAppts.forEach(a=>apptByTime[a.time]=a);
    const daySlots=hours.map(time=>{const a=apptByTime[time];return a?{time,hasAppt:true,empty:false,name:a.name,vehicle:a.vehicle,service:a.service,duration:a.duration,apptStyle:a.style}:{time,hasAppt:false,empty:true};});
    return{rootClass:dark?"dark":"",dir:rtl?"rtl":"ltr",themeIcon:dark?"Sun":"Moon",
      prevChev:rtl?"ChevronRight":"ChevronLeft",nextChev:rtl?"ChevronLeft":"ChevronRight",backChev:rtl?"ChevronRight":"ChevronLeft",
      toggleTheme:()=>{localStorage.setItem("salis-theme",dark?"light":"dark");this.setState({dark:!dark});},
      toggleLang:()=>{const l=rtl?"en":"ar";localStorage.setItem("salis-lang",l);this.setState({lang:l});},
      weekDays,daySlots,dateLabel,
      prevWeek:()=>this.setState(s=>({weekOffset:s.weekOffset-1})),
      nextWeek:()=>this.setState(s=>({weekOffset:s.weekOffset+1})),
      t:{calendar:t("Calendar"),available:t("Available"),today:t("Today")}};
  }
}
</script>
</body>
</html>
