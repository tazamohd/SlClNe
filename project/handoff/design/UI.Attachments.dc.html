<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script src="./support.js"></script></head><body><x-dc>
<helmet><link rel="stylesheet" href="_ds/salis-auto-design-system-f22df384-eb3b-4838-99e5-e987504e70f0/styles.css"><script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script><script src="salis-icon.js"></script><style>body{margin:0;background:#F8FAFC}a{color:#0A5ED7;text-decoration:none}a:hover{color:#0952C0}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.hscroll::-webkit-scrollbar{display:none}</style></helmet>
<div class="{{ rootClass }}" dir="{{ dir }}" data-screen-label="Attachments" style="min-height:100vh;background:var(--bg-page);font-family:var(--font-ui,'Inter',sans-serif)">
<div style="height:56px;background:var(--surface-sidebar);border-bottom:1px solid var(--border-default);padding:0 24px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm)"><div style="display:flex;align-items:center;gap:8px"><div style="width:28px;height:28px;border-radius:8px;background:var(--salis-gradient);display:flex;align-items:center;justify-content:center"><salis-icon name="Car" size="14" style="color:#fff"></salis-icon></div><span style="font-size:14px;font-weight:700;color:var(--text-heading)">SALIS AUTO</span></div><span style="font-size:13px;color:var(--text-muted)">·</span><span style="font-size:13px;font-weight:600;color:var(--text-body)">{{ t.title }}</span><div style="flex:1"></div><button onClick="{{ toggleTheme }}" style="width:32px;height:32px;border-radius:8px;border:none;background:none;cursor:pointer;color:var(--text-muted);display:flex;align-items:center;justify-content:center"><salis-icon name="{{ themeIcon }}" size="16"></salis-icon></button></div>
<div style="padding:24px;display:flex;flex-direction:column;gap:20px;animation:fadeUp .3s ease">
<h2 style="margin:0;font-size:24px;font-family:var(--font-display);font-weight:900;color:var(--text-heading)">{{ t.title }}</h2>
<div style="max-width:720px;display:flex;flex-direction:column;gap:16px">
<div style="border:2px dashed var(--border-default);border-radius:14px;padding:26px;text-align:center;cursor:pointer;background:var(--surface-card);transition:all .15s" style-hover="border-color:var(--salis-blue);background:rgba(10,94,215,.02)"><span style="padding:12px;border-radius:50%;background:rgba(10,94,215,.08);color:var(--salis-blue);display:inline-flex;margin-bottom:10px"><salis-icon name="Paperclip" size="24"></salis-icon></span><p style="margin:0;font-size:14px;font-weight:600;color:var(--text-heading)">{{ t.drop }}</p><p style="margin:4px 0 0;font-size:12px;color:var(--text-muted)">{{ t.formats }}</p></div>
<div style="background:var(--surface-card);border-radius:16px;border:1px solid var(--border-default);box-shadow:var(--shadow-sm);overflow:hidden">
<div style="padding:14px 20px;border-bottom:1px solid var(--border-default);display:flex;align-items:center;gap:10px"><h3 style="margin:0;font-size:15px;font-weight:700;color:var(--text-heading)">{{ t.files }}</h3><span style="font-size:12px;font-weight:600;padding:2px 10px;border-radius:9999px;background:rgba(10,94,215,.08);color:var(--salis-blue)">{{ count }}</span><span style="flex:1"></span><span style="font-size:12px;color:var(--text-muted)">{{ totalSize }}</span></div>
<sc-for list="{{ files }}" as="f" hint-placeholder-count="5">
<div style="display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border-default);transition:background .15s" style-hover="background:rgba(10,94,215,.03)">
<span style="{{ f.iconStyle }}"><salis-icon name="{{ f.icon }}" size="16"></salis-icon></span>
<div style="flex:1;min-width:0"><p style="margin:0;font-size:13px;font-weight:500;color:var(--text-heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ f.name }}</p><p style="margin:2px 0 0;font-size:11px;color:var(--text-muted)">{{ f.size }} · {{ f.uploaded }} · {{ f.by }}</p></div>
<div style="display:flex;gap:6px;flex-shrink:0"><button style="width:28px;height:28px;border:none;border-radius:6px;background:rgba(10,94,215,.06);color:var(--salis-blue);cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:rgba(10,94,215,.12)"><salis-icon name="Eye" size="13"></salis-icon></button><button style="width:28px;height:28px;border:none;border-radius:6px;background:rgba(10,94,215,.06);color:var(--salis-blue);cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:rgba(10,94,215,.12)"><salis-icon name="Download" size="13"></salis-icon></button><button style="width:28px;height:28px;border:none;border-radius:6px;background:rgba(249,115,22,.06);color:var(--salis-orange);cursor:pointer;display:flex;align-items:center;justify-content:center" style-hover="background:rgba(249,115,22,.12)"><salis-icon name="Trash2" size="13"></salis-icon></button></div>
</div></sc-for></div></div>
</div></div></x-dc>

 {name:"Pre-repair inspection.pdf",size:"1.4 MB",uploaded:"Jul 21",by:"Yousef Al-Otaibi",icon:"FileText",iconStyle:ic("rgba(10,94,215,.08)","#0A5ED7")},
 {name:"Damage photo — front bumper.jpg",size:"3.2 MB",uploaded:"Jul 21",by:"Yousef Al-Otaibi",icon:"Image",iconStyle:ic("rgba(11,179,255,.08)","#0BB3FF")},
 {name:"Customer approval signature.png",size:"148 KB",uploaded:"Jul 21",by:"Fatima Al-Zahrani",icon:"PenTool",iconStyle:ic("rgba(249,115,22,.08)","#F97316")},

return{rootClass:dark?"dark":"",dir:"ltr",themeIcon:dark?"Sun":"Moon",toggleTheme:()=>{localStorage.setItem("salis-theme",dark?"light":"dark");this.setState({dark:!dark})},...extra};}}</script></body></html>
