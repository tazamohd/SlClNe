<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/salis-auto-design-system-f22df384-eb3b-4838-99e5-e987504e70f0/styles.css">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="salis-icon.js"></script>
<style>
body{margin:0;background:#F8FAFC}
a{color:#0A5ED7;text-decoration:none}a:hover{color:#0952C0}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style>
</helmet>
<div class="{{ rootClass }}" dir="{{ dir }}" data-screen-label="Reports" style="display:flex;height:100vh;overflow:hidden;background:var(--bg-page);font-family:var(--font-ui,'Inter',sans-serif)">
  <aside style="width:280px;flex-shrink:0;background:var(--surface-sidebar);border-inline-end:1px solid var(--border-default);display:flex;flex-direction:column;height:100vh">
    <div style="padding:12px 12px 4px">
      <div style="display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;background:var(--surface-inset);border:1px solid var(--border-default)">
        <span style="width:28px;height:28px;border-radius:50%;background:var(--salis-gradient);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0">{{ userInitial }}</span>
        <div style="flex:1;min-width:0">
          <p style="margin:0;font-size:12px;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ userName }}</p>
          <div style="display:flex;align-items:center;gap:6px">
            <span style="font-size:10px;font-weight:600;padding:1px 6px;border-radius:9999px;background:rgba(10,94,215,.12);color:var(--salis-blue)">{{ t.admin }}</span>
            <span style="font-size:10px;font-weight:600;padding:1px 6px;border-radius:9999px;background:var(--salis-gradient);color:#fff">PRO</span>
          </div>
        </div>
      </div>
    </div>
    <nav style="flex:1;padding:12px;overflow-y:auto">
      <div style="display:flex;flex-direction:column;gap:2px">
        <sc-for list="{{ navGroups }}" as="g" hint-placeholder-count="7">
          <div>
            <button onClick="{{ g.toggle }}" style="width:100%;display:flex;align-items:center;gap:8px;padding:8px;border:none;background:none;border-radius:6px;cursor:pointer;font-family:var(--font-action);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-primary)" style-hover="background:rgba(10,94,215,.1)">
              <span>{{ g.label }}</span><span style="flex:1"></span><salis-icon name="{{ g.chev }}" size="12" style="color:var(--text-muted)"></salis-icon>
            </button>
            <sc-if value="{{ g.open }}" hint-placeholder-val="{{ true }}">
              <div style="display:flex;flex-direction:column;gap:2px;margin-top:2px">
                <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="2">
                  <a href="{{ it.href }}" style="{{ it.style }}"><salis-icon name="{{ it.icon }}" size="14"></salis-icon><span>{{ it.label }}</span></a>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </nav>
    <div style="padding:12px;border-top:1px solid var(--border-default);display:flex;flex-direction:column;gap:8px">
      <button onClick="{{ toggleLang }}" style="display:flex;align-items:center;gap:8px;padding:6px 8px;border:none;background:none;border-radius:6px;cursor:pointer;font-family:var(--font-action);font-size:12px;font-weight:500;color:var(--text-muted)" style-hover="background:rgba(10,94,215,.08);color:var(--salis-blue)"><salis-icon name="Globe" size="14"></salis-icon><span>{{ langLabel }}</span></button>
      <a href="Login.dc.html" style="display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-family:var(--font-action);font-size:12px;font-weight:500;color:var(--salis-orange);height:32px;box-sizing:border-box" style-hover="background:var(--salis-orange);color:#fff"><salis-icon name="LogOut" size="16"></salis-icon><span>{{ t.logout }}</span></a>
    </div>
  </aside>
  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <header style="height:56px;flex-shrink:0;background:var(--surface-sidebar);border-bottom:1px solid var(--border-default);padding:0 24px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm)">
      <div style="flex:1"></div>
      <button onClick="{{ toggleTheme }}" aria-label="Toggle theme" style="display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:none;background:none;cursor:pointer;color:var(--text-muted)" style-hover="background:rgba(10,94,215,.1);color:var(--salis-blue)"><salis-icon name="{{ themeIcon }}" size="16"></salis-icon></button>
    </header>
    <main style="flex:1;overflow:auto">
      <div style="padding:24px;display:flex;flex-direction:column;gap:24px;animation:fadeUp .3s ease">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
          <h1 style="margin:0;font-size:30px;font-family:var(--font-display);font-weight:900;color:var(--text-heading)">{{ t.title }}</h1>
          <div style="display:flex;gap:10px">
            <span style="display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--border-default);background:var(--surface-card);font-family:var(--font-action);font-size:13px;color:var(--text-body)"><salis-icon name="Calendar" size="14"></salis-icon>{{ t.thisMonth }}</span>
            <button style="display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border:none;border-radius:8px;background:var(--salis-gradient);color:#fff;cursor:pointer;font-family:var(--font-action);font-weight:600;font-size:13px"><salis-icon name="Download" size="15"></salis-icon>{{ t.export }}</button>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px">
          <sc-for list="{{ kpis }}" as="k" hint-placeholder-count="3">
            <div style="background:var(--surface-card);border-radius:16px;padding:20px;border:1px solid var(--border-default);box-shadow:var(--shadow-sm)">
              <p style="margin:0;font-size:13px;color:var(--text-muted)">{{ k.label }}</p>
              <h3 style="margin:6px 0 0;font-size:28px;font-family:var(--font-display);font-weight:900;color:var(--text-heading)">{{ k.value }}</h3>
            </div>
          </sc-for>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px">
          <div style="background:var(--surface-card);border-radius:16px;padding:24px;border:1px solid var(--border-default);box-shadow:var(--shadow-sm)">
            <h3 style="margin:0 0 20px;font-size:18px;font-weight:700;color:var(--text-heading)">{{ t.revenueByService }}</h3>
            <div style="display:flex;flex-direction:column;gap:12px">
              <sc-for list="{{ svcBars }}" as="b" hint-placeholder-count="5">
                <div>
                  <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span style="color:var(--text-body)">{{ b.label }}</span><span style="font-family:var(--font-mono);color:var(--text-muted)">{{ b.amount }}</span></div>
                  <div style="height:8px;background:rgba(10,94,215,.08);border-radius:9999px;overflow:hidden"><div style="height:100%;width:{{ b.pct }}%;background:var(--salis-gradient-r);border-radius:9999px"></div></div>
                </div>
              </sc-for>
            </div>
          </div>
          <div style="background:var(--surface-card);border-radius:16px;padding:24px;border:1px solid var(--border-default);box-shadow:var(--shadow-sm)">
            <h3 style="margin:0 0 20px;font-size:18px;font-weight:700;color:var(--text-heading)">{{ t.topTechnicians }}</h3>
            <div style="display:flex;flex-direction:column;gap:14px">
              <sc-for list="{{ techs }}" as="tc" hint-placeholder-count="4">
                <div style="display:flex;align-items:center;gap:12px">
                  <span style="width:32px;height:32px;border-radius:50%;background:var(--salis-gradient);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0">{{ tc.initial }}</span>
                  <span style="flex:1;font-size:14px;color:var(--text-body)">{{ tc.name }}</span>
                  <span style="font-family:var(--font-mono);font-size:13px;color:var(--text-muted)">{{ tc.jobs }} {{ t.jobsWord }}</span>
                </div>
              </sc-for>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;ar&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;},&quot;userName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Khalid Al-Amri&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;}}">
class Component extends DCLogic {
  state={dark:null,lang:null,open:null,data:null};
  componentDidMount(){import("./gms-data.js").then(m=>this.setState({data:m}));}
  renderVals(){
    const dark=this.state.dark??((localStorage.getItem("salis-theme")??this.props.theme)==="dark");
    const lang=this.state.lang??(localStorage.getItem("salis-lang")??this.props.lang??"en");
    const rtl=lang==="ar",D=this.state.data;
    const t=s=>rtl&&D?(D.AR[s]||s):s;
    const NAV=D?(D.navFor?D.navFor(D.NAV):D.NAV):[];
    const open=this.state.open??NAV.map(g=>g.label);
    const navGroups=NAV.map(g=>{
      const isOpen=open.includes(g.label);
      return {label:t(g.label),open:isOpen,chev:isOpen?"ChevronDown":(rtl?"ChevronLeft":"ChevronRight"),
        toggle:()=>this.setState({open:isOpen?open.filter(x=>x!==g.label):[...open,g.label]}),
        items:g.items.map(it=>{
          const on=it.r==="reports";
          return {label:t(it.l),icon:g.icon,href:it.href||"#",
            style:"display:flex;align-items:center;gap:8px;padding:6px 12px;padding-inline-start:24px;border-radius:6px;cursor:pointer;font-family:var(--font-action);font-weight:500;font-size:12px;white-space:nowrap;overflow:hidden;text-decoration:none;"+(on?"background:var(--salis-gradient-r);color:#fff;box-shadow:var(--shadow)":"color:var(--text-primary)")};
        })};
    });
    const svcBars=[["Maintenance","SAR 42,100",78],["Repair","SAR 38,900",70],["Diagnostics","SAR 19,200",42],["Inspection","SAR 15,600",34],["Tire Service","SAR 12,650",28]].map(b=>({label:t(b[0]),amount:b[1],pct:b[2]}));
    const techs=[["Yousef Al-Otaibi",42],["Bandar Al-Qahtani",38],["Faisal Al-Harbi",35],["Nasser Al-Dosari",29]].map(tc=>({name:tc[0],initial:tc[0][0],jobs:tc[1]}));
    const kpis=[[t("Jobs Completed"),"186"],[t("Avg Job Value"),"SAR 690"],[t("Avg Turnaround"),"1.8 "+t("days")]].map(k=>({label:k[0],value:k[1]}));
    const _rid=(D&&D.currentRole)?D.currentRole():null;const _rl=((D&&D.ROLES)||[]).find(x=>x.id===_rid);const userName=_rl?(rtl?_rl.demo.ar:_rl.demo.name):(this.props.userName??"Khalid Al-Amri");const roleLabel=_rl?(rtl?_rl.ar:_rl.label):null;
    return {
      rootClass:dark?"dark":"",dir:rtl?"rtl":"ltr",
      themeIcon:dark?"Sun":"Moon",langLabel:rtl?"English":"عربي",
      toggleTheme:()=>{localStorage.setItem("salis-theme",dark?"light":"dark");this.setState({dark:!dark});},
      toggleLang:()=>{const l=rtl?"en":"ar";localStorage.setItem("salis-lang",l);this.setState({lang:l});},
      userName,userInitial:userName.trim()[0]||"K",navGroups,svcBars,techs,kpis,
      t:{admin:roleLabel||t("ADMIN"),logout:t("Logout"),title:t("Reports & Analytics"),thisMonth:t("This Month"),export:t("Export Report"),revenueByService:t("Revenue by Service"),topTechnicians:t("Top Technicians"),jobsWord:t("jobs")}
    };
  }
}
</script>
</body>
</html>
