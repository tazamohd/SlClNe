<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<link rel="stylesheet" href="_ds/salis-auto-design-system-f22df384-eb3b-4838-99e5-e987504e70f0/styles.css">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="salis-icon.js"></script>
<style>body{margin:0;background:#F8FAFC}a{color:#0A5ED7;text-decoration:none}a:hover{color:#0952C0}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}</style>
</helmet>
<div class="{{ rootClass }}" dir="{{ dir }}" data-screen-label="Knowledge Base" style="display:flex;height:100vh;overflow:hidden;background:var(--bg-page);font-family:var(--font-ui,'Inter',sans-serif)">
  <aside style="width:280px;flex-shrink:0;background:var(--surface-sidebar);border-inline-end:1px solid var(--border-default);display:flex;flex-direction:column;height:100vh"><div style="padding:12px 12px 4px"><div style="display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;background:var(--surface-inset);border:1px solid var(--border-default)"><span style="width:28px;height:28px;border-radius:50%;background:var(--salis-gradient);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0">{{ userInitial }}</span><div style="flex:1;min-width:0"><p style="margin:0;font-size:12px;font-weight:600;color:var(--text-primary)">{{ userName }}</p><div style="display:flex;align-items:center;gap:6px"><span style="font-size:10px;font-weight:600;padding:1px 6px;border-radius:9999px;background:rgba(10,94,215,.12);color:var(--salis-blue)">{{ t.admin }}</span><span style="font-size:10px;font-weight:600;padding:1px 6px;border-radius:9999px;background:var(--salis-gradient);color:#fff">PRO</span></div></div></div></div><nav style="flex:1;padding:12px;overflow-y:auto"><div style="display:flex;flex-direction:column;gap:2px"><sc-for list="{{ navGroups }}" as="g" hint-placeholder-count="7"><div><button onClick="{{ g.toggle }}" style="width:100%;display:flex;align-items:center;gap:8px;padding:8px;border:none;background:none;border-radius:6px;cursor:pointer;font-family:var(--font-action);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-primary)" style-hover="background:rgba(10,94,215,.1)"><span>{{ g.label }}</span><span style="flex:1"></span><salis-icon name="{{ g.chev }}" size="12" style="color:var(--text-muted)"></salis-icon></button><sc-if value="{{ g.open }}" hint-placeholder-val="{{ true }}"><div style="display:flex;flex-direction:column;gap:2px;margin-top:2px"><sc-for list="{{ g.items }}" as="it" hint-placeholder-count="2"><a href="{{ it.href }}" style="{{ it.style }}"><salis-icon name="{{ it.icon }}" size="14"></salis-icon><span>{{ it.label }}</span></a></sc-for></div></sc-if></div></sc-for></div></nav><div style="padding:12px;border-top:1px solid var(--border-default);display:flex;flex-direction:column;gap:8px"><button onClick="{{ toggleLang }}" style="display:flex;align-items:center;gap:8px;padding:6px 8px;border:none;background:none;border-radius:6px;cursor:pointer;font-family:var(--font-action);font-size:12px;font-weight:500;color:var(--text-muted)" style-hover="background:rgba(10,94,215,.08);color:var(--salis-blue)"><salis-icon name="Globe" size="14"></salis-icon><span>{{ langLabel }}</span></button><a href="Login.dc.html" style="display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-family:var(--font-action);font-size:12px;font-weight:500;color:var(--salis-orange);height:32px;box-sizing:border-box" style-hover="background:var(--salis-orange);color:#fff"><salis-icon name="LogOut" size="16"></salis-icon><span>{{ t.logout }}</span></a></div></aside>
  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <header style="height:56px;flex-shrink:0;background:var(--surface-sidebar);border-bottom:1px solid var(--border-default);padding:0 24px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm)"><div style="flex:1"></div><button onClick="{{ toggleTheme }}" style="display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:none;background:none;cursor:pointer;color:var(--text-muted)" style-hover="background:rgba(10,94,215,.1);color:var(--salis-blue)"><salis-icon name="{{ themeIcon }}" size="16"></salis-icon></button></header>
    <main style="flex:1;overflow:auto"><div style="padding:24px;display:flex;flex-direction:column;gap:24px;animation:fadeUp .3s ease">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:12px"><div style="position:relative"><div style="position:absolute;inset:0;background:#0A5ED7;border-radius:16px;filter:blur(12px);opacity:.3"></div><div style="position:relative;padding:12px;border-radius:16px;background:var(--salis-gradient);box-shadow:0 20px 25px -5px rgba(10,94,215,.25);color:#fff;display:flex"><salis-icon name="Library" size="28"></salis-icon></div></div><div><h1 style="margin:0;font-size:30px;font-family:var(--font-display);font-weight:900;color:var(--text-heading)">{{ t.title }}</h1><p style="margin:2px 0 0;font-size:13px;color:var(--text-muted)">{{ t.subtitle }}</p></div></div>
        <div style="display:flex;gap:10px">
          <span style="position:relative;display:flex;align-items:center"><salis-icon name="Search" size="15" style="position:absolute;inset-inline-start:12px;color:var(--text-muted)"></salis-icon><input placeholder="{{ t.search }}" style="width:260px;height:36px;border-radius:8px;border:1px solid var(--border-default);background:var(--surface-inset);padding:0 12px;padding-inline-start:32px;font-size:13px;color:var(--text-primary);outline:none"></span>
          <button style="display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border:none;border-radius:8px;background:var(--salis-gradient);color:#fff;cursor:pointer;font-family:var(--font-action);font-weight:600;font-size:13px;box-shadow:0 4px 12px rgba(10,94,215,.25)"><salis-icon name="Plus" size="16"></salis-icon>{{ t.addArticle }}</button>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">
        <sc-for list="{{ catCards }}" as="cc" hint-placeholder-count="4">
          <div style="background:var(--surface-card);border-radius:12px;padding:16px;border:1px solid var(--border-default);box-shadow:var(--shadow-sm);cursor:pointer;transition:all .2s ease" style-hover="border-color:rgba(10,94,215,.3);box-shadow:var(--shadow-lg)">
            <span style="{{ cc.iconStyle }}"><salis-icon name="{{ cc.icon }}" size="18"></salis-icon></span>
            <h4 style="margin:10px 0 4px;font-size:14px;font-weight:600;color:var(--text-heading)">{{ cc.name }}</h4>
            <p style="margin:0;font-size:12px;color:var(--text-muted)">{{ cc.count }} {{ t.articles }}</p>
          </div>
        </sc-for>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <h3 style="margin:0;font-size:16px;font-weight:700;color:var(--text-heading)">{{ t.recent }}</h3>
        <sc-for list="{{ articles }}" as="a" hint-placeholder-count="5">
          <div style="background:var(--surface-card);border-radius:14px;padding:16px;border:1px solid var(--border-default);box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .15s ease" style-hover="border-color:rgba(10,94,215,.2)">
            <span style="{{ a.iconStyle }}"><salis-icon name="FileText" size="16"></salis-icon></span>
            <div style="flex:1;min-width:0"><h4 style="margin:0;font-size:14px;font-weight:600;color:var(--text-heading)">{{ a.title }}</h4><p style="margin:2px 0 0;font-size:12px;color:var(--text-muted)">{{ a.category }} · {{ a.date }}</p></div>
            <div style="display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-muted);flex-shrink:0"><span style="display:flex;align-items:center;gap:3px"><salis-icon name="Eye" size="11"></salis-icon>{{ a.views }}</span><span style="{{ a.stStyle }}">{{ a.status }}</span></div>
          </div>
        </sc-for>
      </div>
    </div></main>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;ar&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;},&quot;userName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Khalid Al-Amri&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;}}">

class Component extends DCLogic {
  state={dark:null,lang:null,open:null,data:null};
  componentDidMount(){import("./gms-data.js").then(m=>this.setState({data:m}));}
  renderVals(){
    const dark=this.state.dark??((localStorage.getItem("salis-theme")??this.props.theme)==="dark");
    const lang=this.state.lang??(localStorage.getItem("salis-lang")??this.props.lang??"en");
    const rtl=lang==="ar",D=this.state.data;const t=s=>rtl&&D?(D.AR[s]||s):s;
    const NAV=D?(D.navFor?D.navFor(D.NAV):D.NAV):[];const open=this.state.open??NAV.map(g=>g.label);
    const navGroups=NAV.map(g=>{const isOpen=open.includes(g.label);return{label:t(g.label),open:isOpen,chev:isOpen?"ChevronDown":(rtl?"ChevronLeft":"ChevronRight"),toggle:()=>this.setState({open:isOpen?open.filter(x=>x!==g.label):[...open,g.label]}),items:g.items.map(it=>{const on=it.r==="knowledge-base";return{label:t(it.l),icon:g.icon,href:it.href||"#",style:"display:flex;align-items:center;gap:8px;padding:6px 12px;padding-inline-start:24px;border-radius:6px;cursor:pointer;font-family:var(--font-action);font-weight:500;font-size:12px;white-space:nowrap;overflow:hidden;text-decoration:none;"+(on?"background:var(--salis-gradient-r);color:#fff;box-shadow:var(--shadow)":"color:var(--text-primary)")}})};});
    const _rid=(D&&D.currentRole)?D.currentRole():null;const _rl=((D&&D.ROLES)||[]).find(x=>x.id===_rid);const userName=_rl?(rtl?_rl.demo.ar:_rl.demo.name):(this.props.userName??"Khalid Al-Amri");const roleLabel=_rl?(rtl?_rl.ar:_rl.label):null;
    const ic=(bg,fg)=>"padding:8px;border-radius:10px;background:"+bg+";color:"+fg+";display:flex";
    const pill=(bg,fg)=>"display:inline-flex;align-items:center;border-radius:9999px;padding:2px 8px;font-size:10px;font-weight:500;background:"+bg+";color:"+fg;
    const catCards=[
      {name:t("Workshop Procedures"),icon:"Wrench",iconStyle:ic("rgba(10,94,215,.1)","#0A5ED7"),count:"24"},
      {name:t("Customer Service"),icon:"Headphones",iconStyle:ic("rgba(11,179,255,.1)","#0BB3FF"),count:"18"},
      {name:t("Parts & Inventory"),icon:"Package",iconStyle:ic("rgba(249,115,22,.1)","#F97316"),count:"12"},
      {name:t("Policies & Compliance"),icon:"Shield",iconStyle:ic("rgba(11,31,59,.1)","#0B1F3B"),count:"8"}
    ];
    const articles=[
      {title:t("How to Process a Vehicle Check-In"),category:t("Workshop"),date:"Jul 20, 2026",views:"342",status:t("Published"),stStyle:pill("rgba(10,94,215,.1)","#0A5ED7"),iconStyle:ic("rgba(10,94,215,.06)","#0A5ED7")},
      {title:t("ZATCA E-Invoice Requirements"),category:t("Compliance"),date:"Jul 18, 2026",views:"256",status:t("Published"),stStyle:pill("rgba(10,94,215,.1)","#0A5ED7"),iconStyle:ic("rgba(249,115,22,.06)","#F97316")},
      {title:t("Parts Return Policy"),category:t("Inventory"),date:"Jul 15, 2026",views:"128",status:t("Draft"),stStyle:pill("rgba(249,115,22,.1)","#F97316"),iconStyle:ic("rgba(11,179,255,.06)","#0BB3FF")},
      {title:t("Customer Complaint Handling"),category:t("Customer Service"),date:"Jul 12, 2026",views:"189",status:t("Published"),stStyle:pill("rgba(10,94,215,.1)","#0A5ED7"),iconStyle:ic("rgba(11,31,59,.06)","#0B1F3B")},
      {title:t("Quality Control Checklist"),category:t("Workshop"),date:"Jul 10, 2026",views:"412",status:t("Published"),stStyle:pill("rgba(10,94,215,.1)","#0A5ED7"),iconStyle:ic("rgba(10,94,215,.06)","#0A5ED7")}
    ];
    return{rootClass:dark?"dark":"",dir:rtl?"rtl":"ltr",themeIcon:dark?"Sun":"Moon",langLabel:rtl?"English":"عربي",
      toggleTheme:()=>{localStorage.setItem("salis-theme",dark?"light":"dark");this.setState({dark:!dark});},
      toggleLang:()=>{const l=rtl?"en":"ar";localStorage.setItem("salis-lang",l);this.setState({lang:l});},
      userName,userInitial:userName.trim()[0]||"K",navGroups,catCards,articles,
      t:{admin:roleLabel||t("ADMIN"),logout:t("Logout"),title:t("Knowledge Base"),subtitle:t("AI Platform"),search:t("Search articles..."),addArticle:t("Add Article"),articles:t("articles"),recent:t("Recent Articles")}};
  }
}

</script>
</body>
</html>
