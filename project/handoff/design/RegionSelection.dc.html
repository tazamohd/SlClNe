<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/salis-auto-design-system-f22df384-eb3b-4838-99e5-e987504e70f0/styles.css">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="salis-icon.js"></script>
<style>body{margin:0;background:#F8FAFC}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}</style>
</helmet>
<div class="{{ rootClass }}" dir="{{ dir }}" data-screen-label="Region-Selection" style="min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:var(--bg-page);font-family:var(--font-ui,'Inter',sans-serif)">
  <div style="position:absolute;inset:0;z-index:0;pointer-events:none"><div style="position:absolute;bottom:0;left:0;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(11,179,255,.1),transparent 65%);filter:blur(64px)"></div></div>
  <div style="position:relative;z-index:1;display:flex;flex-direction:column;gap:20px;max-width:420px;width:100%;padding:16px;animation:fadeUp .3s ease">
    <div style="text-align:center"><img src="assets/logo-blue-orange.png" alt="SALIS AUTO" style="width:100px;height:auto"><h1 style="margin:12px 0 0;font-size:20px;font-family:var(--font-display);font-weight:800;color:var(--text-heading)">{{ t.selectRegion }}</h1></div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <sc-for list="{{ cities }}" as="c" hint-placeholder-count="5">
        <button onClick="{{ c.select }}" style="{{ c.style }}"><salis-icon name="MapPin" size="16"></salis-icon><span>{{ c.label }}</span><span style="flex:1"></span><sc-if value="{{ c.picked }}" hint-placeholder-val="{{ false }}"><salis-icon name="Check" size="16"></salis-icon></sc-if></button>
      </sc-for>
    </div>
    <a href="Login.dc.html" style="width:100%;display:inline-flex;align-items:center;justify-content:center;height:48px;border-radius:8px;background:var(--salis-gradient);color:#fff;font-family:var(--font-action);font-weight:600;font-size:15px;text-decoration:none;box-shadow:0 4px 12px rgba(10,94,215,.25);white-space:nowrap;box-sizing:border-box">{{ t.continue }}</a>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;ar&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;}}">
class Component extends DCLogic {
  state={dark:null,lang:null,AR:{},picked:"Riyadh"};
  componentDidMount(){import("./gms-data.js").then(m=>this.setState({AR:m.AR}));}
  renderVals(){
    const dark=this.state.dark??((localStorage.getItem("salis-theme")??this.props.theme)==="dark");
    const lang=this.state.lang??(localStorage.getItem("salis-lang")??this.props.lang??"en");
    const AR=this.state.AR,t=s=>lang==="ar"?(AR[s]||s):s;
    const names=["Riyadh","Jeddah","Dammam","Makkah","Madinah"];
    const cities=names.map(n=>{const on=this.state.picked===n;
      return {label:t(n),picked:on,select:()=>this.setState({picked:n}),
        style:"width:100%;display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:8px;cursor:pointer;font-family:var(--font-action);font-size:14px;font-weight:500;transition:all .15s ease;box-sizing:border-box;"+(on?"border:1.5px solid var(--salis-blue);background:rgba(10,94,215,.06);color:var(--salis-blue)":"border:1px solid var(--border-default);background:var(--surface-card);color:var(--text-body)")};
    });
    return {rootClass:dark?"dark":"",dir:lang==="ar"?"rtl":"ltr",cities,t:{selectRegion:t("Select your region"),continue:t("Continue")}};
  }
}

</script>
</body>
</html>
