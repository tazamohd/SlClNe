<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<link rel="stylesheet" href="_ds/salis-auto-design-system-f22df384-eb3b-4838-99e5-e987504e70f0/styles.css">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="salis-icon.js"></script>
<style>body{margin:0;background:#F8FAFC}a{color:#0A5ED7;text-decoration:none}a:hover{color:#0952C0}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}</style>
</helmet>
<div class="{{ rootClass }}" dir="{{ dir }}" data-screen-label="BI Dashboard" style="display:flex;height:100vh;overflow:hidden;background:var(--bg-page);font-family:var(--font-ui,'Inter',sans-serif)">
  <aside style="width:280px;flex-shrink:0;background:var(--surface-sidebar);border-inline-end:1px solid var(--border-default);display:flex;flex-direction:column;height:100vh"><div style="padding:12px 12px 4px"><div style="display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;background:var(--surface-inset);border:1px solid var(--border-default)"><span style="width:28px;height:28px;border-radius:50%;background:var(--salis-gradient);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0">{{ userInitial }}</span><div style="flex:1;min-width:0"><p style="margin:0;font-size:12px;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ userName }}</p><div style="display:flex;align-items:center;gap:6px"><span style="font-size:10px;font-weight:600;padding:1px 6px;border-radius:9999px;background:rgba(10,94,215,.12);color:var(--salis-blue)">{{ t.admin }}</span><span style="font-size:10px;font-weight:600;padding:1px 6px;border-radius:9999px;background:var(--salis-gradient);color:#fff">PRO</span></div></div></div></div><nav style="flex:1;padding:12px;overflow-y:auto"><div style="display:flex;flex-direction:column;gap:2px"><sc-for list="{{ navGroups }}" as="g" hint-placeholder-count="7"><div><button onClick="{{ g.toggle }}" style="width:100%;display:flex;align-items:center;gap:8px;padding:8px;border:none;background:none;border-radius:6px;cursor:pointer;font-family:var(--font-action);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-primary)" style-hover="background:rgba(10,94,215,.1)"><span>{{ g.label }}</span><span style="flex:1"></span><salis-icon name="{{ g.chev }}" size="12" style="color:var(--text-muted)"></salis-icon></button><sc-if value="{{ g.open }}" hint-placeholder-val="{{ true }}"><div style="display:flex;flex-direction:column;gap:2px;margin-top:2px"><sc-for list="{{ g.items }}" as="it" hint-placeholder-count="2"><a href="{{ it.href }}" style="{{ it.style }}"><salis-icon name="{{ it.icon }}" size="14"></salis-icon><span>{{ it.label }}</span></a></sc-for></div></sc-if></div></sc-for></div></nav><div style="padding:12px;border-top:1px solid var(--border-default);display:flex;flex-direction:column;gap:8px"><button onClick="{{ toggleLang }}" style="display:flex;align-items:center;gap:8px;padding:6px 8px;border:none;background:none;border-radius:6px;cursor:pointer;font-family:var(--font-action);font-size:12px;font-weight:500;color:var(--text-muted)" style-hover="background:rgba(10,94,215,.08);color:var(--salis-blue)"><salis-icon name="Globe" size="14"></salis-icon><span>{{ langLabel }}</span></button><a href="Login.dc.html" style="display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-family:var(--font-action);font-size:12px;font-weight:500;color:var(--salis-orange);height:32px;box-sizing:border-box" style-hover="background:var(--salis-orange);color:#fff"><salis-icon name="LogOut" size="16"></salis-icon><span>{{ t.logout }}</span></a></div></aside>
  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <header style="height:56px;flex-shrink:0;background:var(--surface-sidebar);border-bottom:1px solid var(--border-default);padding:0 24px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm)"><div style="flex:1"></div><button style="display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:none;border-radius:8px;background:none;cursor:pointer;font-family:var(--font-action);font-size:12px;font-weight:500;color:var(--salis-blue)" style-hover="background:rgba(10,94,215,.08)"><salis-icon name="Plus" size="14"></salis-icon>{{ t.addWidget }}</button><button onClick="{{ toggleTheme }}" style="display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:none;background:none;cursor:pointer;color:var(--text-muted)" style-hover="background:rgba(10,94,215,.1);color:var(--salis-blue)"><salis-icon name="{{ themeIcon }}" size="16"></salis-icon></button></header>
    <main style="flex:1;overflow:auto"><div style="padding:24px;display:flex;flex-direction:column;gap:24px;animation:fadeUp .3s ease">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:12px">
          <div style="position:relative"><div style="position:absolute;inset:0;background:#0A5ED7;border-radius:16px;filter:blur(12px);opacity:.3"></div><div style="position:relative;padding:12px;border-radius:16px;background:var(--salis-gradient);box-shadow:0 20px 25px -5px rgba(10,94,215,.25);color:#fff;display:flex"><salis-icon name="LayoutDashboard" size="28"></salis-icon></div></div>
          <div><h1 style="margin:0;font-size:30px;font-family:var(--font-display);font-weight:900;color:var(--text-heading)">{{ t.title }}</h1><p style="margin:2px 0 0;font-size:13px;color:var(--text-muted)">{{ t.subtitle }}</p></div>
        </div>
        <div style="display:flex;gap:10px"><span style="display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--border-default);background:var(--surface-card);font-family:var(--font-action);font-size:13px;color:var(--text-body)"><salis-icon name="RefreshCw" size="14"></salis-icon>{{ t.lastRefresh }}</span></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px">
        <sc-for list="{{ widgets }}" as="w" hint-placeholder-count="6">
          <div style="background:var(--surface-card);border-radius:16px;padding:20px;border:1px solid var(--border-default);box-shadow:var(--shadow-sm);grid-column:{{ w.span }}">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px">
              <span style="{{ w.iconStyle }}"><salis-icon name="{{ w.icon }}" size="16"></salis-icon></span>
              <h3 style="margin:0;font-size:15px;font-weight:700;color:var(--text-heading);flex:1">{{ w.title }}</h3>
              <button style="width:24px;height:24px;border:none;border-radius:6px;background:none;cursor:pointer;color:var(--text-muted);display:flex;align-items:center;justify-content:center" style-hover="background:rgba(10,94,215,.08)"><salis-icon name="MoreHorizontal" size="14"></salis-icon></button>
            </div>
            <sc-if value="{{ w.isChart }}" hint-placeholder-val="{{ true }}">
              <svg viewBox="0 0 300 120" style="width:100%;height:auto;display:block">
                <defs><linearGradient id="{{ w.gradId }}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="{{ w.color }}" stop-opacity="0.3"></stop><stop offset="100%" stop-color="{{ w.color }}" stop-opacity="0"></stop></linearGradient></defs>
                <path d="{{ w.areaPath }}" fill="url(#{{ w.gradId }})"></path>
                <path d="{{ w.linePath }}" fill="none" stroke="{{ w.color }}" stroke-width="2" stroke-linecap="round"></path>
              </svg>
            </sc-if>
            <sc-if value="{{ w.isBars }}" hint-placeholder-val="{{ false }}">
              <div style="display:flex;align-items:flex-end;gap:8px;height:100px;padding-top:8px">
                <sc-for list="{{ w.bars }}" as="bar" hint-placeholder-count="7">
                  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
                    <div style="width:100%;height:{{ bar.h }}px;background:{{ bar.color }};border-radius:4px 4px 0 0"></div>
                    <span style="font-size:9px;color:var(--text-muted)">{{ bar.label }}</span>
                  </div>
                </sc-for>
              </div>
            </sc-if>
            <sc-if value="{{ w.isMetric }}" hint-placeholder-val="{{ false }}">
              <h2 style="margin:0;font-size:32px;font-family:var(--font-display);font-weight:900;color:var(--text-heading)" dir="ltr">{{ w.value }}</h2>
              <div style="display:flex;align-items:center;gap:6px;margin-top:6px"><span style="display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:600;color:{{ w.trendColor }}"><salis-icon name="{{ w.trendIcon }}" size="13"></salis-icon>{{ w.trend }}</span></div>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </div></main>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;ar&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;},&quot;userName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Khalid Al-Amri&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;}}">

class Component extends DCLogic {
  state={dark:null,lang:null,open:null,data:null};
  componentDidMount(){import("./gms-data.js").then(m=>this.setState({data:m}));}
  renderVals(){
    const dark=this.state.dark??((localStorage.getItem("salis-theme")??this.props.theme)==="dark");
    const lang=this.state.lang??(localStorage.getItem("salis-lang")??this.props.lang??"en");
    const rtl=lang==="ar",D=this.state.data;const t=s=>rtl&&D?(D.AR[s]||s):s;
    const NAV=D?(D.navFor?D.navFor(D.NAV):D.NAV):[];const open=this.state.open??NAV.map(g=>g.label);
    const navGroups=NAV.map(g=>{const isOpen=open.includes(g.label);return{label:t(g.label),open:isOpen,chev:isOpen?"ChevronDown":(rtl?"ChevronLeft":"ChevronRight"),toggle:()=>this.setState({open:isOpen?open.filter(x=>x!==g.label):[...open,g.label]}),items:g.items.map(it=>{const on=it.r==="bi-dashboard";return{label:t(it.l),icon:g.icon,href:it.href||"#",style:"display:flex;align-items:center;gap:8px;padding:6px 12px;padding-inline-start:24px;border-radius:6px;cursor:pointer;font-family:var(--font-action);font-weight:500;font-size:12px;white-space:nowrap;overflow:hidden;text-decoration:none;"+(on?"background:var(--salis-gradient-r);color:#fff;box-shadow:var(--shadow)":"color:var(--text-primary)")}})};});
    const _rid=(D&&D.currentRole)?D.currentRole():null;const _rl=((D&&D.ROLES)||[]).find(x=>x.id===_rid);const userName=_rl?(rtl?_rl.demo.ar:_rl.demo.name):(this.props.userName??"Khalid Al-Amri");const roleLabel=_rl?(rtl?_rl.ar:_rl.label):null;
    const ic=(bg,fg)=>"padding:6px;border-radius:8px;background:"+bg+";color:"+fg+";display:flex";
    const widgets=[
      {title:t("Revenue Trend"),icon:"TrendingUp",iconStyle:ic("rgba(10,94,215,.1)","#0A5ED7"),span:"span 2",isChart:true,isBars:false,isMetric:false,color:"#0A5ED7",gradId:"rg1",linePath:"M10,80 C50,70 90,55 130,50 C170,45 210,48 250,35 C270,28 290,22 290,22",areaPath:"M10,80 C50,70 90,55 130,50 C170,45 210,48 250,35 C270,28 290,22 290,22 L290,110 L10,110 Z"},
      {title:t("Avg Job Value"),icon:"DollarSign",iconStyle:ic("rgba(249,115,22,.1)","#F97316"),span:"span 1",isChart:false,isBars:false,isMetric:true,value:"SAR 3,750",trend:"+8.4%",trendColor:"#0A5ED7",trendIcon:"ArrowUpRight"},
      {title:t("Jobs by Day"),icon:"BarChart3",iconStyle:ic("rgba(11,179,255,.1)","#0BB3FF"),span:"span 1",isChart:false,isBars:true,isMetric:false,bars:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map((d,i)=>({label:d,h:Math.round(30+Math.random()*60),color:i<5?"#0A5ED7":"#0BB3FF"}))},
      {title:t("Customer Growth"),icon:"Users",iconStyle:ic("rgba(11,31,59,.1)","#0B1F3B"),span:"span 1",isChart:true,isBars:false,isMetric:false,color:"#0BB3FF",gradId:"rg2",linePath:"M10,90 C50,85 90,75 130,68 C170,60 210,55 250,42 C270,36 290,30 290,30",areaPath:"M10,90 C50,85 90,75 130,68 C170,60 210,55 250,42 C270,36 290,30 290,30 L290,110 L10,110 Z"},
      {title:t("Parts Utilization"),icon:"Package",iconStyle:ic("rgba(249,115,22,.1)","#F97316"),span:"span 1",isChart:false,isBars:false,isMetric:true,value:"86%",trend:"+2.1%",trendColor:"#0A5ED7",trendIcon:"ArrowUpRight"}
    ];
    return{rootClass:dark?"dark":"",dir:rtl?"rtl":"ltr",themeIcon:dark?"Sun":"Moon",langLabel:rtl?"English":"عربي",
      toggleTheme:()=>{localStorage.setItem("salis-theme",dark?"light":"dark");this.setState({dark:!dark});},
      toggleLang:()=>{const l=rtl?"en":"ar";localStorage.setItem("salis-lang",l);this.setState({lang:l});},
      userName,userInitial:userName.trim()[0]||"K",navGroups,widgets,
      t:{admin:roleLabel||t("ADMIN"),logout:t("Logout"),title:t("BI Dashboard"),subtitle:t("Reports & Analytics"),addWidget:t("Add Widget"),lastRefresh:"2 min ago"}};
  }
}

</script>
</body>
</html>
