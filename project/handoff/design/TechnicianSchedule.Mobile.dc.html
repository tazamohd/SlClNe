<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/salis-auto-design-system-f22df384-eb3b-4838-99e5-e987504e70f0/styles.css">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="salis-icon.js"></script>
<style>body{margin:0;background:#F8FAFC}a{color:#0A5ED7;text-decoration:none}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}</style>
</helmet>
<div class="{{ rootClass }}" dir="{{ dir }}" data-screen-label="TechSchedule-Mobile" style="min-height:100vh;display:flex;flex-direction:column;background:var(--bg-page);font-family:var(--font-ui,'Inter',sans-serif)">
  <div style="padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border-default);background:var(--surface-sidebar)">
    <a href="Technicians.Mobile.dc.html" style="display:flex;color:var(--text-muted)"><salis-icon name="{{ backChev }}" size="20"></salis-icon></a>
    <div style="flex:1"><h1 style="margin:0;font-size:17px;font-family:var(--font-display);font-weight:800;color:var(--text-heading)">{{ t.techSchedule }}</h1><p style="margin:0;font-size:11px;color:var(--text-muted)">{{ t.todayDate }}</p></div>
    <button onClick="{{ toggleTheme }}" style="width:32px;height:32px;border-radius:8px;border:none;background:none;cursor:pointer;color:var(--text-muted);display:flex;align-items:center;justify-content:center"><salis-icon name="{{ themeIcon }}" size="16"></salis-icon></button>
    <button style="width:36px;height:36px;border-radius:8px;border:none;background:var(--salis-gradient);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(10,94,215,.3)"><salis-icon name="Plus" size="18"></salis-icon></button>
  </div>
  <div style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;animation:fadeUp .3s ease;-webkit-overflow-scrolling:touch">
    <sc-for list="{{ technicians }}" as="tech" hint-placeholder-count="4">
      <div style="background:var(--surface-card);border:1px solid var(--border-default);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="width:36px;height:36px;border-radius:50%;background:var(--salis-gradient);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0">{{ tech.initial }}</span>
          <div style="flex:1"><p style="margin:0;font-size:13px;font-weight:700;color:var(--text-heading)">{{ tech.name }}</p><p style="margin:1px 0 0;font-size:11px;color:var(--text-muted)">{{ tech.specialty }}</p></div>
          <div style="text-align:end"><span style="font-family:var(--font-mono);font-size:15px;font-weight:900;color:var(--salis-blue)">{{ tech.utilization }}%</span></div>
        </div>
        <div style="height:4px;border-radius:2px;background:var(--surface-inset)"><div style="height:100%;border-radius:2px;background:var(--salis-gradient);width:{{ tech.utilization }}%"></div></div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <sc-for list="{{ tech.jobs }}" as="j" hint-placeholder-count="2">
            <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;{{ j.style }}">
              <span style="font-family:var(--font-mono);font-size:10px;font-weight:600;flex-shrink:0" dir="ltr">{{ j.time }}</span>
              <div style="flex:1;min-width:0"><p style="margin:0;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ j.customer }}</p><p style="margin:1px 0 0;font-size:10px;opacity:.8">{{ j.service }}</p></div>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;ar&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;}}">
class Component extends DCLogic {
  state={dark:null,lang:null,AR:{}};
  componentDidMount(){import("./gms-data.js").then(m=>this.setState({AR:m.AR}));}
  renderVals(){
    const dark=this.state.dark??((localStorage.getItem("salis-theme")??this.props.theme)==="dark");
    const lang=this.state.lang??(localStorage.getItem("salis-lang")??this.props.lang??"en");
    const rtl=lang==="ar",AR=this.state.AR,t=s=>rtl?(AR[s]||s):s;
    const technicians=[
      {name:"Yousef Al-Otaibi",initial:"Y",specialty:t("Engine & Diagnostics"),utilization:85,jobs:[
        {time:"8:30",customer:"Ahmed Al-Rashid",service:t("Maintenance")+" — Toyota Camry",style:"background:rgba(10,94,215,.1);color:var(--salis-blue)"},
        {time:"10:00",customer:"Mohammed Hassan",service:t("Diagnostics")+" — Lexus ES 350",style:"background:rgba(11,179,255,.1);color:#0BB3FF"},
        {time:"2:00",customer:"Sara Al-Mutairi",service:t("Inspection")+" — Ford Explorer",style:"background:rgba(10,94,215,.1);color:var(--salis-blue)"}]},
      {name:"Bandar Al-Qahtani",initial:"B",specialty:t("Body & Paint"),utilization:60,jobs:[
        {time:"9:00",customer:"Fatima Al-Zahrani",service:t("Body & Paint")+" — Nissan Patrol",style:"background:rgba(249,115,22,.1);color:#F97316"},
        {time:"1:30",customer:"Omar Al-Ghamdi",service:t("Paint Condition")+" — Hyundai",style:"background:rgba(249,115,22,.1);color:#F97316"}]},
      {name:"Faisal Al-Harbi",initial:"F",specialty:t("Electrical"),utilization:45,jobs:[
        {time:"9:30",customer:"Layla Al-Sulaiman",service:t("Battery")+" — GMC Yukon",style:"background:rgba(11,179,255,.1);color:#0BB3FF"}]},
      {name:"Nasser Al-Dosari",initial:"N",specialty:t("Tires & Wheels"),utilization:30,jobs:[
        {time:"11:00",customer:"Fahad Al-Qahtani",service:t("Tire Service")+" — Kia Sportage",style:"background:rgba(100,116,139,.1);color:#64748B"}]}
    ];
    return{rootClass:dark?"dark":"",dir:rtl?"rtl":"ltr",themeIcon:dark?"Sun":"Moon",backChev:rtl?"ChevronRight":"ChevronLeft",
      toggleTheme:()=>{localStorage.setItem("salis-theme",dark?"light":"dark");this.setState({dark:!dark});},
      technicians,t:{techSchedule:t("Technician Schedule"),todayDate:rtl?"الثلاثاء، 22 يوليو":"Tue, Jul 22"}};
  }
}
</script>
</body>
</html>
