<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/salis-auto-design-system-f22df384-eb3b-4838-99e5-e987504e70f0/styles.css">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="salis-icon.js"></script>
<style>body{margin:0;background:#F8FAFC}a{color:#0A5ED7;text-decoration:none}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}</style>
</helmet>
<div class="{{ rootClass }}" dir="{{ dir }}" data-screen-label="Social-Login" style="min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:var(--bg-page);font-family:var(--font-ui,'Inter',sans-serif)">
  <div style="position:absolute;inset:0;z-index:0;pointer-events:none"><div style="position:absolute;top:0;right:0;width:800px;height:800px;border-radius:50%;background:radial-gradient(circle,rgba(10,94,215,.1),transparent 65%);filter:blur(64px)"></div></div>
  <div style="width:100%;max-width:420px;padding:16px;position:relative;z-index:1;animation:fadeUp .3s ease">
    <div style="background:color-mix(in srgb,var(--surface-card) 95%,transparent);backdrop-filter:blur(24px);border:1px solid var(--border-default);border-radius:16px;box-shadow:var(--shadow-lg);padding:28px;display:flex;flex-direction:column;gap:20px">
      <div style="display:flex;flex-direction:column;align-items:center;gap:10px">
        <div style="position:relative"><div style="position:absolute;inset:-10px;background:var(--salis-gradient);border-radius:14px;filter:blur(16px);opacity:.2"></div><img src="assets/logo-blue-orange.png" alt="SALIS AUTO" style="position:relative;width:110px;height:auto"></div>
        <h2 style="margin:0;font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--text-heading)">{{ t.signIn }}</h2>
        <p style="margin:0;font-size:13px;color:var(--text-muted)">{{ t.chooseProvider }}</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <sc-for list="{{ providers }}" as="p" hint-placeholder-count="3">
          <button style="display:flex;align-items:center;gap:12px;height:54px;padding:0 16px;border-radius:12px;border:1.5px solid var(--border-default);cursor:pointer;font-family:var(--font-action);font-weight:500;font-size:14px;color:var(--text-body);transition:all .15s ease;{{ p.bg }}" style-hover="border-color:{{ p.hoverBorder }};background:{{ p.hoverBg }};transform:translateY(-1px);box-shadow:0 4px 12px {{ p.shadow }}">
            <span style="width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;{{ p.iconStyle }}"><salis-icon name="{{ p.icon }}" size="18"></salis-icon></span>
            <span style="flex:1;text-align:start">{{ p.label }}</span>
            <salis-icon name="{{ p.chev }}" size="16" style="color:var(--text-muted)"></salis-icon>
          </button>
        </sc-for>
      </div>
      <div style="display:flex;align-items:center;gap:10px"><span style="flex:1;height:1px;background:var(--border-default)"></span><span style="font-size:12px;color:var(--text-muted);font-weight:500">{{ t.or }}</span><span style="flex:1;height:1px;background:var(--border-default)"></span></div>
      <a href="Login.dc.html" style="display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:10px;background:var(--salis-gradient);color:#fff;font-family:var(--font-action);font-weight:600;font-size:14px;white-space:nowrap;box-shadow:0 4px 12px rgba(10,94,215,.25)"><salis-icon name="Mail" size="16"></salis-icon>{{ t.emailSignIn }}</a>
      <div style="display:flex;align-items:center;justify-content:center;gap:4px">
        <salis-icon name="Building2" size="14" style="color:var(--text-muted)"></salis-icon>
        <a href="SSOLogin.dc.html" style="font-family:var(--font-action);font-size:13px;font-weight:500">{{ t.ssoLink }}</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;ar&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;}}">
class Component extends DCLogic {
  state={dark:null,lang:null,AR:{}};
  componentDidMount(){import("./gms-data.js").then(m=>this.setState({AR:m.AR}));}
  renderVals(){
    const dark=this.state.dark??((localStorage.getItem("salis-theme")??this.props.theme)==="dark");
    const lang=this.state.lang??(localStorage.getItem("salis-lang")??this.props.lang??"en");
    const AR=this.state.AR,t=s=>lang==="ar"?(AR[s]||s):s;
    const rtl=lang==="ar";const chev=rtl?"ChevronLeft":"ChevronRight";
    const providers=[
      {icon:"Chrome",label:t("Continue with")+" Google",bg:"background:var(--surface-card)",iconStyle:"background:rgba(10,94,215,.08);color:#0A5ED7",hoverBorder:"#0A5ED7",hoverBg:"rgba(10,94,215,.04)",shadow:"rgba(10,94,215,.1)",chev},
      {icon:"Apple",label:t("Continue with")+" Apple",bg:"background:var(--surface-card)",iconStyle:"background:rgba(11,31,59,.08);color:#0B1F3B",hoverBorder:"#0B1F3B",hoverBg:"rgba(11,31,59,.04)",shadow:"rgba(11,31,59,.1)",chev},
      {icon:"Building2",label:t("Continue with")+" Microsoft",bg:"background:var(--surface-card)",iconStyle:"background:rgba(11,179,255,.08);color:#0BB3FF",hoverBorder:"#0BB3FF",hoverBg:"rgba(11,179,255,.04)",shadow:"rgba(11,179,255,.1)",chev}
    ];
    return {rootClass:dark?"dark":"",dir:rtl?"rtl":"ltr",providers,
      t:{signIn:t("Sign In"),chooseProvider:rtl?"اختر طريقة تسجيل الدخول":"Choose how to sign in",or:rtl?t("or"):"OR",emailSignIn:t("Sign in with Email"),ssoLink:t("Use SSO instead")}};
  }
}
</script>
</body>
</html>
