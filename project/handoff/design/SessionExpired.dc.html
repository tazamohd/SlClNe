<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/salis-auto-design-system-f22df384-eb3b-4838-99e5-e987504e70f0/styles.css">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="salis-icon.js"></script>
<style>body{margin:0;background:#F8FAFC}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}</style>
</helmet>
<div class="{{ rootClass }}" dir="{{ dir }}" data-screen-label="Session-Expired" style="min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:var(--bg-page);font-family:var(--font-ui,'Inter',sans-serif)">
  <div style="position:absolute;inset:0;z-index:0;pointer-events:none"><div style="position:absolute;top:0;left:0;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(11,179,255,.08),transparent 65%);filter:blur(64px)"></div></div>
  <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;max-width:380px;padding:16px;animation:fadeUp .3s ease">
    <span style="position:relative;display:inline-flex;align-items:center;justify-content:center;width:76px;height:76px">
      <svg width="76" height="76" style="position:absolute;inset:0;transform:rotate(-90deg)"><circle cx="38" cy="38" r="32" fill="none" stroke="rgba(11,179,255,.15)" stroke-width="4"></circle><circle cx="38" cy="38" r="32" fill="none" stroke="#0BB3FF" stroke-width="4" stroke-linecap="round" stroke-dasharray="201" stroke-dashoffset="60"></circle></svg>
      <salis-icon name="TimerOff" size="28" style="color:#0BB3FF"></salis-icon>
    </span>
    <h1 style="margin:0;font-size:22px;font-family:var(--font-display);font-weight:800;color:var(--text-heading)">{{ t.title }}</h1>
    <p style="margin:0;font-family:var(--font-action);font-size:14px;color:var(--text-muted)">{{ t.desc }}</p>
    <p style="margin:0;font-family:var(--font-mono);font-size:11px;color:var(--text-faint)">{{ t.timedOutAt }}</p>
    <a href="Login.dc.html" style="margin-top:8px;display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 24px;border-radius:8px;background:var(--salis-gradient);color:#fff;font-family:var(--font-action);font-weight:600;font-size:14px;text-decoration:none;box-shadow:0 4px 12px rgba(10,94,215,.25);white-space:nowrap">{{ t.signIn }}</a>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;ar&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;}}">
class Component extends DCLogic {
  state={dark:null,lang:null,AR:{}};
  componentDidMount(){import("./gms-data.js").then(m=>this.setState({AR:m.AR}));}
  renderVals(){
    const dark=this.state.dark??((localStorage.getItem("salis-theme")??this.props.theme)==="dark");
    const lang=this.state.lang??(localStorage.getItem("salis-lang")??this.props.lang??"en");
    const AR=this.state.AR,t=s=>lang==="ar"?(AR[s]||s):s;
    const now=new Date(),hh=String(now.getHours()).padStart(2,"0"),mm=String(now.getMinutes()).padStart(2,"0");
    return {rootClass:dark?"dark":"",dir:lang==="ar"?"rtl":"ltr",t:{title:t("Session Expired"),desc:t("Your session has expired. Please sign in again."),signIn:t("Sign In"),timedOutAt:(lang==="ar"?"انتهت الجلسة الساعة ":"Timed out at ")+hh+":"+mm}};
  }
}

</script>
</body>
</html>
