<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/salis-auto-design-system-f22df384-eb3b-4838-99e5-e987504e70f0/styles.css">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="salis-icon.js"></script>
<style>body{margin:0;background:#F8FAFC}a{color:#0A5ED7;text-decoration:none}input::placeholder{color:#9BA4B0}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}</style>
</helmet>
<div class="{{ rootClass }}" dir="{{ dir }}" data-screen-label="SSO-Login" style="min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:var(--bg-page);font-family:var(--font-ui,'Inter',sans-serif)">
  <div style="position:absolute;inset:0;z-index:0;pointer-events:none"><div style="position:absolute;top:0;right:0;width:800px;height:800px;border-radius:50%;background:radial-gradient(circle,rgba(10,94,215,.1),transparent 65%);filter:blur(64px)"></div></div>
  <div style="width:100%;max-width:420px;padding:16px;position:relative;z-index:1;animation:fadeUp .3s ease">
    <div style="background:var(--surface-card);border:1px solid var(--border-default);border-radius:12px;box-shadow:var(--shadow-lg);padding:24px;text-align:center">
      <img src="assets/logo-blue-orange.png" alt="SALIS AUTO" style="width:110px;height:auto;margin-bottom:12px">
      <h2 style="margin:0;font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--text-heading)">{{ t.title }}</h2>
      <p style="margin:8px 0 20px;font-family:var(--font-action);font-size:13px;color:var(--text-muted)">{{ t.desc }}</p>
      <form onSubmit="{{ submit }}" style="display:flex;flex-direction:column;gap:16px;text-align:start">
        <div style="display:flex;flex-direction:column;gap:6px">
          <label style="font-family:var(--font-action);font-size:12px;font-weight:500;color:var(--text-primary)">{{ t.domain }}</label>
          <span style="position:relative;display:flex;align-items:center">
            <input dir="ltr" value="{{ domain }}" onChange="{{ setDomain }}" placeholder="company.com" style="width:100%;height:48px;border-radius:8px;border:1px solid var(--border-default);background:var(--surface-inset);padding:0 14px;font-size:14px;color:var(--text-primary);outline:none;box-sizing:border-box">
          </span>
        </div>
        <button type="submit" style="width:100%;height:48px;border:none;border-radius:8px;background:var(--salis-gradient);color:#fff;font-family:var(--font-action);font-weight:600;font-size:15px;cursor:pointer;box-shadow:0 4px 12px rgba(10,94,215,.25);white-space:nowrap;box-sizing:border-box">{{ t.continueSso }}</button>
      </form>
      <a href="Login.dc.html" style="display:block;margin-top:16px;font-family:var(--font-action);font-size:13px;font-weight:500">{{ t.backToSignIn }}</a>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;ar&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;}}">
class Component extends DCLogic {
  state={dark:null,lang:null,AR:{},domain:""};
  componentDidMount(){import("./gms-data.js").then(m=>this.setState({AR:m.AR}));}
  renderVals(){
    const dark=this.state.dark??((localStorage.getItem("salis-theme")??this.props.theme)==="dark");
    const lang=this.state.lang??(localStorage.getItem("salis-lang")??this.props.lang??"en");
    const AR=this.state.AR,t=s=>lang==="ar"?(AR[s]||s):s;
    return {rootClass:dark?"dark":"",dir:lang==="ar"?"rtl":"ltr",
      domain:this.state.domain,setDomain:e=>this.setState({domain:e.target.value}),
      submit:e=>{e.preventDefault();location.href="Dashboard.dc.html";},
      t:{title:t("SSO Login"),desc:t("Enter your credentials to access your account"),domain:t("Company Domain"),continueSso:t("Continue with SSO"),backToSignIn:t("Back to Sign In")}};
  }
}

</script>
</body>
</html>
