<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/salis-auto-design-system-f22df384-eb3b-4838-99e5-e987504e70f0/styles.css">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="salis-icon.js"></script>
<style>body{margin:0;background:#F8FAFC}a{color:#0A5ED7;text-decoration:none}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}</style>
</helmet>
<div class="{{ rootClass }}" dir="{{ dir }}" data-screen-label="Unauthorized-Mobile" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;background:var(--bg-page);font-family:var(--font-ui,'Inter',sans-serif);padding:16px">
  <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;width:100%;animation:fadeUp .3s ease">
    <div style="position:relative;width:100px;height:100px;animation:float 3s ease-in-out infinite">
      <div style="position:absolute;inset:8px;border-radius:16px;background:rgba(10,94,215,.06);transform:rotate(-6deg)"></div>
      <div style="position:absolute;inset:4px;border-radius:16px;background:rgba(10,94,215,.1);transform:rotate(3deg)"></div>
      <div style="position:absolute;inset:0;border-radius:16px;background:var(--surface-card);border:1px solid var(--border-default);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-lg)"><div style="display:flex;flex-direction:column;align-items:center;gap:2px"><salis-icon name="ShieldOff" size="26" style="color:var(--salis-blue)"></salis-icon><span style="font-family:var(--font-display);font-size:22px;font-weight:900;background:var(--salis-gradient-r);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent">403</span></div></div>
    </div>
    <div><h1 style="margin:0;font-size:22px;font-family:var(--font-display);font-weight:900;color:var(--text-heading)">{{ t.title }}</h1><p style="margin:8px 0 0;font-size:13px;color:var(--text-muted);line-height:1.5">{{ t.desc }}</p></div>
    <div style="background:var(--surface-card);border:1px solid var(--border-default);border-radius:12px;padding:14px;width:100%;box-sizing:border-box;display:flex;align-items:center;gap:10px">
      <span style="padding:8px;border-radius:10px;background:rgba(10,94,215,.1);color:var(--salis-blue);display:flex"><salis-icon name="Shield" size="16"></salis-icon></span>
      <div style="flex:1;text-align:start"><p style="margin:0;font-size:12px;font-weight:600;color:var(--text-heading)">{{ t.requiredRole }}</p><p style="margin:1px 0 0;font-size:11px;color:var(--text-muted)">{{ t.currentRole }}</p></div>
      <span style="padding:3px 8px;border-radius:9999px;background:rgba(249,115,22,.1);color:#F97316;font-size:10px;font-weight:600">{{ t.denied }}</span>
    </div>
    <div style="display:flex;gap:10px;width:100%">
      <a href="Dashboard.Mobile.dc.html" style="flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:50px;border-radius:8px;background:var(--salis-gradient);color:#fff;font-family:var(--font-action);font-weight:600;font-size:14px;text-decoration:none;box-shadow:0 4px 12px rgba(10,94,215,.25)"><salis-icon name="Home" size="16"></salis-icon>{{ t.goDash }}</a>
      <a href="Login.Mobile.dc.html" style="flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:50px;border-radius:8px;border:1.5px solid var(--border-strong);background:none;color:var(--text-body);font-family:var(--font-action);font-weight:500;font-size:14px;text-decoration:none"><salis-icon name="LogIn" size="16"></salis-icon>{{ t.switchAccount }}</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;ar&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;}}">
class Component extends DCLogic {
  state={dark:null,lang:null,AR:{}};
  componentDidMount(){import("./gms-data.js").then(m=>this.setState({AR:m.AR}));}
  renderVals(){
    const dark=this.state.dark??((localStorage.getItem("salis-theme")??this.props.theme)==="dark");
    const lang=this.state.lang??(localStorage.getItem("salis-lang")??this.props.lang??"en");
    const AR=this.state.AR,t=s=>lang==="ar"?(AR[s]||s):s;
    return{rootClass:dark?"dark":"",dir:lang==="ar"?"rtl":"ltr",
      t:{title:t("Unauthorized"),desc:t("You don't have permission to access this page."),goDash:t("Go to Dashboard"),
        switchAccount:lang==="ar"?"تبديل الحساب":"Switch Account",requiredRole:lang==="ar"?"صلاحية مطلوبة: مدير":"Required: Admin Role",
        currentRole:lang==="ar"?"صلاحيتك الحالية: فني":"Your role: Technician",denied:lang==="ar"?"مرفوض":"Denied"}};
  }
}
</script>
</body>
</html>
