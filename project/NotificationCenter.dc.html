<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/salis-auto-design-system-f22df384-eb3b-4838-99e5-e987504e70f0/styles.css">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="salis-icon.js"></script>
<style>body{margin:0;background:#F8FAFC}a{color:#0A5ED7;text-decoration:none}a:hover{color:#0952C0}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}</style>
</helmet>
<div class="{{ rootClass }}" dir="{{ dir }}" data-screen-label="Notification-Center" style="display:flex;height:100vh;overflow:hidden;background:var(--bg-page);font-family:var(--font-ui,'Inter',sans-serif)">
  <aside style="width:280px;flex-shrink:0;background:var(--surface-sidebar);border-inline-end:1px solid var(--border-default);display:flex;flex-direction:column;height:100vh">
    <div style="padding:12px 12px 4px"><div style="display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;background:var(--surface-inset);border:1px solid var(--border-default)"><span style="width:28px;height:28px;border-radius:50%;background:var(--salis-gradient);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0">K</span><div style="flex:1;min-width:0"><p style="margin:0;font-size:12px;font-weight:600;color:var(--text-primary)">Khalid Al-Amri</p><div style="display:flex;align-items:center;gap:6px"><span style="font-size:10px;font-weight:600;padding:1px 6px;border-radius:9999px;background:rgba(10,94,215,.12);color:var(--salis-blue)">{{ t.admin }}</span><span style="font-size:10px;font-weight:600;padding:1px 6px;border-radius:9999px;background:var(--salis-gradient);color:#fff">PRO</span></div></div></div></div>
    <nav style="flex:1;padding:12px;overflow-y:auto"><div style="display:flex;flex-direction:column;gap:2px"><sc-for list="{{ navGroups }}" as="g" hint-placeholder-count="7"><div><button onClick="{{ g.toggle }}" style="width:100%;display:flex;align-items:center;gap:8px;padding:8px;border:none;background:none;border-radius:6px;cursor:pointer;font-family:var(--font-action);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-primary)" style-hover="background:rgba(10,94,215,.1)"><span>{{ g.label }}</span><span style="flex:1"></span><salis-icon name="{{ g.chev }}" size="12" style="color:var(--text-muted)"></salis-icon></button><sc-if value="{{ g.open }}" hint-placeholder-val="{{ true }}"><div style="display:flex;flex-direction:column;gap:2px;margin-top:2px"><sc-for list="{{ g.items }}" as="it" hint-placeholder-count="2"><a href="{{ it.href }}" style="{{ it.style }}"><salis-icon name="{{ it.icon }}" size="14"></salis-icon><span>{{ it.label }}</span></a></sc-for></div></sc-if></div></sc-for></div></nav>
    <div style="padding:12px;border-top:1px solid var(--border-default);display:flex;flex-direction:column;gap:8px"><button onClick="{{ toggleLang }}" style="display:flex;align-items:center;gap:8px;padding:6px 8px;border:none;background:none;border-radius:6px;cursor:pointer;font-family:var(--font-action);font-size:12px;font-weight:500;color:var(--text-muted)" style-hover="background:rgba(10,94,215,.08);color:var(--salis-blue)"><salis-icon name="Globe" size="14"></salis-icon><span>{{ langLabel }}</span></button><a href="Login.dc.html" style="display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-family:var(--font-action);font-size:12px;font-weight:500;color:var(--salis-orange);height:32px;box-sizing:border-box" style-hover="background:var(--salis-orange);color:#fff"><salis-icon name="LogOut" size="16"></salis-icon><span>{{ t.logout }}</span></a></div>
  </aside>
  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <header style="height:56px;flex-shrink:0;background:var(--surface-sidebar);border-bottom:1px solid var(--border-default);padding:0 24px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm)"><div style="flex:1"></div><button onClick="{{ toggleTheme }}" style="display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:none;background:none;cursor:pointer;color:var(--text-muted)" style-hover="background:rgba(10,94,215,.1);color:var(--salis-blue)"><salis-icon name="{{ themeIcon }}" size="16"></salis-icon></button></header>
    <main style="flex:1;overflow:auto">
      <div style="padding:24px;display:flex;flex-direction:column;gap:20px;animation:fadeUp .3s ease;max-width:800px;margin:0 auto">
        <div style="display:flex;align-items:center;gap:16px">
          <div style="display:flex;align-items:center;gap:12px"><div style="position:relative"><div style="position:absolute;inset:0;background:#0A5ED7;border-radius:16px;filter:blur(12px);opacity:.3"></div><div style="position:relative;padding:12px;border-radius:16px;background:var(--salis-gradient);box-shadow:0 20px 25px -5px rgba(10,94,215,.25);color:#fff;display:flex"><salis-icon name="Bell" size="28"></salis-icon></div></div><div><h1 style="margin:0;font-size:26px;font-family:var(--font-display);font-weight:900;color:var(--text-heading)">{{ t.notifCenter }}</h1><p style="margin:2px 0 0;font-size:14px;color:var(--text-muted)">{{ unreadCount }} {{ t.unread }}</p></div></div>
          <div style="flex:1"></div>
          <!-- Filter Tabs -->
          <div style="display:flex;border-radius:8px;border:1px solid var(--border-default);overflow:hidden">
            <sc-for list="{{ filterTabs }}" as="ft" hint-placeholder-count="4">
              <button onClick="{{ ft.select }}" style="height:34px;padding:0 14px;border:none;cursor:pointer;font-family:var(--font-action);font-size:12px;font-weight:600;{{ ft.style }}">{{ ft.label }}</button>
            </sc-for>
          </div>
          <button onClick="{{ markAllRead }}" style="height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--border-default);background:var(--surface-card);cursor:pointer;font-family:var(--font-action);font-size:12px;font-weight:500;color:var(--text-body);display:flex;align-items:center;gap:6px" style-hover="border-color:var(--salis-blue);color:var(--salis-blue)"><salis-icon name="CheckCheck" size="14"></salis-icon>{{ t.markAllRead }}</button>
        </div>
        <!-- Notification List -->
        <div style="display:flex;flex-direction:column;gap:0">
          <sc-for list="{{ notifications }}" as="n" hint-placeholder-count="8">
            <div onClick="{{ n.markRead }}" style="display:flex;gap:14px;padding:16px;border-bottom:1px solid var(--border-default);cursor:pointer;transition:background .15s ease;{{ n.bgStyle }}" style-hover="background:rgba(10,94,215,.03)">
              <span style="padding:10px;border-radius:12px;display:flex;flex-shrink:0;{{ n.iconBg }}"><salis-icon name="{{ n.icon }}" size="18"></salis-icon></span>
              <div style="flex:1;min-width:0">
                <div style="display:flex;align-items:center;gap:8px">
                  <p style="margin:0;font-size:14px;font-weight:600;color:var(--text-heading)">{{ n.title }}</p>
                  <sc-if value="{{ n.unread }}" hint-placeholder-val="{{ false }}"><span style="width:8px;height:8px;border-radius:50%;background:var(--salis-blue);flex-shrink:0"></span></sc-if>
                </div>
                <p style="margin:4px 0 0;font-size:13px;color:var(--text-body);line-height:1.4">{{ n.body }}</p>
                <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
                  <span style="font-size:11px;color:var(--text-muted)">{{ n.time }}</span>
                  <span style="{{ n.catStyle }}">{{ n.category }}</span>
                </div>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;ar&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;}}">
class Component extends DCLogic {
  state={dark:null,lang:null,AR:{},NAV:[],collapsed:{},filter:"all",readSet:{}};
  componentDidMount(){import("./gms-data.js").then(m=>this.setState({AR:m.AR,NAV:(m.navFor?m.navFor(m.NAV):m.NAV)}));}
  renderVals(){
    const dark=this.state.dark??((localStorage.getItem("salis-theme")??this.props.theme)==="dark");
    const lang=this.state.lang??(localStorage.getItem("salis-lang")??this.props.lang??"en");
    const rtl=lang==="ar",AR=this.state.AR,t=s=>rtl?(AR[s]||s):s;
    const navItem=(icon,label,href)=>({icon,label:t(label),href,style:"display:flex;align-items:center;gap:8px;padding:8px 8px 8px 28px;border-radius:6px;font-family:var(--font-action);font-size:13px;font-weight:500;text-decoration:none;color:var(--text-body)"});
    const navGroups=this.state.NAV.map(g=>{const o=!this.state.collapsed[g.label];return{label:t(g.label),chev:o?"ChevronDown":"ChevronRight",open:o,toggle:()=>this.setState(s=>({collapsed:{...s.collapsed,[g.label]:o}})),items:g.items.map(i=>navItem(g.icon,i.l,i.href))};});
    const f=this.state.filter;
    const filterTabs=[["all",t("All Notifications")],["unread",t("Unread")],["alerts",t("Alerts")]].map(([id,label])=>({label,select:()=>this.setState({filter:id}),
      style:f===id?"background:var(--salis-gradient);color:#fff":"background:var(--surface-card);color:var(--text-body)"}));
    const pill=(bg,fg)=>"font-size:10px;font-weight:600;padding:2px 8px;border-radius:9999px;background:"+bg+";color:"+fg;
    const R=this.state.readSet;
    const allNotifs=[
      {id:1,icon:"Wrench",title:t("New Job Card Created"),body:"JC-E5D7A3B5 — Sara Al-Mutairi · Ford Explorer 2022",time:t("just now"),cat:"jobs",catLabel:t("Job Cards"),iconBg:"background:rgba(10,94,215,.1);color:var(--salis-blue)",catStyle:pill("rgba(10,94,215,.1)","#0A5ED7"),unread:true},
      {id:2,icon:"Calendar",title:t("Appointment Confirmed"),body:"Ahmed Al-Rashid — "+t("Maintenance")+" · Jul 23, 9:00 AM",time:"5 "+t("minutes ago"),cat:"appointments",catLabel:t("Appointments"),iconBg:"background:rgba(11,179,255,.1);color:#0BB3FF",catStyle:pill("rgba(11,179,255,.1)","#0BB3FF"),unread:true},
      {id:3,icon:"AlertTriangle",title:t("Invoice Overdue"),body:"INV-2026-0141 — Fatima Al-Zahrani · SAR 4,250",time:"2 "+t("hours ago"),cat:"alerts",catLabel:t("Alerts"),iconBg:"background:rgba(249,115,22,.1);color:#F97316",catStyle:pill("rgba(249,115,22,.1)","#F97316"),unread:true},
      {id:4,icon:"Package",title:t("Low Stock Alert"),body:t("Brake Pads (Front)")+" — 18/25 "+t("In Stock"),time:"3 "+t("hours ago"),cat:"alerts",catLabel:t("Alerts"),iconBg:"background:rgba(249,115,22,.1);color:#F97316",catStyle:pill("rgba(249,115,22,.1)","#F97316"),unread:true},
      {id:5,icon:"CreditCard",title:t("Payment Received"),body:"INV-2026-0140 — Omar Al-Ghamdi · SAR 620",time:t("yesterday"),cat:"finance",catLabel:t("Finance"),iconBg:"background:rgba(10,94,215,.1);color:var(--salis-blue)",catStyle:pill("rgba(10,94,215,.1)","#0A5ED7"),unread:false},
      {id:6,icon:"FileCheck",title:t("Estimate Approved"),body:"EST-0230 — Mohammed Hassan · SAR 3,600",time:t("yesterday"),cat:"jobs",catLabel:t("Job Cards"),iconBg:"background:rgba(10,94,215,.1);color:var(--salis-blue)",catStyle:pill("rgba(10,94,215,.1)","#0A5ED7"),unread:false},
      {id:7,icon:"ShieldCheck",title:t("QC Passed"),body:"JC-C2A9F4E3 — Omar Al-Ghamdi · Hyundai Sonata 2023",time:"2 "+t("days ago"),cat:"jobs",catLabel:t("Job Cards"),iconBg:"background:rgba(10,94,215,.1);color:var(--salis-blue)",catStyle:pill("rgba(10,94,215,.1)","#0A5ED7"),unread:false},
      {id:8,icon:"Car",title:t("Vehicle Ready"),body:"JC-A3F8B2C1 — Ahmed Al-Rashid · Toyota Camry 2022",time:"2 "+t("days ago"),cat:"jobs",catLabel:t("Job Cards"),iconBg:"background:rgba(11,179,255,.1);color:#0BB3FF",catStyle:pill("rgba(11,179,255,.1)","#0BB3FF"),unread:false}
    ];
    let filtered=allNotifs;
    if(f==="unread")filtered=allNotifs.filter(n=>n.unread&&!R[n.id]);
    if(f==="alerts")filtered=allNotifs.filter(n=>n.cat==="alerts");
    const notifications=filtered.map(n=>{const isUnread=n.unread&&!R[n.id];return{...n,unread:isUnread,
      bgStyle:isUnread?"background:rgba(10,94,215,.03)":"",category:n.catLabel,
      markRead:()=>this.setState(s=>({readSet:{...s.readSet,[n.id]:true}}))};});
    const unreadCount=allNotifs.filter(n=>n.unread&&!R[n.id]).length;
    return {rootClass:dark?"dark":"",dir:rtl?"rtl":"ltr",themeIcon:dark?"Sun":"Moon",langLabel:rtl?"English":"عربي",
      toggleTheme:()=>{localStorage.setItem("salis-theme",dark?"light":"dark");this.setState({dark:!dark});},
      toggleLang:()=>{const l=rtl?"en":"ar";localStorage.setItem("salis-lang",l);this.setState({lang:l});},
      navGroups,filterTabs,notifications,unreadCount:String(unreadCount),
      markAllRead:()=>{const rs={};allNotifs.forEach(n=>rs[n.id]=true);this.setState({readSet:rs});},
      t:{admin:t("ADMIN"),logout:t("Logout"),notifCenter:t("Notification Center"),unread:t("Unread"),markAllRead:t("Mark All Read")}};
  }
}
</script>
</body>
</html>
