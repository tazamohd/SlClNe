<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script src="./support.js"></script></head><body><x-dc>
<helmet><link rel="stylesheet" href="_ds/salis-auto-design-system-f22df384-eb3b-4838-99e5-e987504e70f0/styles.css"><script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script><script src="salis-icon.js"></script>
<style>body{margin:0;background:#F8FAFC}a{color:#0A5ED7;text-decoration:none}a:hover{color:#0952C0}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:-460px 0}100%{background-position:460px 0}}
@keyframes indeterminate{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
@keyframes pulseSoft{0%,100%{opacity:1}50%{opacity:.55}}
.sk{background:linear-gradient(90deg,var(--surface-inset) 0%,rgba(10,94,215,.07) 50%,var(--surface-inset) 100%);background-size:460px 100%;animation:shimmer 1.4s linear infinite;border-radius:6px}
</style></helmet>
<div class="{{ rootClass }}" dir="{{ dir }}" data-screen-label="Loading States" style="min-height:100vh;background:var(--bg-page);font-family:var(--font-ui,'Inter',sans-serif)">
<div style="height:56px;background:var(--surface-sidebar);border-bottom:1px solid var(--border-default);padding:0 24px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm)"><div style="display:flex;align-items:center;gap:8px"><div style="width:28px;height:28px;border-radius:8px;background:var(--salis-gradient);display:flex;align-items:center;justify-content:center"><salis-icon name="Car" size="14" style="color:#fff"></salis-icon></div><span style="font-size:14px;font-weight:700;color:var(--text-heading)">SALIS AUTO</span></div><span style="font-size:13px;color:var(--text-muted)">·</span><span style="font-size:13px;font-weight:600;color:var(--text-body)">{{ t.title }}</span><div style="flex:1"></div><button onClick="{{ toggleLang }}" style="height:32px;padding:0 10px;border-radius:8px;border:none;background:none;cursor:pointer;color:var(--text-muted);display:flex;align-items:center;gap:6px;font-family:var(--font-action);font-size:12px;font-weight:500"><salis-icon name="Globe" size="14"></salis-icon>{{ langLabel }}</button><button onClick="{{ toggleTheme }}" style="width:32px;height:32px;border-radius:8px;border:none;background:none;cursor:pointer;color:var(--text-muted);display:flex;align-items:center;justify-content:center"><salis-icon name="{{ themeIcon }}" size="16"></salis-icon></button></div>
<div style="padding:24px;display:flex;flex-direction:column;gap:24px;animation:fadeUp .3s ease">
<h2 style="margin:0;font-size:24px;font-family:var(--font-display);font-weight:900;color:var(--text-heading)">{{ t.title }}</h2>
<p style="margin:-14px 0 0;font-size:14px;color:var(--text-muted);max-width:640px;text-wrap:pretty">{{ t.sub }}</p>
<div style="padding:12px 16px;border-radius:11px;background:rgba(10,94,215,.05);border:1px solid rgba(10,94,215,.2);display:flex;align-items:center;gap:9px"><salis-icon name="Info" size="15" style="color:var(--salis-blue);flex-shrink:0"></salis-icon><span style="font-size:13px;color:var(--text-body)">{{ t.rule }}</span></div>
<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:24px">
  <div style="background:var(--surface-card);border-radius:16px;border:1px solid var(--border-default);box-shadow:var(--shadow-sm);overflow:hidden">
    <div style="padding:12px 18px;border-bottom:1px solid var(--border-default)"><h3 style="margin:0;font-size:15px;font-weight:700;color:var(--text-heading)">{{ t.pageLoad }}</h3></div>
    <div style="height:3px;background:rgba(10,94,215,.1);overflow:hidden"><div style="height:100%;width:34%;background:var(--salis-gradient);animation:indeterminate 1.5s ease-in-out infinite"></div></div>
    <div style="padding:18px;display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;align-items:center;gap:12px"><div class="sk" style="width:44px;height:44px;border-radius:12px"></div><div style="flex:1;display:flex;flex-direction:column;gap:7px"><div class="sk" style="width:46%;height:13px"></div><div class="sk" style="width:28%;height:11px"></div></div></div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px"><sc-for list="{{ four }}" as="n" hint-placeholder-count="4"><div style="padding:13px;border-radius:11px;border:1px solid var(--border-default);display:flex;flex-direction:column;gap:8px"><div class="sk" style="width:62%;height:10px"></div><div class="sk" style="width:44%;height:20px"></div></div></sc-for></div>
      <div class="sk" style="width:100%;height:132px;border-radius:11px"></div>
    </div>
  </div>
  <div style="background:var(--surface-card);border-radius:16px;border:1px solid var(--border-default);box-shadow:var(--shadow-sm);overflow:hidden">
    <div style="padding:12px 18px;border-bottom:1px solid var(--border-default)"><h3 style="margin:0;font-size:15px;font-weight:700;color:var(--text-heading)">{{ t.tableLoad }}</h3></div>
    <div style="padding:0">
      <div style="display:flex;gap:16px;padding:12px 18px;border-bottom:1px solid var(--border-default)"><sc-for list="{{ five }}" as="n" hint-placeholder-count="5"><div class="sk" style="flex:1;height:10px"></div></sc-for></div>
      <sc-for list="{{ six }}" as="n" hint-placeholder-count="6"><div style="display:flex;gap:16px;padding:14px 18px;border-bottom:1px solid var(--border-default)"><div class="sk" style="flex:1;height:12px"></div><div class="sk" style="flex:1;height:12px"></div><div class="sk" style="flex:1;height:12px"></div><div class="sk" style="flex:1;height:12px"></div><div class="sk" style="flex:1;height:12px"></div></div></sc-for>
    </div>
  </div>
</div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px">
  <div style="background:var(--surface-card);border-radius:16px;padding:20px;border:1px solid var(--border-default);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:16px">
    <h3 style="margin:0;font-size:15px;font-weight:700;color:var(--text-heading)">{{ t.determinate }}</h3>
    <sc-for list="{{ bars }}" as="b" hint-placeholder-count="3"><div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px"><span style="color:var(--text-body)">{{ b.label }}</span><span style="font-family:var(--font-mono);font-weight:600;color:var(--salis-blue)">{{ b.pct }}%</span></div><div style="height:7px;background:rgba(10,94,215,.09);border-radius:9999px;overflow:hidden"><div style="height:100%;width:{{ b.pct }}%;background:var(--salis-gradient);border-radius:9999px"></div></div></div></sc-for>
  </div>
  <div style="background:var(--surface-card);border-radius:16px;padding:20px;border:1px solid var(--border-default);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:14px">
    <h3 style="margin:0;font-size:15px;font-weight:700;color:var(--text-heading)">{{ t.inlineBusy }}</h3>
    <button style="display:flex;align-items:center;justify-content:center;gap:9px;height:42px;border:none;border-radius:9px;background:var(--salis-gradient);color:#fff;font-family:var(--font-action);font-size:13px;font-weight:600;opacity:.75;cursor:progress"><span style="width:15px;height:15px;border-radius:3px;background:rgba(255,255,255,.35);animation:pulseSoft 1.2s ease-in-out infinite"></span>{{ t.saving }}</button>
    <div style="display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px;background:var(--surface-inset);border:1px solid var(--border-default)"><span style="width:22px;height:22px;border-radius:6px;background:rgba(10,94,215,.14);animation:pulseSoft 1.2s ease-in-out infinite;flex-shrink:0"></span><div style="flex:1;display:flex;flex-direction:column;gap:5px"><div class="sk" style="width:58%;height:10px"></div><div class="sk" style="width:34%;height:9px"></div></div></div>
    <div style="height:3px;background:rgba(10,94,215,.1);border-radius:9999px;overflow:hidden"><div style="height:100%;width:30%;background:var(--salis-gradient);animation:indeterminate 1.5s ease-in-out infinite"></div></div>
  </div>
  <div style="background:var(--surface-card);border-radius:16px;padding:20px;border:1px solid var(--border-default);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:14px">
    <h3 style="margin:0;font-size:15px;font-weight:700;color:var(--text-heading)">{{ t.cardLoad }}</h3>
    <sc-for list="{{ three }}" as="n" hint-placeholder-count="3"><div style="padding:13px;border-radius:11px;border:1px solid var(--border-default);display:flex;align-items:center;gap:11px"><div class="sk" style="width:32px;height:32px;border-radius:50%"></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div class="sk" style="width:54%;height:11px"></div><div class="sk" style="width:32%;height:9px"></div></div><div class="sk" style="width:52px;height:11px"></div></div></sc-for>
  </div>
</div>
</div></div></x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","tsType":"string","section":"Variant"},"lang":{"editor":"enum","options":["en","ar"],"default":"en","tsType":"string","section":"Variant"}}'>
class Component extends DCLogic{state={dark:null,lang:null,data:null};componentDidMount(){import("./gms-data.js").then(m=>this.setState({data:m}));}renderVals(){
const dark=this.state.dark??((localStorage.getItem("salis-theme")??this.props.theme)==="dark");
const lang=this.state.lang??(localStorage.getItem("salis-lang")??this.props.lang??"en");
const rtl=lang==="ar",D=this.state.data;const t=s=>rtl&&D?(D.AR[s]||s):s;
const ic=(bg,fg)=>"padding:6px;border-radius:8px;background:"+bg+";color:"+fg+";display:flex";
const pill=(bg,fg)=>"display:inline-flex;align-items:center;border-radius:9999px;padding:2px 10px;font-size:11px;font-weight:500;background:"+bg+";color:"+fg;
const n=k=>Array.from({length:k},(_,i)=>String(i));
const bars=[{label:t("Importing customers"),pct:"72"},{label:t("Syncing ZATCA invoices"),pct:"45"},{label:t("Generating report"),pct:"88"}];
const extra={three:n(3),four:n(4),five:n(5),six:n(6),bars,
 t:{title:t("Loading States"),sub:t("Skeletons mirror the shape of the content they replace, so layout never jumps when data lands. Progress is linear and determinate wherever the percentage is known."),
 rule:t("Brand rule: loading is always a linear bar or a pulse skeleton — never a spinner."),
 pageLoad:t("Page load"),tableLoad:t("Table load"),determinate:t("Determinate progress"),inlineBusy:t("Inline busy states"),cardLoad:t("List load"),saving:t("Saving…")}};
return{rootClass:dark?"dark":"",dir:rtl?"rtl":"ltr",themeIcon:dark?"Sun":"Moon",langLabel:rtl?"English":"عربي",
 toggleTheme:()=>{localStorage.setItem("salis-theme",dark?"light":"dark");this.setState({dark:!dark})},
 toggleLang:()=>{const l=rtl?"en":"ar";localStorage.setItem("salis-lang",l);this.setState({lang:l})},...extra};}}</script></body></html>
