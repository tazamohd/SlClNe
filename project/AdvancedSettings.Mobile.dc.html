<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/salis-auto-design-system-f22df384-eb3b-4838-99e5-e987504e70f0/styles.css">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="salis-icon.js"></script>
<style>body{margin:0;background:#F8FAFC}a{color:#0A5ED7;text-decoration:none}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}</style>
</helmet>
<div class="{{ rootClass }}" dir="{{ dir }}" data-screen-label="Settings-Mobile" style="min-height:100vh;display:flex;flex-direction:column;background:var(--bg-page);font-family:var(--font-ui,'Inter',sans-serif)">
  <div style="padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border-default);background:var(--surface-sidebar)">
    <a href="Settings.Mobile.dc.html" style="display:flex;color:var(--text-muted)"><salis-icon name="{{ backChev }}" size="20"></salis-icon></a>
    <div style="flex:1"><h1 style="margin:0;font-size:17px;font-family:var(--font-display);font-weight:800;color:var(--text-heading)">{{ t.settings }}</h1></div>
    <button onClick="{{ toggleTheme }}" style="width:32px;height:32px;border-radius:8px;border:none;background:none;cursor:pointer;color:var(--text-muted);display:flex;align-items:center;justify-content:center"><salis-icon name="{{ themeIcon }}" size="16"></salis-icon></button>
  </div>
  <div style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;animation:fadeUp .3s ease;-webkit-overflow-scrolling:touch">
    <sc-for list="{{ sections }}" as="sec" hint-placeholder-count="5">
      <div style="background:var(--surface-card);border:1px solid var(--border-default);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;align-items:center;gap:8px"><span style="padding:6px;border-radius:8px;background:rgba(10,94,215,.1);color:var(--salis-blue);display:flex"><salis-icon name="{{ sec.icon }}" size="14"></salis-icon></span><h3 style="margin:0;font-size:13px;font-weight:700;color:var(--text-heading)">{{ sec.title }}</h3></div>
        <sc-for list="{{ sec.items }}" as="si" hint-placeholder-count="3">
          <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-default)">
            <div style="flex:1;min-width:0"><p style="margin:0;font-size:13px;font-weight:500;color:var(--text-body)">{{ si.label }}</p><p style="margin:1px 0 0;font-size:11px;color:var(--text-muted)">{{ si.desc }}</p></div>
            <sc-if value="{{ si.hasToggle }}" hint-placeholder-val="{{ false }}">
              <button onClick="{{ si.toggle }}" style="width:44px;height:24px;border-radius:12px;border:none;cursor:pointer;position:relative;transition:background .2s ease;flex-shrink:0;{{ si.toggleBg }}"><span style="position:absolute;top:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:inset-inline-start .2s ease;{{ si.togglePos }}"></span></button>
            </sc-if>
            <sc-if value="{{ si.hasValue }}" hint-placeholder-val="{{ false }}">
              <span style="font-size:12px;font-weight:500;color:var(--text-heading);padding:4px 10px;border-radius:6px;background:var(--surface-inset);border:1px solid var(--border-default);flex-shrink:0">{{ si.value }}</span>
            </sc-if>
            <sc-if value="{{ si.hasBadge }}" hint-placeholder-val="{{ false }}">
              <span style="{{ si.badgeStyle }};flex-shrink:0">{{ si.badge }}</span>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </sc-for>
    <button style="width:100%;height:50px;border:none;border-radius:8px;background:var(--salis-gradient);color:#fff;font-family:var(--font-action);font-weight:600;font-size:15px;cursor:pointer;box-shadow:0 4px 12px rgba(10,94,215,.25);display:flex;align-items:center;justify-content:center;gap:8px;flex-shrink:0"><salis-icon name="Save" size="16"></salis-icon>{{ t.saveChanges }}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;ar&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;}}">
class Component extends DCLogic {
  state={dark:null,lang:null,AR:{},toggles:{twoFa:true,emailNotif:true,smsAlert:false,autoBackup:true,auditLog:true}};
  componentDidMount(){import("./gms-data.js").then(m=>this.setState({AR:m.AR}));}
  renderVals(){
    const dark=this.state.dark??((localStorage.getItem("salis-theme")??this.props.theme)==="dark");
    const lang=this.state.lang??(localStorage.getItem("salis-lang")??this.props.lang??"en");
    const rtl=lang==="ar",AR=this.state.AR,t=s=>rtl?(AR[s]||s):s;
    const T=this.state.toggles;
    const tog=(key)=>({hasToggle:true,hasValue:false,hasBadge:false,toggle:()=>this.setState(s=>({toggles:{...s.toggles,[key]:!T[key]}})),
      toggleBg:T[key]?"background:var(--salis-gradient)":"background:var(--border-strong)",togglePos:T[key]?"inset-inline-start:22px":"inset-inline-start:2px"});
    const val=(v)=>({hasToggle:false,hasValue:true,hasBadge:false,value:v});
    const badge=(b,bg,fg)=>({hasToggle:false,hasValue:false,hasBadge:true,badge:b,badgeStyle:"font-size:10px;font-weight:600;padding:3px 8px;border-radius:6px;background:"+bg+";color:"+fg});
    const sections=[
      {icon:"Building2",title:t("Workshop Information"),items:[
        {label:t("Workshop Name"),desc:"Al-Amri Auto Center",...val("Al-Amri")},
        {label:t("VAT Rate"),desc:t("Tax Settings"),...val("15%")},
        {label:t("Business Hours"),desc:rtl?"السبت-الخميس":"Sat–Thu",...val("8–18")}]},
      {icon:"Shield",title:t("Security Settings"),items:[
        {label:t("Two-Factor Authentication"),desc:rtl?"أمان إضافي":"Extra security",...tog("twoFa")},
        {label:t("Session Timeout"),desc:rtl?"انتهاء تلقائي":"Auto-expire",...val("30 min")},
        {label:t("Audit Log"),desc:rtl?"تتبع الإجراءات":"Track actions",...tog("auditLog")}]},
      {icon:"Bell",title:t("Notifications Preferences"),items:[
        {label:t("Email Notifications"),desc:rtl?"إشعارات البريد":"Email alerts",...tog("emailNotif")},
        {label:t("SMS Alerts"),desc:rtl?"رسائل نصية":"SMS alerts",...tog("smsAlert")}]},
      {icon:"Plug",title:t("Integrations"),items:[
        {label:"ZATCA",desc:rtl?"فوترة إلكترونية":"E-invoicing",...badge(t("Connected"),"rgba(10,94,215,.1)","#0A5ED7")},
        {label:"WhatsApp",desc:rtl?"إشعارات":"Notifications",...badge(t("Connected"),"rgba(10,94,215,.1)","#0A5ED7")},
        {label:rtl?"محاسبة":"Accounting",desc:rtl?"تصدير مالي":"Export",...badge(t("Disconnected"),"rgba(249,115,22,.1)","#F97316")}]},
      {icon:"Database",title:t("Data Management"),items:[
        {label:t("Auto Backup"),desc:rtl?"نسخ يومي":"Daily backup",...tog("autoBackup")},
        {label:t("Retention Period"),desc:rtl?"احتفاظ":"Data retention",...val(t("1 year"))}]}
    ];
    return{rootClass:dark?"dark":"",dir:rtl?"rtl":"ltr",themeIcon:dark?"Sun":"Moon",backChev:rtl?"ChevronRight":"ChevronLeft",
      toggleTheme:()=>{localStorage.setItem("salis-theme",dark?"light":"dark");this.setState({dark:!dark});},
      sections,t:{settings:t("Settings"),saveChanges:t("Save Changes")}};
  }
}
</script>
</body>
</html>
