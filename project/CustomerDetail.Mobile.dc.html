<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/salis-auto-design-system-f22df384-eb3b-4838-99e5-e987504e70f0/styles.css">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="salis-icon.js"></script>
<style>body{margin:0;background:#F8FAFC}a{color:#0A5ED7;text-decoration:none}a:hover{color:#0952C0}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}</style>
</helmet>
<div class="{{ rootClass }}" dir="{{ dir }}" data-screen-label="Customer-Detail-Mobile" style="position:relative;height:100vh;overflow:hidden;background:var(--bg-page);font-family:var(--font-ui,'Inter',sans-serif)">
  <header style="height:56px;flex-shrink:0;background:var(--surface-sidebar);border-bottom:1px solid var(--border-default);padding:0 12px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-sm)">
    <a href="Customers.Mobile.dc.html" aria-label="Back" style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;color:var(--text-primary)"><salis-icon name="{{ backChev }}" size="20"></salis-icon></a>
    <p style="margin:0;flex:1;font-size:15px;font-weight:700;color:var(--text-heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ cust.name }}</p>
    <button onClick="{{ toggleTheme }}" aria-label="Toggle theme" style="display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:none;background:none;cursor:pointer;color:var(--text-muted)"><salis-icon name="{{ themeIcon }}" size="16"></salis-icon></button>
  </header>
  <main style="height:calc(100vh - 56px);overflow-y:auto">
    <div style="padding:16px;display:flex;flex-direction:column;gap:14px;animation:fadeUp .3s ease">
      <div style="background:var(--surface-card);border-radius:16px;padding:18px;border:1px solid var(--border-default);display:flex;align-items:center;gap:12px">
        <span style="width:48px;height:48px;border-radius:50%;background:var(--salis-gradient);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;flex-shrink:0">{{ cust.initial }}</span>
        <div><p style="margin:0;font-size:14px;font-weight:700;color:var(--text-heading)">{{ cust.name }}</p><p style="margin:2px 0 0;font-size:12px;color:var(--text-muted)" dir="ltr">{{ cust.phone }}</p></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
        <div style="background:var(--surface-card);border-radius:12px;padding:12px;border:1px solid var(--border-default);text-align:center"><p style="margin:0;font-size:10px;color:var(--text-muted)">{{ t.vehiclesCount }}</p><h3 style="margin:6px 0 0;font-size:16px;font-family:var(--font-display);font-weight:900;color:var(--text-heading)">{{ cust.vehicles }}</h3></div>
        <div style="background:var(--surface-card);border-radius:12px;padding:12px;border:1px solid var(--border-default);text-align:center"><p style="margin:0;font-size:10px;color:var(--text-muted)">{{ t.totalSpent }}</p><h3 style="margin:6px 0 0;font-size:13px;font-family:var(--font-display);font-weight:900;color:var(--salis-blue)" dir="ltr">{{ cust.spent }}</h3></div>
        <div style="background:var(--surface-card);border-radius:12px;padding:12px;border:1px solid var(--border-default);text-align:center"><p style="margin:0;font-size:10px;color:var(--text-muted)">{{ t.lastVisit }}</p><h3 style="margin:6px 0 0;font-size:12px;font-family:var(--font-display);font-weight:800;color:var(--text-heading)">{{ cust.last }}</h3></div>
      </div>
      <div style="background:var(--surface-card);border-radius:16px;padding:16px;border:1px solid var(--border-default)">
        <h3 style="margin:0 0 12px;font-size:14px;font-weight:700;color:var(--text-heading)">{{ t.vehicles }}</h3>
        <div style="display:flex;flex-direction:column;gap:8px">
          <sc-for list="{{ vehicles }}" as="v" hint-placeholder-count="2">
            <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-default)">
              <div><span style="font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--text-heading)" dir="ltr">{{ v.plate }}</span><span style="margin-inline-start:8px;font-size:12px;color:var(--text-body)">{{ v.make }}</span></div>
              <span style="{{ v.stStyle }}">{{ v.status }}</span>
            </div>
          </sc-for>
        </div>
      </div>
    </div>
  </main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;ar&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;}}">
class Component extends DCLogic {
  state={dark:null,lang:null,data:null};
  componentDidMount(){import("./gms-data.js").then(m=>this.setState({data:m}));}
  renderVals(){
    const dark=this.state.dark??((localStorage.getItem("salis-theme")??this.props.theme)==="dark");
    const lang=this.state.lang??(localStorage.getItem("salis-lang")??this.props.lang??"en");
    const rtl=lang==="ar",D=this.state.data;
    const t=s=>rtl&&D?(D.AR[s]||s):s;
    const params=new URLSearchParams(location.search);
    const id=params.get("id");
    const list=D?D.CUSTOMERS:[];
    const c=list.find(x=>x.name===id)||list[0]||{name:"Ahmed Al-Rashid",phone:"+966 55 210 4471",vehicles:2,spent:"SAR 12,840",last:"2 weeks ago"};
    const pill=(bg,fg)=>"display:inline-flex;align-items:center;border-radius:9999px;padding:2px 8px;font-size:11px;font-weight:500;background:"+bg+";color:"+fg;
    const vehicles=(D?D.VEHICLES:[]).filter(v=>v.owner===c.name).map(v=>({plate:v.plate,make:v.make,
      status:v.status==="service"?t("In Service"):t("Active"),
      stStyle:v.status==="service"?pill("rgba(249,115,22,.1)","#F97316"):pill("rgba(10,94,215,.1)","#0A5ED7")}));
    return {
      rootClass:dark?"dark":"",dir:rtl?"rtl":"ltr",backChev:rtl?"ArrowRight":"ArrowLeft",
      themeIcon:dark?"Sun":"Moon",
      toggleTheme:()=>{localStorage.setItem("salis-theme",dark?"light":"dark");this.setState({dark:!dark});},
      cust:{name:c.name,initial:c.name[0],phone:c.phone,vehicles:c.vehicles,spent:c.spent,last:c.last==="In Service"?t("In Service"):c.last},
      vehicles,
      t:{vehiclesCount:t("Vehicles Count"),totalSpent:t("Total Spent"),lastVisit:t("Last Visit"),vehicles:t("Vehicles")}
    };
  }
}

</script>
</body>
</html>
