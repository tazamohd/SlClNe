<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/salis-auto-design-system-f22df384-eb3b-4838-99e5-e987504e70f0/styles.css">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="salis-icon.js"></script>
<style>body{margin:0;background:#F8FAFC}a{color:#0A5ED7;text-decoration:none}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}</style>
</helmet>
<div class="{{ rootClass }}" dir="{{ dir }}" data-screen-label="Notifications-Mobile" style="min-height:100vh;display:flex;flex-direction:column;background:var(--bg-page);font-family:var(--font-ui,'Inter',sans-serif)">
  <div style="padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border-default);background:var(--surface-sidebar)">
    <a href="Dashboard.Mobile.dc.html" style="display:flex;color:var(--text-muted)"><salis-icon name="{{ backChev }}" size="20"></salis-icon></a>
    <div style="flex:1"><h1 style="margin:0;font-size:17px;font-family:var(--font-display);font-weight:800;color:var(--text-heading)">{{ t.notifCenter }}</h1></div>
    <button onClick="{{ markAllRead }}" style="height:30px;padding:0 10px;border-radius:6px;border:1px solid var(--border-default);background:var(--surface-card);cursor:pointer;font-family:var(--font-action);font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:4px"><salis-icon name="CheckCheck" size="12"></salis-icon>{{ t.markAll }}</button>
    <button onClick="{{ toggleTheme }}" style="width:32px;height:32px;border-radius:8px;border:none;background:none;cursor:pointer;color:var(--text-muted);display:flex;align-items:center;justify-content:center"><salis-icon name="{{ themeIcon }}" size="16"></salis-icon></button>
  </div>
  <!-- Filter -->
  <div style="padding:10px 16px;border-bottom:1px solid var(--border-default);display:flex;gap:6px;overflow-x:auto;background:var(--surface-card)">
    <sc-for list="{{ filterTabs }}" as="ft" hint-placeholder-count="3">
      <button onClick="{{ ft.select }}" style="height:32px;padding:0 14px;border-radius:8px;border:none;cursor:pointer;font-family:var(--font-action);font-size:12px;font-weight:600;white-space:nowrap;flex-shrink:0;{{ ft.style }}">{{ ft.label }}</button>
    </sc-for>
  </div>
  <div style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:0;animation:fadeUp .3s ease;-webkit-overflow-scrolling:touch">
    <sc-for list="{{ notifications }}" as="n" hint-placeholder-count="8">
      <div onClick="{{ n.markRead }}" style="display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border-default);cursor:pointer;{{ n.bgStyle }}">
        <span style="padding:8px;border-radius:10px;display:flex;flex-shrink:0;{{ n.iconBg }}"><salis-icon name="{{ n.icon }}" size="16"></salis-icon></span>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:6px"><p style="margin:0;font-size:13px;font-weight:600;color:var(--text-heading);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ n.title }}</p><sc-if value="{{ n.unread }}" hint-placeholder-val="{{ false }}"><span style="width:7px;height:7px;border-radius:50%;background:var(--salis-blue);flex-shrink:0"></span></sc-if></div>
          <p style="margin:3px 0 0;font-size:12px;color:var(--text-body);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">{{ n.body }}</p>
          <div style="display:flex;align-items:center;gap:6px;margin-top:5px"><span style="font-size:10px;color:var(--text-muted)">{{ n.time }}</span><span style="{{ n.catStyle }}">{{ n.category }}</span></div>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;ar&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;}}">
class Component extends DCLogic {
  state={dark:null,lang:null,AR:{},filter:"all",readSet:{}};
  componentDidMount(){import("./gms-data.js").then(m=>this.setState({AR:m.AR}));}
  renderVals(){
    const dark=this.state.dark??((localStorage.getItem("salis-theme")??this.props.theme)==="dark");
    const lang=this.state.lang??(localStorage.getItem("salis-lang")??this.props.lang??"en");
    const rtl=lang==="ar",AR=this.state.AR,t=s=>rtl?(AR[s]||s):s;
    const f=this.state.filter;
    const filterTabs=[["all",t("All Notifications")],["unread",t("Unread")],["alerts",t("Alerts")]].map(([id,label])=>({label,select:()=>this.setState({filter:id}),
      style:f===id?"background:var(--salis-gradient);color:#fff":"background:var(--surface-inset);color:var(--text-body)"}));
    const pill=(bg,fg)=>"font-size:9px;font-weight:600;padding:2px 6px;border-radius:9999px;background:"+bg+";color:"+fg;
    const R=this.state.readSet;
    const allNotifs=[
      {id:1,icon:"Wrench",title:t("New Job Card Created"),body:"JC-E5D7A3B5 — Sara Al-Mutairi · Ford Explorer",time:t("just now"),cat:"jobs",catLabel:t("Job Cards"),iconBg:"background:rgba(10,94,215,.1);color:var(--salis-blue)",catStyle:pill("rgba(10,94,215,.1)","#0A5ED7"),unread:true},
      {id:2,icon:"Calendar",title:t("Appointment Confirmed"),body:"Ahmed Al-Rashid — "+t("Maintenance")+" · Jul 23",time:"5 "+t("minutes ago"),cat:"appointments",catLabel:t("Appointments"),iconBg:"background:rgba(11,179,255,.1);color:#0BB3FF",catStyle:pill("rgba(11,179,255,.1)","#0BB3FF"),unread:true},
      {id:3,icon:"AlertTriangle",title:t("Invoice Overdue"),body:"INV-2026-0141 — Fatima Al-Zahrani · SAR 4,250",time:"2 "+t("hours ago"),cat:"alerts",catLabel:t("Alerts"),iconBg:"background:rgba(249,115,22,.1);color:#F97316",catStyle:pill("rgba(249,115,22,.1)","#F97316"),unread:true},
      {id:4,icon:"Package",title:t("Low Stock Alert"),body:t("Brake Pads (Front)")+" — 18/25",time:"3 "+t("hours ago"),cat:"alerts",catLabel:t("Alerts"),iconBg:"background:rgba(249,115,22,.1);color:#F97316",catStyle:pill("rgba(249,115,22,.1)","#F97316"),unread:true},
      {id:5,icon:"CreditCard",title:t("Payment Received"),body:"INV-2026-0140 — Omar Al-Ghamdi · SAR 620",time:t("yesterday"),cat:"finance",catLabel:t("Finance"),iconBg:"background:rgba(10,94,215,.1);color:var(--salis-blue)",catStyle:pill("rgba(10,94,215,.1)","#0A5ED7"),unread:false},
      {id:6,icon:"FileCheck",title:t("Estimate Approved"),body:"EST-0230 — Mohammed Hassan · SAR 3,600",time:t("yesterday"),cat:"jobs",catLabel:t("Job Cards"),iconBg:"background:rgba(10,94,215,.1);color:var(--salis-blue)",catStyle:pill("rgba(10,94,215,.1)","#0A5ED7"),unread:false},
      {id:7,icon:"ShieldCheck",title:t("QC Passed"),body:"JC-C2A9F4E3 — Omar Al-Ghamdi",time:"2 "+t("days ago"),cat:"jobs",catLabel:t("Job Cards"),iconBg:"background:rgba(10,94,215,.1);color:var(--salis-blue)",catStyle:pill("rgba(10,94,215,.1)","#0A5ED7"),unread:false},
      {id:8,icon:"Car",title:t("Vehicle Ready"),body:"JC-A3F8B2C1 — Ahmed Al-Rashid",time:"2 "+t("days ago"),cat:"jobs",catLabel:t("Job Cards"),iconBg:"background:rgba(11,179,255,.1);color:#0BB3FF",catStyle:pill("rgba(11,179,255,.1)","#0BB3FF"),unread:false}
    ];
    let filtered=allNotifs;
    if(f==="unread")filtered=allNotifs.filter(n=>n.unread&&!R[n.id]);
    if(f==="alerts")filtered=allNotifs.filter(n=>n.cat==="alerts");
    const notifications=filtered.map(n=>{const isUnread=n.unread&&!R[n.id];return{...n,unread:isUnread,bgStyle:isUnread?"background:rgba(10,94,215,.03)":"",category:n.catLabel,
      markRead:()=>this.setState(s=>({readSet:{...s.readSet,[n.id]:true}}))};});
    return{rootClass:dark?"dark":"",dir:rtl?"rtl":"ltr",themeIcon:dark?"Sun":"Moon",backChev:rtl?"ChevronRight":"ChevronLeft",
      toggleTheme:()=>{localStorage.setItem("salis-theme",dark?"light":"dark");this.setState({dark:!dark});},
      toggleLang:()=>{const l=rtl?"en":"ar";localStorage.setItem("salis-lang",l);this.setState({lang:l});},
      filterTabs,notifications,
      markAllRead:()=>{const rs={};allNotifs.forEach(n=>rs[n.id]=true);this.setState({readSet:rs});},
      t:{notifCenter:t("Notification Center"),markAll:t("Mark All Read")}};
  }
}
</script>
</body>
</html>
