<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/salis-auto-design-system-f22df384-eb3b-4838-99e5-e987504e70f0/styles.css">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="salis-icon.js"></script>
<style>body{margin:0;background:#F8FAFC}a{color:#0A5ED7;text-decoration:none}a:hover{color:#0952C0}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}</style>
</helmet>
<div class="{{ rootClass }}" dir="{{ dir }}" data-screen-label="Advanced-Settings" style="display:flex;height:100vh;overflow:hidden;background:var(--bg-page);font-family:var(--font-ui,'Inter',sans-serif)">
  <aside style="width:280px;flex-shrink:0;background:var(--surface-sidebar);border-inline-end:1px solid var(--border-default);display:flex;flex-direction:column;height:100vh">
    <div style="padding:12px 12px 4px"><div style="display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;background:var(--surface-inset);border:1px solid var(--border-default)"><span style="width:28px;height:28px;border-radius:50%;background:var(--salis-gradient);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0">K</span><div style="flex:1;min-width:0"><p style="margin:0;font-size:12px;font-weight:600;color:var(--text-primary)">Khalid Al-Amri</p><div style="display:flex;align-items:center;gap:6px"><span style="font-size:10px;font-weight:600;padding:1px 6px;border-radius:9999px;background:rgba(10,94,215,.12);color:var(--salis-blue)">{{ t.admin }}</span><span style="font-size:10px;font-weight:600;padding:1px 6px;border-radius:9999px;background:var(--salis-gradient);color:#fff">PRO</span></div></div></div></div>
    <nav style="flex:1;padding:12px;overflow-y:auto"><div style="display:flex;flex-direction:column;gap:2px"><sc-for list="{{ navGroups }}" as="g" hint-placeholder-count="7"><div><button onClick="{{ g.toggle }}" style="width:100%;display:flex;align-items:center;gap:8px;padding:8px;border:none;background:none;border-radius:6px;cursor:pointer;font-family:var(--font-action);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-primary)" style-hover="background:rgba(10,94,215,.1)"><span>{{ g.label }}</span><span style="flex:1"></span><salis-icon name="{{ g.chev }}" size="12" style="color:var(--text-muted)"></salis-icon></button><sc-if value="{{ g.open }}" hint-placeholder-val="{{ true }}"><div style="display:flex;flex-direction:column;gap:2px;margin-top:2px"><sc-for list="{{ g.items }}" as="it" hint-placeholder-count="2"><a href="{{ it.href }}" style="{{ it.style }}"><salis-icon name="{{ it.icon }}" size="14"></salis-icon><span>{{ it.label }}</span></a></sc-for></div></sc-if></div></sc-for></div></nav>
    <div style="padding:12px;border-top:1px solid var(--border-default);display:flex;flex-direction:column;gap:8px"><button onClick="{{ toggleLang }}" style="display:flex;align-items:center;gap:8px;padding:6px 8px;border:none;background:none;border-radius:6px;cursor:pointer;font-family:var(--font-action);font-size:12px;font-weight:500;color:var(--text-muted)" style-hover="background:rgba(10,94,215,.08);color:var(--salis-blue)"><salis-icon name="Globe" size="14"></salis-icon><span>{{ langLabel }}</span></button><a href="Login.dc.html" style="display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-family:var(--font-action);font-size:12px;font-weight:500;color:var(--salis-orange);height:32px;box-sizing:border-box" style-hover="background:var(--salis-orange);color:#fff"><salis-icon name="LogOut" size="16"></salis-icon><span>{{ t.logout }}</span></a></div>
  </aside>
  <div style="flex:1;display:flex;flex-direction:column;min-width:0">
    <header style="height:56px;flex-shrink:0;background:var(--surface-sidebar);border-bottom:1px solid var(--border-default);padding:0 24px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm)"><div style="flex:1"></div><button onClick="{{ toggleTheme }}" style="display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:none;background:none;cursor:pointer;color:var(--text-muted)" style-hover="background:rgba(10,94,215,.1);color:var(--salis-blue)"><salis-icon name="{{ themeIcon }}" size="16"></salis-icon></button></header>
    <main style="flex:1;overflow:auto">
      <div style="padding:24px;display:flex;flex-direction:column;gap:24px;animation:fadeUp .3s ease;max-width:900px">
        <div style="display:flex;align-items:center;gap:12px"><div style="position:relative"><div style="position:absolute;inset:0;background:#0A5ED7;border-radius:16px;filter:blur(12px);opacity:.3"></div><div style="position:relative;padding:12px;border-radius:16px;background:var(--salis-gradient);box-shadow:0 20px 25px -5px rgba(10,94,215,.25);color:#fff;display:flex"><salis-icon name="Settings" size="28"></salis-icon></div></div><div><h1 style="margin:0;font-size:26px;font-family:var(--font-display);font-weight:900;color:var(--text-heading)">{{ t.advSettings }}</h1><p style="margin:2px 0 0;font-size:14px;color:var(--text-muted)">{{ t.configureSystem }}</p></div></div>
        <!-- Settings Sections -->
        <sc-for list="{{ sections }}" as="sec" hint-placeholder-count="5">
          <div style="background:var(--surface-card);border:1px solid var(--border-default);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px">
            <div style="display:flex;align-items:center;gap:10px"><span style="padding:8px;border-radius:10px;background:rgba(10,94,215,.1);color:var(--salis-blue);display:flex"><salis-icon name="{{ sec.icon }}" size="18"></salis-icon></span><h3 style="margin:0;font-size:15px;font-weight:700;color:var(--text-heading)">{{ sec.title }}</h3></div>
            <sc-for list="{{ sec.items }}" as="si" hint-placeholder-count="3">
              <div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border-default)">
                <div style="flex:1;min-width:0"><p style="margin:0;font-size:14px;font-weight:500;color:var(--text-body)">{{ si.label }}</p><p style="margin:2px 0 0;font-size:12px;color:var(--text-muted)">{{ si.desc }}</p></div>
                <sc-if value="{{ si.hasToggle }}" hint-placeholder-val="{{ false }}">
                  <button onClick="{{ si.toggle }}" style="width:44px;height:24px;border-radius:12px;border:none;cursor:pointer;position:relative;transition:background .2s ease;{{ si.toggleBg }}"><span style="position:absolute;top:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:inset-inline-start .2s ease;{{ si.togglePos }}"></span></button>
                </sc-if>
                <sc-if value="{{ si.hasValue }}" hint-placeholder-val="{{ false }}">
                  <span style="font-size:13px;font-weight:500;color:var(--text-heading);padding:6px 12px;border-radius:6px;background:var(--surface-inset);border:1px solid var(--border-default)">{{ si.value }}</span>
                </sc-if>
                <sc-if value="{{ si.hasBadge }}" hint-placeholder-val="{{ false }}">
                  <span style="{{ si.badgeStyle }}">{{ si.badge }}</span>
                </sc-if>
              </div>
            </sc-for>
          </div>
        </sc-for>
        <button style="width:100%;max-width:280px;height:44px;border:none;border-radius:8px;background:var(--salis-gradient);color:#fff;font-family:var(--font-action);font-weight:600;font-size:14px;cursor:pointer;box-shadow:0 4px 12px rgba(10,94,215,.25);display:flex;align-items:center;justify-content:center;gap:8px;align-self:flex-end"><salis-icon name="Save" size="16"></salis-icon>{{ t.saveChanges }}</button>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;ar&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;}}">
class Component extends DCLogic {
  state={dark:null,lang:null,AR:{},NAV:[],collapsed:{},toggles:{twoFa:true,emailNotif:true,smsAlert:false,autoBackup:true,auditLog:true}};
  componentDidMount(){import("./gms-data.js").then(m=>this.setState({AR:m.AR,NAV:(m.navFor?m.navFor(m.NAV):m.NAV)}));}
  renderVals(){
    const dark=this.state.dark??((localStorage.getItem("salis-theme")??this.props.theme)==="dark");
    const lang=this.state.lang??(localStorage.getItem("salis-lang")??this.props.lang??"en");
    const rtl=lang==="ar",AR=this.state.AR,t=s=>rtl?(AR[s]||s):s;
    const navItem=(icon,label,href,active)=>({icon,label:t(label),href,style:"display:flex;align-items:center;gap:8px;padding:8px 8px 8px 28px;border-radius:6px;font-family:var(--font-action);font-size:13px;font-weight:500;text-decoration:none;"+(active?"background:var(--salis-gradient);color:#fff":"color:var(--text-body)")});
    const navGroups=this.state.NAV.map(g=>{const o=!this.state.collapsed[g.label];return{label:t(g.label),chev:o?"ChevronDown":"ChevronRight",open:o,toggle:()=>this.setState(s=>({collapsed:{...s.collapsed,[g.label]:o}})),items:g.items.map(i=>navItem(g.icon,i.l,i.href,i.l==="Settings"))};});
    const T=this.state.toggles;
    const tog=(key)=>({hasToggle:true,hasValue:false,hasBadge:false,toggle:()=>this.setState(s=>({toggles:{...s.toggles,[key]:!T[key]}})),
      toggleBg:T[key]?"background:var(--salis-gradient)":"background:var(--border-strong)",togglePos:T[key]?"inset-inline-start:22px":"inset-inline-start:2px"});
    const val=(v)=>({hasToggle:false,hasValue:true,hasBadge:false,value:v});
    const badge=(b,bg,fg)=>({hasToggle:false,hasValue:false,hasBadge:true,badge:b,badgeStyle:"font-size:11px;font-weight:600;padding:4px 10px;border-radius:6px;background:"+bg+";color:"+fg});
    const sections=[
      {icon:"Building2",title:t("Workshop Information"),items:[
        {label:t("Workshop Name"),desc:"Al-Amri Auto Center",...val("Al-Amri Auto Center")},
        {label:t("VAT Rate"),desc:t("Tax Settings"),...val("15%")},
        {label:t("Business Hours"),desc:rtl?"السبت-الخميس":"Sat–Thu, 8 AM – 6 PM",...val("8–18")}]},
      {icon:"Shield",title:t("Security Settings"),items:[
        {label:t("Two-Factor Authentication"),desc:rtl?"طبقة أمان إضافية":"Extra layer of security",...tog("twoFa")},
        {label:t("Session Timeout"),desc:rtl?"انتهاء تلقائي بعد":"Auto-expire after inactivity",...val("30 min")},
        {label:t("Audit Log"),desc:rtl?"تتبع جميع الإجراءات":"Track all system actions",...tog("auditLog")}]},
      {icon:"Bell",title:t("Notifications Preferences"),items:[
        {label:t("Email Notifications"),desc:rtl?"إشعارات البريد الإلكتروني":"Receive email alerts",...tog("emailNotif")},
        {label:t("SMS Alerts"),desc:rtl?"تنبيهات الرسائل النصية":"SMS for critical alerts",...tog("smsAlert")}]},
      {icon:"Plug",title:t("Integrations"),items:[
        {label:"ZATCA E-Invoice",desc:rtl?"ربط الفوترة الإلكترونية":"Saudi e-invoicing integration",...badge(t("Connected"),"rgba(10,94,215,.1)","#0A5ED7")},
        {label:"WhatsApp Business",desc:rtl?"إشعارات العملاء":"Customer notifications",...badge(t("Connected"),"rgba(10,94,215,.1)","#0A5ED7")},
        {label:"Accounting Software",desc:rtl?"تصدير البيانات المالية":"Financial data export",...badge(t("Disconnected"),"rgba(249,115,22,.1)","#F97316")}]},
      {icon:"Database",title:t("Data Management"),items:[
        {label:t("Auto Backup"),desc:rtl?"نسخ احتياطي يومي":"Daily automatic backup",...tog("autoBackup")},
        {label:t("Retention Period"),desc:rtl?"مدة الاحتفاظ بالبيانات":"How long to keep data",...val(t("1 year"))}]}
    ];
    return {rootClass:dark?"dark":"",dir:rtl?"rtl":"ltr",themeIcon:dark?"Sun":"Moon",langLabel:rtl?"English":"عربي",
      toggleTheme:()=>{localStorage.setItem("salis-theme",dark?"light":"dark");this.setState({dark:!dark});},
      toggleLang:()=>{const l=rtl?"en":"ar";localStorage.setItem("salis-lang",l);this.setState({lang:l});},
      navGroups,sections,
      t:{admin:t("ADMIN"),logout:t("Logout"),advSettings:t("Settings"),configureSystem:rtl?"تكوين النظام":"Configure your system",saveChanges:t("Save Changes")}};
  }
}
</script>
</body>
</html>
