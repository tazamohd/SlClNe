<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;ar&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;},&quot;userName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Khalid Al-Amri&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;}}">

class Component extends DCLogic {
  state={selRole:"advisor",edits:{},dark:null,lang:null,open:null,data:null};
  componentDidMount(){import("./gms-data.js").then(m=>this.setState({data:m}));}
  renderVals(){
    const dark=this.state.dark??((localStorage.getItem("salis-theme")??this.props.theme)==="dark");
    const lang=this.state.lang??(localStorage.getItem("salis-lang")??this.props.lang??"en");
    const rtl=lang==="ar",D=this.state.data;const t=s=>rtl&&D?(D.AR[s]||s):s;
    const NAV=D?(D.navFor?D.navFor(D.NAV):D.NAV):[];const open=this.state.open??NAV.map(g=>g.label);
    const navGroups=NAV.map(g=>{const isOpen=open.includes(g.label);return{label:t(g.label),open:isOpen,chev:isOpen?"ChevronDown":(rtl?"ChevronLeft":"ChevronRight"),toggle:()=>this.setState({open:isOpen?open.filter(x=>x!==g.label):[...open,g.label]}),items:g.items.map(it=>{const on=it.r==="roles-permissions";return{label:t(it.l),icon:g.icon,href:it.href||"#",style:"display:flex;align-items:center;gap:8px;padding:6px 12px;padding-inline-start:24px;border-radius:6px;cursor:pointer;font-family:var(--font-action);font-weight:500;font-size:12px;white-space:nowrap;overflow:hidden;text-decoration:none;"+(on?"background:var(--salis-gradient-r);color:#fff;box-shadow:var(--shadow)":"color:var(--text-primary)")}})};});
    const _rid=(D&&D.currentRole)?D.currentRole():null;const _rl=((D&&D.ROLES)||[]).find(x=>x.id===_rid);const userName=_rl?(rtl?_rl.demo.ar:_rl.demo.name):(this.props.userName??"Khalid Al-Amri");const roleLabel=_rl?(rtl?_rl.ar:_rl.label):null;
    const ic=(bg,fg)=>"padding:8px;border-radius:10px;background:"+bg+";color:"+fg+";display:flex";
    const pill=(bg,fg)=>"display:inline-flex;align-items:center;border-radius:9999px;padding:2px 10px;font-size:11px;font-weight:500;background:"+bg+";color:"+fg;
    const perm=(icon,label,color)=>({icon,label:t(label),color});
    const roles=[
      {name:t("Owner"),users:"1",icon:"Crown",iconStyle:ic("rgba(10,94,215,.1)","#0A5ED7"),type:t("System"),typeStyle:pill("rgba(10,94,215,.1)","#0A5ED7"),perms:[perm("Shield","Full Access","#0A5ED7"),perm("Settings","System Config","#0A5ED7"),perm("Users","User Mgmt","#0A5ED7")]},
      {name:t("Manager"),users:"2",icon:"Briefcase",iconStyle:ic("rgba(11,179,255,.1)","#0BB3FF"),type:t("System"),typeStyle:pill("rgba(10,94,215,.1)","#0A5ED7"),perms:[perm("Eye","Read All","#0BB3FF"),perm("Edit","Write Ops","#0BB3FF"),perm("BarChart3","Reports","#0BB3FF"),perm("Users","Team Mgmt","#0BB3FF")]},
      {name:t("Service Advisor"),users:"2",icon:"Headphones",iconStyle:ic("rgba(249,115,22,.1)","#F97316"),type:t("System"),typeStyle:pill("rgba(10,94,215,.1)","#0A5ED7"),perms:[perm("FileText","Job Cards","#F97316"),perm("Calendar","Appointments","#F97316"),perm("Receipt","Invoices","#F97316")]},
      {name:t("Technician"),users:"4",icon:"Wrench",iconStyle:ic("rgba(11,31,59,.1)","#0B1F3B"),type:t("System"),typeStyle:pill("rgba(10,94,215,.1)","#0A5ED7"),perms:[perm("ClipboardList","Assigned Jobs","#0B1F3B"),perm("Package","Parts Request","#0B1F3B")]},
      {name:t("Accountant"),users:"1",icon:"Calculator",iconStyle:ic("rgba(100,116,139,.1)","#64748B"),type:t("Custom"),typeStyle:pill("rgba(249,115,22,.1)","#F97316"),perms:[perm("Receipt","Invoices","#64748B"),perm("DollarSign","Payments","#64748B"),perm("BookOpen","Accounting","#64748B"),perm("PieChart","Finance Reports","#64748B")]}
    ];
    
    const RB_ROLES=(D&&D.ROLES)||[], RB_PERMS=(D&&D.PERMS)||{}, RB_FR=(D&&D.FIELD_RULES)||[];
    const MODS=[["dashboard","Dashboard"],["jobcards","Job Cards"],["appointments","Appointments"],["estimates","Estimates"],["customers","Customers"],["vehicles","Vehicles"],["inventory","Inventory"],["procurement","Procurement"],["invoices","Invoices"],["payments","Payments"],["accounting","Accounting"],["hr","HR & Payroll"],["technicians","Technicians"],["crm","CRM"],["callcenter","Call Center"],["reports","Reports"],["ai","AI Platform"],["admin","Administration"],["settings","Settings"],["audit","Audit Log"],["network","Parts Network"]];
    const ACTS=[["v","View"],["c","Create"],["e","Edit"],["d","Delete"],["a","Approve"],["x","Export"]];
    const selRole=this.state.selRole, edits=this.state.edits;
    const grantOf=mod=>{ const k=selRole+"|"+mod; return (k in edits)?edits[k]:((RB_PERMS[mod]||{})[selRole]||""); };
    const selMeta=RB_ROLES.find(r=>r.id===selRole)||{label:"",ar:"",icon:"User",limit:0,scope:"branch",color:"#0A5ED7"};
    const SCOPE_L={all:["All branches","كل الفروع"],branch:["Own branch","فرعه"],own:["Own jobs","أعماله"],self:["Own records","سجلاته"],external:["External only","خارجي فقط"],platform:["Platform","المنصة"]};
    const roleChips=RB_ROLES.map(r=>{
      const on=r.id===selRole;
      return {label:rtl?r.ar:r.label, icon:r.icon, pick:()=>this.setState({selRole:r.id}),
        style:"display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:9999px;cursor:pointer;font-size:12px;font-weight:600;font-family:var(--font-action);transition:all .15s ease;"+(on?"background:var(--salis-gradient);color:#fff;border:none":"background:var(--surface-card);color:var(--text-body);border:1px solid var(--border-default)")};
    });
    const visCount=MODS.filter(m=>grantOf(m[0]).includes("v")).length;
    const sc=SCOPE_L[selMeta.scope]||["—","—"];
    const selStats=[
      {label:t("Role"),value:rtl?selMeta.ar:selMeta.label,color:"var(--text-heading)"},
      {label:t("Data scope"),value:rtl?sc[1]:sc[0],color:"var(--salis-blue)"},
      {label:t("Approval limit"),value:selMeta.limit===null?t("Unlimited"):(selMeta.limit===0?t("No approval rights"):"SAR "+selMeta.limit.toLocaleString("en-US")),color:selMeta.limit===0?"var(--text-muted)":"#0BB3FF"},
      {label:t("Modules visible"),value:visCount+" / "+MODS.length,color:"var(--text-heading)"}];
    const rows=MODS.map(m=>{
      const g=grantOf(m[0]);
      return {label:t(m[1]), cells:ACTS.map(([a,al])=>{
        const on=g.includes(a);
        return {on, aria:t(al)+" "+t(m[1]),
          style:"width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s ease;"+(on?"background:var(--salis-gradient);border:none;color:#fff":"background:var(--surface-inset);border:1px solid var(--border-default);color:transparent"),
          toggle:()=>this.setState(st=>{
            const key=st.selRole+"|"+m[0];
            const cur=(key in st.edits)?st.edits[key]:((RB_PERMS[m[0]]||{})[st.selRole]||"");
            const next=cur.includes(a)?cur.split("").filter(x=>x!==a).join(""):cur+a;
            return {edits:{...st.edits,[key]:next}};
          })};
      })};
    });
    const hiddenFields=RB_FR.filter(f=>f.hidden.includes(selRole)).map(f=>rtl?f.ar:f.field);
    return{roleChips,selStats,rows,hiddenFields,hasHidden:hiddenFields.length>0,noHidden:hiddenFields.length===0,
      actHeads:ACTS.map(a=>t(a[1])),
      matrixSub:(rtl?selMeta.ar:selMeta.label)+" · "+visCount+" "+t("of")+" "+MODS.length+" "+t("modules"),
      grantAll:()=>this.setState(st=>{const e={...st.edits};MODS.forEach(m=>e[st.selRole+"|"+m[0]]="vcedax");return{edits:e};}),
      revokeAll:()=>this.setState(st=>{const e={...st.edits};MODS.forEach(m=>e[st.selRole+"|"+m[0]]="");return{edits:e};}),
      resetPerms:()=>this.setState({edits:{}}),
      rootClass:dark?"dark":"",dir:rtl?"rtl":"ltr",themeIcon:dark?"Sun":"Moon",langLabel:rtl?"English":"عربي",
      toggleTheme:()=>{localStorage.setItem("salis-theme",dark?"light":"dark");this.setState({dark:!dark});},
      toggleLang:()=>{const l=rtl?"en":"ar";localStorage.setItem("salis-lang",l);this.setState({lang:l});},
      userName,userInitial:userName.trim()[0]||"K",navGroups,roles,
      t:{pickRole:t("Select a role"),matrixH:t("Permission Matrix"),module:t("Module"),grantAll:t("Grant all"),revokeAll:t("Revoke all"),reset:t("Reset to default"),hiddenH:t("Fields hidden from this role"),nothingHidden:t("This role can see every field."),admin:roleLabel||t("ADMIN"),logout:t("Logout"),title:t("Roles & Permissions"),subtitle:t("Administration"),createRole:t("Create Role"),users:t("users")}};
  }
}

</script>
