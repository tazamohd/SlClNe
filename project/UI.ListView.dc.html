<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script src="./support.js"></script></head><body><x-dc>
<helmet><link rel="stylesheet" href="_ds/salis-auto-design-system-f22df384-eb3b-4838-99e5-e987504e70f0/styles.css"><script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script><script src="salis-icon.js"></script><style>body{margin:0;background:#F8FAFC}a{color:#0A5ED7;text-decoration:none}a:hover{color:#0952C0}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.hscroll::-webkit-scrollbar{display:none}</style></helmet>
<div class="{{ rootClass }}" dir="{{ dir }}" data-screen-label="List View" style="min-height:100vh;background:var(--bg-page);font-family:var(--font-ui,'Inter',sans-serif)">
<div style="height:56px;background:var(--surface-sidebar);border-bottom:1px solid var(--border-default);padding:0 24px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm)"><div style="display:flex;align-items:center;gap:8px"><div style="width:28px;height:28px;border-radius:8px;background:var(--salis-gradient);display:flex;align-items:center;justify-content:center"><salis-icon name="Car" size="14" style="color:#fff"></salis-icon></div><span style="font-size:14px;font-weight:700;color:var(--text-heading)">SALIS AUTO</span></div><span style="font-size:13px;color:var(--text-muted)">·</span><span style="font-size:13px;font-weight:600;color:var(--text-body)">{{ t.title }}</span><div style="flex:1"></div><button onClick="{{ toggleTheme }}" style="width:32px;height:32px;border-radius:8px;border:none;background:none;cursor:pointer;color:var(--text-muted);display:flex;align-items:center;justify-content:center"><salis-icon name="{{ themeIcon }}" size="16"></salis-icon></button></div>
<div style="padding:24px;display:flex;flex-direction:column;gap:20px;animation:fadeUp .3s ease">
<h2 style="margin:0;font-size:24px;font-family:var(--font-display);font-weight:900;color:var(--text-heading)">{{ t.title }}</h2>
<div style="max-width:820px;background:var(--surface-card);border-radius:16px;border:1px solid var(--border-default);box-shadow:var(--shadow-sm);overflow:hidden">
<sc-for list="{{ items }}" as="i" hint-placeholder-count="7">
<div style="display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--border-default);cursor:pointer;transition:background .15s" style-hover="background:rgba(10,94,215,.03)">
<span style="{{ i.iconStyle }}"><salis-icon name="{{ i.icon }}" size="16"></salis-icon></span>
<div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:8px"><p style="margin:0;font-size:14px;font-weight:500;color:var(--text-heading)">{{ i.title }}</p><span style="{{ i.stStyle }}">{{ i.status }}</span></div><p style="margin:2px 0 0;font-size:12px;color:var(--text-muted)">{{ i.meta }}</p></div>
<span style="font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--text-heading);flex-shrink:0" dir="ltr">{{ i.value }}</span>
<salis-icon name="ChevronRight" size="15" style="color:var(--text-muted);flex-shrink:0"></salis-icon>
</div></sc-for>
<div style="padding:12px 20px;display:flex;align-items:center"><span style="font-size:12px;color:var(--text-muted)">{{ t.showing }}</span><span style="flex:1"></span><div style="display:flex;gap:6px"><button style="width:30px;height:30px;border-radius:8px;border:1px solid var(--border-default);background:var(--surface-card);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-body)"><salis-icon name="ChevronLeft" size="13"></salis-icon></button><button style="width:30px;height:30px;border-radius:8px;border:1px solid var(--border-default);background:var(--surface-card);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-body)"><salis-icon name="ChevronRight" size="13"></salis-icon></button></div></div>
</div>
</div></div></x-dc>
