<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/salis-auto-design-system-f22df384-eb3b-4838-99e5-e987504e70f0/styles.css">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="salis-icon.js"></script>
<style>
body{margin:0;background:#F8FAFC}
a{color:#0A5ED7;text-decoration:none}a:hover{color:#0952C0;text-decoration:underline}
input::placeholder{color:#9BA4B0}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style>
</helmet>
<div class="{{ rootClass }}" dir="{{ dir }}" data-screen-label="Login-Mobile" style="min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg-page);font-family:var(--font-ui,'Inter',sans-serif)">
  <div style="position:absolute;inset:0;z-index:0;pointer-events:none">
    <div style="position:absolute;top:0;right:0;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(10,94,215,.12),transparent 65%);filter:blur(48px)"></div>
    <div style="position:absolute;bottom:0;left:0;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(11,179,255,.1),transparent 65%);filter:blur(48px)"></div>
  </div>
  <div style="position:relative;z-index:2;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:14px 16px">
    <button onClick="{{ toggleLang }}" aria-label="Toggle language" style="display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--border-default);background:var(--surface-card);cursor:pointer;color:var(--text-muted);font-family:var(--font-action);font-size:12px;font-weight:500"><salis-icon name="Globe" size="14"></salis-icon><span>{{ langLabel }}</span></button>
    <button onClick="{{ toggleTheme }}" aria-label="Toggle theme" style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;border:1px solid var(--border-default);background:var(--surface-card);cursor:pointer;color:var(--text-muted)"><salis-icon name="{{ themeIcon }}" size="16"></salis-icon></button>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:8px 16px 24px;position:relative;z-index:1;animation:fadeUp .3s ease">
    <div style="display:flex;flex-direction:column;gap:20px">
      <div style="display:flex;flex-direction:column;align-items:center;gap:14px">
        <div style="position:relative">
          <div style="position:absolute;inset:-12px;background:var(--salis-gradient);border-radius:16px;filter:blur(20px);opacity:.2"></div>
          <img src="assets/logo-blue-orange.png" alt="SALIS AUTO" style="position:relative;width:120px;height:auto;filter:drop-shadow(0 4px 8px rgba(0,0,0,.15))">
        </div>
        <div style="text-align:center">
          <h2 style="margin:0;font-family:var(--font-display);font-weight:700;font-size:22px;color:var(--text-heading)">{{ t.signIn }}</h2>
          <p style="margin:6px 0 0;font-family:var(--font-action);font-size:13px;color:var(--text-muted)">{{ t.creds }}</p>
        </div>
      </div>
      <form onSubmit="{{ submit }}" style="background:color-mix(in srgb,var(--surface-card) 92%,transparent);backdrop-filter:blur(24px);border:1px solid var(--border-default);border-radius:14px;box-shadow:var(--shadow-lg);padding:20px;display:flex;flex-direction:column;gap:18px">
        <div style="display:flex;flex-direction:column;gap:8px">
          <label for="email" style="font-family:var(--font-action);font-size:12px;font-weight:500;letter-spacing:.025em;color:var(--text-primary)">{{ t.email }}</label>
          <span style="position:relative;display:flex;align-items:center">
            <salis-icon name="Mail" size="18" style="position:absolute;inset-inline-start:12px;color:var(--text-muted);pointer-events:none;z-index:1"></salis-icon>
            <input id="email" type="email" placeholder="your@email.com" value="{{ email }}" onChange="{{ setEmail }}" style="width:100%;height:48px;border-radius:8px;border:1px solid var(--border-default);background:var(--surface-inset);padding:0 14px;padding-inline-start:38px;font-family:var(--font-action);font-size:15px;color:var(--text-primary);outline:none;box-sizing:border-box" style-focus="border-color:var(--ring);box-shadow:0 0 0 3px rgba(10,94,215,.15);background:var(--surface-card)">
          </span>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <label for="pw" style="font-family:var(--font-action);font-size:12px;font-weight:500;letter-spacing:.025em;color:var(--text-primary)">{{ t.password }}</label>
          <span style="position:relative;display:flex;align-items:center">
            <salis-icon name="Lock" size="18" style="position:absolute;inset-inline-start:12px;color:var(--text-muted);pointer-events:none;z-index:1"></salis-icon>
            <input id="pw" type="{{ pwType }}" placeholder="••••••••" value="{{ pw }}" onChange="{{ setPw }}" style="width:100%;height:48px;border-radius:8px;border:1px solid var(--border-default);background:var(--surface-inset);padding:0 14px;padding-inline-start:38px;padding-inline-end:44px;font-family:var(--font-action);font-size:15px;color:var(--text-primary);outline:none;box-sizing:border-box" style-focus="border-color:var(--ring);box-shadow:0 0 0 3px rgba(10,94,215,.15);background:var(--surface-card)">
            <button type="button" onClick="{{ toggleShow }}" aria-label="Toggle password visibility" style="position:absolute;inset-inline-end:12px;background:none;border:none;cursor:pointer;color:var(--text-muted);display:flex;padding:0"><salis-icon name="{{ eyeIcon }}" size="20"></salis-icon></button>
          </span>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
          <button type="button" onClick="{{ toggleRemember }}" style="display:flex;align-items:center;gap:8px;border:none;background:none;padding:0;cursor:pointer;font-family:var(--font-action);font-size:13px;color:var(--text-body)">
            <span style="{{ cbStyle }}"><sc-if value="{{ remember }}" hint-placeholder-val="{{ true }}"><salis-icon name="Check" size="12" stroke-width="3"></salis-icon></sc-if></span>
            <span>{{ t.remember }}</span>
          </button>
          <a href="ForgotPassword.Mobile.dc.html" style="font-family:var(--font-action);font-size:13px;font-weight:500">{{ t.forgot }}</a>
        </div>
        <button type="submit" style="width:100%;height:50px;border:none;border-radius:8px;background:var(--salis-gradient);color:#fff;font-family:var(--font-action);font-weight:600;font-size:15px;cursor:pointer;box-shadow:0 4px 12px rgba(10,94,215,.25)">{{ t.signIn }}</button>
        <p style="margin:0;text-align:center;font-size:13px;font-family:var(--font-action);color:var(--text-muted)">{{ t.noAcct }} <a href="Onboarding.Mobile.dc.html" style="font-weight:600">{{ t.register }}</a></p>
      </form>
    </div>
  </div>
  <sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;bottom:16px;left:16px;right:16px;z-index:100;display:flex;align-items:flex-start;gap:12px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow-lg);animation:fadeUp .25s ease">
      <span style="{{ toastIconStyle }}"><salis-icon name="{{ toastIcon }}" size="18"></salis-icon></span>
      <div style="flex:1"><p style="margin:0;font-size:14px;font-weight:600;color:var(--text-heading)">{{ toastTitle }}</p><p style="margin:2px 0 0;font-size:13px;color:var(--text-muted)">{{ toastDesc }}</p></div>
      <button onClick="{{ closeToast }}" aria-label="Dismiss" style="border:none;background:none;cursor:pointer;color:var(--text-muted);padding:0;display:flex"><salis-icon name="X" size="14"></salis-icon></button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;ar&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;}}">
class Component extends DCLogic {
  state={dark:null,lang:null,email:"",pw:"",show:false,remember:true,toast:null,AR:{}};
  componentDidMount(){import("./gms-data.js").then(m=>this.setState({AR:m.AR}));}
  renderVals(){
    const dark=this.state.dark??((localStorage.getItem("salis-theme")??this.props.theme)==="dark");
    const lang=this.state.lang??(localStorage.getItem("salis-lang")??this.props.lang??"en");
    const AR=this.state.AR,t=s=>lang==="ar"?(AR[s]||s):s;
    const toast=this.state.toast;
    return {
      rootClass:dark?"dark":"",dir:lang==="ar"?"rtl":"ltr",
      themeIcon:dark?"Sun":"Moon",langLabel:lang==="ar"?"English":"عربي",
      toggleTheme:()=>{localStorage.setItem("salis-theme",dark?"light":"dark");this.setState({dark:!dark});},
      toggleLang:()=>{const l=lang==="ar"?"en":"ar";localStorage.setItem("salis-lang",l);this.setState({lang:l});},
      t:{signIn:t("Sign In"),creds:t("Enter your credentials to access your account"),email:t("Email"),password:t("Password"),remember:t("Remember this device"),forgot:t("Forgot password?"),noAcct:t("Don't have an account?"),register:t("Register")},
      email:this.state.email,pw:this.state.pw,pwType:this.state.show?"text":"password",eyeIcon:this.state.show?"EyeOff":"Eye",
      setEmail:e=>this.setState({email:e.target.value}),setPw:e=>this.setState({pw:e.target.value}),
      toggleShow:()=>this.setState({show:!this.state.show}),
      remember:this.state.remember,toggleRemember:()=>this.setState({remember:!this.state.remember}),
      cbStyle:"width:18px;height:18px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s ease;"+(this.state.remember?"background:var(--salis-gradient);border:none;color:#fff":"background:var(--surface-inset);border:1.5px solid var(--border-strong);color:transparent"),
      submit:e=>{e.preventDefault();
        clearTimeout(this._tt);
        if(!this.state.email||!this.state.pw){
          this.setState({toast:{err:true,title:t("Error"),desc:t("Please fill in all fields")}});
          this._tt=setTimeout(()=>this.setState({toast:null}),3000);return;
        }
        this.setState({toast:{err:false,title:t("Success"),desc:t("Logged in successfully")}});
        setTimeout(()=>{location.href="Dashboard.Mobile.dc.html";},700);
      },
      hasToast:!!toast,toastTitle:toast?toast.title:"",toastDesc:toast?toast.desc:"",
      toastIcon:toast&&toast.err?"AlertCircle":"CheckCircle",
      toastIconStyle:"padding:6px;border-radius:8px;display:flex;flex-shrink:0;"+(toast&&toast.err?"background:rgba(249,115,22,.12);color:#F97316":"background:rgba(10,94,215,.12);color:var(--salis-blue)"),
      closeToast:()=>this.setState({toast:null})
    };
  }
}
</script>
</body>
</html>
