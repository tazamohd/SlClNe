<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/salis-auto-design-system-f22df384-eb3b-4838-99e5-e987504e70f0/styles.css">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="salis-icon.js"></script>
<style>body{margin:0;background:#F8FAFC}a{color:#0A5ED7;text-decoration:none}input::placeholder{color:#9BA4B0}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}</style>
</helmet>
<div class="{{ rootClass }}" dir="{{ dir }}" data-screen-label="Forgot-Password-Mobile" style="height:100vh;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;background:var(--bg-page);font-family:var(--font-ui,'Inter',sans-serif);padding:20px;box-sizing:border-box">
  <div style="position:relative;z-index:1;animation:fadeUp .3s ease">
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:20px">
      <img src="assets/logo-blue-orange.png" alt="SALIS AUTO" style="width:100px;height:auto">
      <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}"><h2 style="margin:0;font-family:var(--font-display);font-weight:700;font-size:19px;color:var(--text-heading);text-align:center">{{ t.checkEmail }}</h2><p style="margin:0;font-family:var(--font-action);font-size:12px;color:var(--text-muted);text-align:center">{{ t.sentDesc }}</p></sc-if>
      <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}"><h2 style="margin:0;font-family:var(--font-display);font-weight:700;font-size:19px;color:var(--text-heading);text-align:center">{{ t.reset }}</h2><p style="margin:0;font-family:var(--font-action);font-size:12px;color:var(--text-muted);text-align:center">{{ t.willSend }}</p></sc-if>
    </div>
    <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
      <form onSubmit="{{ submit }}" style="display:flex;flex-direction:column;gap:14px">
        <input type="email" placeholder="your@email.com" value="{{ email }}" onChange="{{ setEmail }}" style="width:100%;height:48px;border-radius:8px;border:1px solid var(--border-default);background:var(--surface-inset);padding:0 14px;font-size:14px;color:var(--text-primary);outline:none;box-sizing:border-box">
        <button type="submit" style="width:100%;height:48px;border:none;border-radius:8px;background:var(--salis-gradient);color:#fff;font-family:var(--font-action);font-weight:600;font-size:15px;cursor:pointer;box-shadow:0 4px 12px rgba(10,94,215,.25);white-space:nowrap;box-sizing:border-box">{{ t.sendLink }}</button>
      </form>
    </sc-if>
    <a href="Login.Mobile.dc.html" style="display:block;text-align:center;margin-top:16px;font-family:var(--font-action);font-size:13px;font-weight:500">{{ t.backToSignIn }}</a>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;ar&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;}}">
class Component extends DCLogic {
  state={dark:null,lang:null,AR:{},email:"",sent:false};
  componentDidMount(){import("./gms-data.js").then(m=>this.setState({AR:m.AR}));}
  renderVals(){
    const dark=this.state.dark??((localStorage.getItem("salis-theme")??this.props.theme)==="dark");
    const lang=this.state.lang??(localStorage.getItem("salis-lang")??this.props.lang??"en");
    const AR=this.state.AR,t=s=>lang==="ar"?(AR[s]||s):s;
    return {rootClass:dark?"dark":"",dir:lang==="ar"?"rtl":"ltr",
      email:this.state.email,setEmail:e=>this.setState({email:e.target.value}),
      sent:this.state.sent,notSent:!this.state.sent,
      submit:e=>{e.preventDefault();if(this.state.email)this.setState({sent:true});},
      t:{reset:t("Reset Password"),willSend:t("We'll send a reset link to your email"),sendLink:t("Send Reset Link"),backToSignIn:t("Back to Sign In"),checkEmail:t("Check your email"),sentDesc:t("We sent a password reset link to your email address")}};
  }
}

</script>
</body>
</html>
