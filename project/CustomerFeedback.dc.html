<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/salis-auto-design-system-f22df384-eb3b-4838-99e5-e987504e70f0/styles.css">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="salis-icon.js"></script>
<style>body{margin:0;background:#F8FAFC}a{color:#0A5ED7;text-decoration:none}textarea::placeholder{color:#9BA4B0}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}</style>
</helmet>
<div class="{{ rootClass }}" dir="{{ dir }}" data-screen-label="Customer-Feedback" style="max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg-page);font-family:var(--font-ui,'Inter',sans-serif)">
  <div style="padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border-default);background:var(--surface-sidebar)">
    <a href="CustomerPortal.dc.html" style="display:flex;color:var(--text-muted)"><salis-icon name="{{ backChev }}" size="20"></salis-icon></a>
    <h1 style="margin:0;font-size:17px;font-family:var(--font-display);font-weight:800;color:var(--text-heading);flex:1">{{ t.feedback }}</h1>
  </div>
  <div style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px;animation:fadeUp .3s ease;-webkit-overflow-scrolling:touch">
    <!-- Service Summary -->
    <div style="background:var(--salis-gradient);border-radius:14px;padding:18px;color:#fff;display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:center;gap:8px"><salis-icon name="CheckCircle" size="18"></salis-icon><span style="font-size:14px;font-weight:700">{{ t.serviceComplete }}</span></div>
      <p style="margin:0;font-size:16px;font-weight:800">Toyota Camry 2022</p>
      <div style="display:flex;gap:16px;font-size:12px;opacity:.8">
        <span dir="ltr">JC-A3F8B2C1</span><span>{{ t.maintenance }}</span><span dir="ltr">SAR 2,116</span>
      </div>
    </div>
    <!-- Star Rating -->
    <div style="background:var(--surface-card);border:1px solid var(--border-default);border-radius:12px;padding:20px;text-align:center;display:flex;flex-direction:column;gap:12px">
      <h3 style="margin:0;font-size:15px;font-weight:700;color:var(--text-heading)">{{ t.rateExperience }}</h3>
      <div style="display:flex;justify-content:center;gap:8px">
        <sc-for list="{{ stars }}" as="star" hint-placeholder-count="5">
          <button onClick="{{ star.select }}" style="border:none;background:none;cursor:pointer;padding:4px;font-size:32px;transition:transform .15s ease;{{ star.style }}" style-hover="transform:scale(1.2)">★</button>
        </sc-for>
      </div>
      <p style="margin:0;font-size:13px;color:var(--salis-blue);font-weight:600">{{ ratingLabel }}</p>
    </div>
    <!-- Category Ratings -->
    <div style="background:var(--surface-card);border:1px solid var(--border-default);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px">
      <h3 style="margin:0;font-size:13px;font-weight:700;color:var(--text-heading)">{{ t.rateCategories }}</h3>
      <sc-for list="{{ categories }}" as="cat" hint-placeholder-count="4">
        <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-default)">
          <span style="flex:1;font-size:13px;color:var(--text-body)">{{ cat.label }}</span>
          <div style="display:flex;gap:3px">
            <sc-for list="{{ cat.stars }}" as="cs" hint-placeholder-count="5">
              <button onClick="{{ cs.select }}" style="border:none;background:none;cursor:pointer;padding:0;font-size:16px;{{ cs.style }}">★</button>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
    <!-- Comment -->
    <div style="background:var(--surface-card);border:1px solid var(--border-default);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px">
      <label style="font-family:var(--font-action);font-size:11px;font-weight:500;color:var(--text-primary)">{{ t.additionalComments }}</label>
      <textarea rows="3" placeholder="{{ t.commentPlaceholder }}" style="width:100%;border-radius:8px;border:1px solid var(--border-default);background:var(--surface-inset);padding:10px 12px;font-family:var(--font-ui);font-size:13px;color:var(--text-primary);outline:none;box-sizing:border-box;resize:none" style-focus="border-color:var(--ring);box-shadow:0 0 0 3px rgba(10,94,215,.15)"></textarea>
    </div>
    <button style="width:100%;height:50px;border:none;border-radius:8px;background:var(--salis-gradient);color:#fff;font-family:var(--font-action);font-weight:600;font-size:15px;cursor:pointer;box-shadow:0 4px 12px rgba(10,94,215,.25);display:flex;align-items:center;justify-content:center;gap:8px;flex-shrink:0"><salis-icon name="Send" size="16"></salis-icon>{{ t.submitFeedback }}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:932},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;ar&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;}}">
class Component extends DCLogic {
  state={dark:null,lang:null,AR:{},rating:4,catRatings:{quality:5,timeliness:4,communication:4,value:3}};
  componentDidMount(){import("./gms-data.js").then(m=>this.setState({AR:m.AR}));}
  renderVals(){
    const dark=this.state.dark??((localStorage.getItem("salis-theme")??this.props.theme)==="dark");
    const lang=this.state.lang??(localStorage.getItem("salis-lang")??this.props.lang??"en");
    const rtl=lang==="ar",AR=this.state.AR,t=s=>rtl?(AR[s]||s):s;
    const r=this.state.rating;
    const labels=rtl?["ضعيف","مقبول","جيد","جيد جداً","ممتاز"]:["Poor","Fair","Good","Very Good","Excellent"];
    const stars=Array.from({length:5},(_,i)=>({select:()=>this.setState({rating:i+1}),style:i<r?"color:var(--salis-orange)":"color:var(--border-strong)"}));
    const CR=this.state.catRatings;
    const catKeys=[["quality",rtl?"جودة العمل":"Work Quality"],["timeliness",rtl?"الالتزام بالوقت":"Timeliness"],["communication",rtl?"التواصل":"Communication"],["value",rtl?"القيمة مقابل السعر":"Value for Money"]];
    const categories=catKeys.map(([key,label])=>{const val=CR[key];return{label,stars:Array.from({length:5},(_,i)=>({select:()=>this.setState(s=>({catRatings:{...s.catRatings,[key]:i+1}})),style:i<val?"color:var(--salis-orange)":"color:var(--border-strong)"}))};});
    return{rootClass:dark?"dark":"",dir:rtl?"rtl":"ltr",backChev:rtl?"ChevronRight":"ChevronLeft",stars,categories,ratingLabel:labels[r-1]||"",
      t:{feedback:rtl?"تقييم الخدمة":"Service Feedback",serviceComplete:rtl?"تمت الخدمة بنجاح":"Service Completed",
        maintenance:t("Maintenance")+" & "+t("Repair"),rateExperience:rtl?"كيف كانت تجربتك؟":"How was your experience?",
        rateCategories:rtl?"قيّم التفاصيل":"Rate the Details",additionalComments:rtl?"ملاحظات إضافية":"Additional Comments",
        commentPlaceholder:rtl?"شاركنا رأيك...":"Share your thoughts...",submitFeedback:rtl?"إرسال التقييم":"Submit Feedback"}};
  }
}
</script>
</body>
</html>
