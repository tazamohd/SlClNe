<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/salis-auto-design-system-f22df384-eb3b-4838-99e5-e987504e70f0/styles.css">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="salis-icon.js"></script>
<style>body{margin:0;background:#F8FAFC}a{color:#0A5ED7;text-decoration:none}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}</style>
</helmet>
<div class="{{ rootClass }}" dir="{{ dir }}" data-screen-label="Signature-Mobile" style="min-height:100vh;display:flex;flex-direction:column;background:var(--bg-page);font-family:var(--font-ui,'Inter',sans-serif)">
  <div style="padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border-default);background:var(--surface-sidebar)">
    <a href="WorkshopDelivery.Mobile.dc.html" style="display:flex;color:var(--text-muted)"><salis-icon name="{{ backChev }}" size="20"></salis-icon></a>
    <div style="flex:1"><h1 style="margin:0;font-size:17px;font-family:var(--font-display);font-weight:800;color:var(--text-heading)">{{ t.customerSignature }}</h1></div>
    <button onClick="{{ toggleTheme }}" style="width:32px;height:32px;border-radius:8px;border:none;background:none;cursor:pointer;color:var(--text-muted);display:flex;align-items:center;justify-content:center"><salis-icon name="{{ themeIcon }}" size="16"></salis-icon></button>
  </div>
  <div style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;animation:fadeUp .3s ease;-webkit-overflow-scrolling:touch">
    <!-- Job Summary -->
    <div style="background:var(--surface-card);border:1px solid var(--border-default);border-radius:12px;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div><span style="font-size:10px;color:var(--text-muted)">{{ t.jobCard }}</span><p style="margin:2px 0 0;font-size:13px;font-weight:700;color:var(--text-heading)" dir="ltr">JC-A3F8B2C1</p></div>
      <div><span style="font-size:10px;color:var(--text-muted)">{{ t.customer }}</span><p style="margin:2px 0 0;font-size:13px;font-weight:600;color:var(--text-heading)">Ahmed Al-Rashid</p></div>
      <div><span style="font-size:10px;color:var(--text-muted)">{{ t.vehicle }}</span><p style="margin:2px 0 0;font-size:13px;color:var(--text-body)">Toyota Camry 2022</p></div>
      <div><span style="font-size:10px;color:var(--text-muted)">{{ t.totalAmount }}</span><p style="margin:2px 0 0;font-size:13px;font-weight:700;font-family:var(--font-mono);color:var(--text-heading)" dir="ltr">SAR 1,546.75</p></div>
      <div><span style="font-size:10px;color:var(--text-muted)">{{ t.service }}</span><p style="margin:2px 0 0;font-size:13px;color:var(--text-body)">{{ t.maintenanceRepair }}</p></div>
      <div><span style="font-size:10px;color:var(--text-muted)">{{ t.dateTime }}</span><p style="margin:2px 0 0;font-size:13px;color:var(--text-body)">Jul 22, 2026</p></div>
    </div>
    <!-- Signature Pad -->
    <div style="background:var(--surface-card);border:1px solid var(--border-default);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:center;justify-content:space-between"><h3 style="margin:0;font-size:13px;font-weight:700;color:var(--text-heading)">{{ t.signBelow }}</h3><button onClick="{{ clearSig }}" style="height:28px;padding:0 10px;border-radius:6px;border:1px solid var(--border-default);background:none;color:var(--text-muted);font-family:var(--font-action);font-size:11px;cursor:pointer;display:flex;align-items:center;gap:4px"><salis-icon name="Eraser" size="12"></salis-icon>{{ t.clear }}</button></div>
      <div onClick="{{ doSign }}" style="height:180px;border-radius:10px;border:2px dashed var(--border-strong);background:var(--surface-inset);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden">
        <sc-if value="{{ hasSig }}" hint-placeholder-val="{{ false }}">
          <svg viewBox="0 0 400 120" style="width:260px;height:auto"><path d="M20,80 C40,20 80,100 120,60 S180,20 220,60 S280,100 320,40 S360,80 380,60" stroke="var(--text-heading)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </sc-if>
        <sc-if value="{{ noSig }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--text-muted)"><salis-icon name="PenTool" size="22"></salis-icon><span style="font-size:12px">{{ t.tapToSign }}</span></div>
        </sc-if>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <button onClick="{{ toggleAgree }}" style="{{ agreeStyle }}"><sc-if value="{{ agreed }}" hint-placeholder-val="{{ false }}"><salis-icon name="Check" size="12" stroke-width="3"></salis-icon></sc-if></button>
        <span style="font-size:12px;color:var(--text-body)">{{ t.iAuthorize }}</span>
      </div>
    </div>
    <button onClick="{{ confirmSig }}" style="{{ confirmStyle }}"><salis-icon name="CheckCircle" size="18"></salis-icon>{{ t.confirmSignature }}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;ar&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Variant&quot;}}">
class Component extends DCLogic {
  state={dark:null,lang:null,AR:{},signed:false,agreed:false};
  componentDidMount(){import("./gms-data.js").then(m=>this.setState({AR:m.AR}));}
  renderVals(){
    const dark=this.state.dark??((localStorage.getItem("salis-theme")??this.props.theme)==="dark");
    const lang=this.state.lang??(localStorage.getItem("salis-lang")??this.props.lang??"en");
    const rtl=lang==="ar",AR=this.state.AR,t=s=>rtl?(AR[s]||s):s;
    const signed=this.state.signed,agreed=this.state.agreed,canConfirm=signed&&agreed;
    return{rootClass:dark?"dark":"",dir:rtl?"rtl":"ltr",themeIcon:dark?"Sun":"Moon",backChev:rtl?"ChevronRight":"ChevronLeft",
      toggleTheme:()=>{localStorage.setItem("salis-theme",dark?"light":"dark");this.setState({dark:!dark});},
      toggleLang:()=>{const l=rtl?"en":"ar";localStorage.setItem("salis-lang",l);this.setState({lang:l});},
      hasSig:signed,noSig:!signed,agreed,doSign:()=>this.setState({signed:true}),clearSig:()=>this.setState({signed:false}),
      toggleAgree:()=>this.setState({agreed:!agreed}),
      agreeStyle:"width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;border:none;"+(agreed?"background:var(--salis-gradient);color:#fff":"background:var(--surface-inset);border:1.5px solid var(--border-strong);color:transparent"),
      confirmStyle:"width:100%;height:50px;border:none;border-radius:8px;font-family:var(--font-action);font-weight:600;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;flex-shrink:0;"+(canConfirm?"background:var(--salis-gradient);color:#fff;box-shadow:0 4px 12px rgba(10,94,215,.25)":"background:var(--surface-inset);color:var(--text-muted);pointer-events:none"),
      confirmSig:()=>{if(canConfirm)location.href="Dashboard.Mobile.dc.html";},
      t:{customerSignature:t("Customer Signature"),jobCard:t("Job Card"),customer:t("Customer"),vehicle:t("Vehicle"),service:t("Service"),
        totalAmount:rtl?"المبلغ الإجمالي":"Total Amount",dateTime:t("Date & Time"),maintenanceRepair:t("Maintenance")+" & "+t("Repair"),
        signBelow:t("Sign below"),clear:t("Clear"),tapToSign:rtl?"انقر للتوقيع":"Tap to sign",iAuthorize:t("I authorize the above work"),confirmSignature:t("Confirm Signature")}};
  }
}
</script>
</body>
</html>
