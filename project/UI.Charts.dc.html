<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script src="./support.js"></script></head><body><x-dc>
<helmet><link rel="stylesheet" href="_ds/salis-auto-design-system-f22df384-eb3b-4838-99e5-e987504e70f0/styles.css"><script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script><script src="salis-icon.js"></script><style>body{margin:0;background:#F8FAFC}a{color:#0A5ED7;text-decoration:none}a:hover{color:#0952C0}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.hscroll::-webkit-scrollbar{display:none}</style></helmet>
<div class="{{ rootClass }}" dir="{{ dir }}" data-screen-label="Charts" style="min-height:100vh;background:var(--bg-page);font-family:var(--font-ui,'Inter',sans-serif)">
<div style="height:56px;background:var(--surface-sidebar);border-bottom:1px solid var(--border-default);padding:0 24px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm)"><div style="display:flex;align-items:center;gap:8px"><div style="width:28px;height:28px;border-radius:8px;background:var(--salis-gradient);display:flex;align-items:center;justify-content:center"><salis-icon name="Car" size="14" style="color:#fff"></salis-icon></div><span style="font-size:14px;font-weight:700;color:var(--text-heading)">SALIS AUTO</span></div><span style="font-size:13px;color:var(--text-muted)">·</span><span style="font-size:13px;font-weight:600;color:var(--text-body)">{{ t.title }}</span><div style="flex:1"></div><button onClick="{{ toggleTheme }}" style="width:32px;height:32px;border-radius:8px;border:none;background:none;cursor:pointer;color:var(--text-muted);display:flex;align-items:center;justify-content:center"><salis-icon name="{{ themeIcon }}" size="16"></salis-icon></button></div>
<div style="padding:24px;display:flex;flex-direction:column;gap:20px;animation:fadeUp .3s ease">
<h2 style="margin:0;font-size:24px;font-family:var(--font-display);font-weight:900;color:var(--text-heading)">{{ t.title }}</h2>
<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:20px">
<div style="background:var(--surface-card);border-radius:16px;padding:22px;border:1px solid var(--border-default);box-shadow:var(--shadow-sm)">
<h3 style="margin:0 0 18px;font-size:15px;font-weight:700;color:var(--text-heading)">{{ t.area }}</h3>
<svg viewBox="0 0 520 200" style="width:100%;height:auto;display:block"><defs><linearGradient id="cA" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0A5ED7" stop-opacity="0.3"></stop><stop offset="100%" stop-color="#0A5ED7" stop-opacity="0"></stop></linearGradient></defs><path d="M20,158 C80,146 140,122 200,112 C260,102 320,90 380,68 C430,50 480,36 500,30 L500,172 L20,172 Z" fill="url(#cA)"></path><path d="M20,158 C80,146 140,122 200,112 C260,102 320,90 380,68 C430,50 480,36 500,30" fill="none" stroke="#0A5ED7" stroke-width="2.5" stroke-linecap="round"></path><text x="20" y="190" font-size="10" fill="#64748B" font-family="Inter,sans-serif">Jan</text><text x="200" y="190" font-size="10" fill="#64748B" font-family="Inter,sans-serif">Mar</text><text x="380" y="190" font-size="10" fill="#64748B" font-family="Inter,sans-serif">May</text><text x="486" y="190" font-size="10" fill="#64748B" font-family="Inter,sans-serif">Jul</text></svg>
</div>
<div style="background:var(--surface-card);border-radius:16px;padding:22px;border:1px solid var(--border-default);box-shadow:var(--shadow-sm)">
<h3 style="margin:0 0 18px;font-size:15px;font-weight:700;color:var(--text-heading)">{{ t.bar }}</h3>
<div style="display:flex;align-items:flex-end;gap:12px;height:160px"><sc-for list="{{ bars }}" as="b" hint-placeholder-count="7"><div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px"><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted)">{{ b.v }}</span><div style="width:100%;height:{{ b.h }}px;background:{{ b.color }};border-radius:6px 6px 0 0"></div><span style="font-size:10px;color:var(--text-muted)">{{ b.label }}</span></div></sc-for></div>
</div>
<div style="background:var(--surface-card);border-radius:16px;padding:22px;border:1px solid var(--border-default);box-shadow:var(--shadow-sm)">
<h3 style="margin:0 0 18px;font-size:15px;font-weight:700;color:var(--text-heading)">{{ t.donut }}</h3>
<div style="display:flex;align-items:center;gap:24px">
<svg viewBox="0 0 140 140" style="width:150px;height:150px;flex-shrink:0"><sc-for list="{{ donut }}" as="d" hint-placeholder-count="4"><circle cx="70" cy="70" r="52" fill="none" stroke="{{ d.color }}" stroke-width="20" stroke-dasharray="{{ d.dash }}" stroke-dashoffset="{{ d.offset }}" transform="rotate(-90 70 70)"></circle></sc-for><text x="70" y="66" font-size="20" font-weight="800" fill="var(--text-heading)" text-anchor="middle" font-family="Montserrat,Inter,sans-serif">342</text><text x="70" y="84" font-size="10" fill="#64748B" text-anchor="middle" font-family="Inter,sans-serif">jobs</text></svg>
<div style="flex:1;display:flex;flex-direction:column;gap:10px"><sc-for list="{{ donut }}" as="d" hint-placeholder-count="4"><div style="display:flex;align-items:center;gap:8px"><span style="width:9px;height:9px;border-radius:3px;background:{{ d.color }};flex-shrink:0"></span><span style="flex:1;font-size:12px;color:var(--text-body)">{{ d.label }}</span><span style="font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--text-muted)">{{ d.pct }}%</span></div></sc-for></div>
</div></div>
<div style="background:var(--surface-card);border-radius:16px;padding:22px;border:1px solid var(--border-default);box-shadow:var(--shadow-sm)">
<h3 style="margin:0 0 18px;font-size:15px;font-weight:700;color:var(--text-heading)">{{ t.progress }}</h3>
<div style="display:flex;flex-direction:column;gap:16px"><sc-for list="{{ progress }}" as="p" hint-placeholder-count="4"><div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px"><span style="color:var(--text-body)">{{ p.label }}</span><span style="font-family:var(--font-mono);font-weight:600;color:var(--text-muted)">{{ p.display }}</span></div><div style="height:8px;background:rgba(10,94,215,.08);border-radius:9999px;overflow:hidden"><div style="height:100%;width:{{ p.pct }}%;background:{{ p.color }};border-radius:9999px"></div></div></div></sc-for></div>
</div>
</div>
</div></div></x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"dark","tsType":"string","section":"Variant"}}'>
class Component extends DCLogic{state={dark:null};renderVals(){const dark=this.state.dark??((localStorage.getItem("salis-theme")??this.props.theme)==="dark");const t=s=>s;const ic=(bg,fg)=>"padding:6px;border-radius:8px;background:"+bg+";color:"+fg+";display:flex";const pill=(bg,fg)=>"display:inline-flex;align-items:center;border-radius:9999px;padding:2px 10px;font-size:11px;font-weight:500;background:"+bg+";color:"+fg;
const bars=[["Mon",48,"#0A5ED7"],["Tue",72,"#0A5ED7"],["Wed",96,"#0A5ED7"],["Thu",84,"#0A5ED7"],["Fri",120,"#0A5ED7"],["Sat",62,"#0BB3FF"],["Sun",30,"#0BB3FF"]].map(b=>({label:b[0],h:String(b[1]),v:String(Math.round(b[1]/3)),color:b[2]}));
const C=2*Math.PI*52;const segs=[["Maintenance",35,"#0A5ED7"],["Repair",28,"#0BB3FF"],["Diagnostics",18,"#F97316"],["Other",19,"#0B1F3B"]];
let acc=0;const donut=segs.map(s=>{const len=C*s[1]/100;const seg={label:s[0],pct:String(s[1]),color:s[2],dash:len.toFixed(1)+" "+(C-len).toFixed(1),offset:(-acc).toFixed(1)};acc+=len;return seg;});
const progress=[["Revenue Target","SAR 1.28M / 1.5M",85,"#0A5ED7"],["Jobs Target","342 / 400",85,"#0BB3FF"],["Bay Utilization","86%",86,"#F97316"],["NPS Score","72 / 80",90,"#0B1F3B"]].map(p=>({label:p[0],display:p[1],pct:String(p[2]),color:p[3]}));
const extra={bars,donut,progress,t:{title:"Charts",area:"Revenue Trend",bar:"Jobs by Day",donut:"Service Mix",progress:"Targets"}};
return{rootClass:dark?"dark":"",dir:"ltr",themeIcon:dark?"Sun":"Moon",toggleTheme:()=>{localStorage.setItem("salis-theme",dark?"light":"dark");this.setState({dark:!dark})},...extra};}}</script></body></html>
