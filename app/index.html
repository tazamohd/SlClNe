<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page paint under the notch and the home
         indicator, which is what makes env(safe-area-inset-*) non-zero. The
         shells then pad themselves back off those edges with the --safe-*
         tokens; without this attribute those insets are always 0. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="/assets/logo-blue-orange.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- iOS composites an apple-touch-icon onto an opaque background and shows
         it at 180px, where the logo's near-white wordmark on transparency
         disappears. This is the same artwork on the brand plate. The favicon
         above keeps the transparent original: it renders at 16px against
         browser chrome, where the plate would read as a navy square. -->
    <link rel="apple-touch-icon" href="/assets/icon-192.png" />
    <meta name="theme-color" content="#0A5ED7" />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/poppins-600-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="description" content="Integrated automotive workshop management system — scheduling, invoicing, parts, CRM, and more." />
    <meta property="og:title" content="SALIS AUTO" />
    <meta property="og:description" content="Integrated automotive workshop management system — scheduling, invoicing, parts, CRM, and more." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/assets/logo-blue-orange.png" />
    <title>SALIS AUTO</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;font-family:system-ui,sans-serif;padding:2rem;text-align:center">
        <div>
          <h1 style="font-size:1.5rem;font-weight:700;color:#0B1F3B;margin-bottom:0.5rem">SALIS AUTO</h1>
          <p style="color:#64748B">JavaScript is required to run this application. Please enable JavaScript in your browser settings.</p>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
