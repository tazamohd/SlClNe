<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="SALISCO">
  <title>SALISCO profile picture</title>
  <!-- Monogram on SALIS Navy with the family's circuit-trace motif. Set in Montserrat 800;
       convert to outlines before use where the font cannot load. Safe for circular crops:
       everything that matters sits inside the centre 72%. -->
  <defs>
    <linearGradient id="trace" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0A5ED7"/>
      <stop offset="1" stop-color="#0BB3FF"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="#0B1F3B"/>
  <g fill="none" stroke="url(#trace)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity=".55">
    <path d="M80 820 H300 L400 720 H620"/>
    <path d="M160 200 H360 L460 300 H760 L860 200"/>
    <path d="M560 900 H800 L900 800"/>
  </g>
  <g opacity=".55">
    <circle cx="80" cy="820" r="26" fill="#0BB3FF"/>
    <circle cx="620" cy="720" r="26" fill="#0B1F3B" stroke="#0BB3FF" stroke-width="22"/>
    <circle cx="160" cy="200" r="26" fill="#F97316"/>
    <circle cx="860" cy="200" r="26" fill="#0B1F3B" stroke="#0A5ED7" stroke-width="22"/>
    <circle cx="900" cy="800" r="26" fill="#F97316"/>
    <circle cx="560" cy="900" r="26" fill="#0B1F3B" stroke="#F97316" stroke-width="22"/>
  </g>
  <text x="472" y="632" text-anchor="middle" font-family="Montserrat, Inter, system-ui, sans-serif" font-weight="800" font-size="400" letter-spacing="-16" fill="#FFFFFF">SC</text>
  <circle cx="770" cy="600" r="34" fill="#F97316"/>
</svg>
